# Skill project manifest for the tla-spec-dev PLUGIN.
#
# What this declares: the units this repository's own agents and its validation
# surfaces need, and the paths in the working tree whose content belongs to one
# of those units.
#
# How the home is produced — read this before running `project resolve`
# ---------------------------------------------------------------------
# `project resolve` writes into whatever `SKILL_MANAGER_HOME` names. Run it
# before this checkout has its own home and it mutates the operator's global
# ~/.skill-manager. Create the local home first, point `SKILL_MANAGER_HOME` at
# it, and only then resolve:
#
#   mkdir -p .skill-manager/skills
#   SKILL_MANAGER_CLI=<epic skill-manager> \
#     bash <git-integration-repo>/scripts/bootstrap-home.sh --root "$PWD" --force
#   export SKILL_MANAGER_HOME="$PWD/.skill-manager"
#   skill-manager project resolve --skip-gateway
#
# Coords are git-only (github:/git+/file:) and they name the REPO, not
# the installed unit — see skill-publisher's references/coords-and-distribution.md.
# The table key is the installed unit name, which is what `[[vendored]]`
# `from_unit` and `.skill-manager/skills/<name>` both use.
#
# This repository IS the tla-spec-dev plugin (skill surface at
# skills/spec-double-2/), so it does not declare
# itself: `specs/program_model/production_adapters.py` and the pytest suite
# import `spec_double_compiler` from this working tree, and the spec lifecycle
# runs `python3 skills/spec-double-2/scripts/tla_spec_dev.py`, never the installed
# clone.

[project]
name = "tla-spec-dev"
version = "0.1.0"
description = "Generate and maintain Python spec doubles from constrained, annotated TLA+ specifications, validated by a Test Graph project and the specs/program_model adapters."

# --- validation: the test_graph project at test_graph/ is composed from the
#     test-graph Gradle SDK and build-logic, vendored below. Its three graphs
#     (specWorkflow, cliWorkflow, effectProviderExamples) are the repository's
#     integration surface ---
#
# SI-02: `[skills.test-graph]` IS GONE, and its absence is the point.
#
# test-graph is now a CONTAINED SKILL of this plugin, at skills/test-graph/. A
# contained skill is not a separately installable unit, so there is nothing for
# `[skills.test-graph]` to resolve to; and the coord it used to carry
# (github:haydenrear/test_graph_skill) still resolves, which is worse than an
# error — it would install a SECOND, standalone copy of a skill this repository
# already carries, at its own version, change-managed separately. That is the
# exact incoherence the bundle exists to prevent
# (plugin-repository/references/imports.md § "silently duplicates").
#
# This repository IS the tla-spec-dev plugin, so it does not declare itself
# here for test-graph any more than it does for spec-double-2.

# --- required BY this unit's own SKILL.md, not chosen here. Its `skill-imports`
#     name skill-manager references/cli.md (how the declared tlc2/pytest/jinja2
#     CLI tools are exposed) and references/skills.md (installable-unit layout),
#     and `project resolve` refuses the whole resolve with "references missing
#     unit" until the unit carrying them is declared ---
#
# SI-02: `[skills.skill-manager]` and `[skills.unit-authoring]` are GONE for the
# same reason, one tier up. Both are contained skills of the `skt` PLUGIN, and
# `references/projects.md` is explicit: "A plugin declared as `[skills.<name>]`
# is refused by `project resolve`, and a unit that skt now provides
# (skill-manager, skill-publisher) is deleted from the manifest rather than
# re-declared." `skt status` in this checkout's home had been printing that same
# remedy for the `[skills.skill-manager]` block on every run.

# SI-16: `[plugins.skt]` IS GONE, and that single deleted line is the whole
# point of the ticket -- it WAS the two-units-not-one state. skt is no longer
# a separately installed plugin; it is a CONTAINED SKILL of this one, at
# skills/skt/, shipped and versioned with everything else here. Its plugin
# surface did not disappear, it moved UP: the hooks to this root's hooks/
# and its CLI dep to skill-manager-plugin.toml. Re-declaring the coord would
# install a SECOND, standalone copy of a skill this repository now carries --
# the same incoherence the test-graph note above describes.

# --- vendored: DELETED by SI-11, and the deletion is the finding ---
#
# There used to be a `[[vendored]]` block here declaring that
# `test_graph/{sdk,build-logic,standard-nodes}` must resolve into THIS
# project's own Skill Manager home. SI-02 rewrote its `from_unit` to
# `tla-spec-dev` with `from_subpath = "skills/test-graph/project_sdk_sources"`
# and flagged the line as its highest-uncertainty guess, because it never ran
# `project resolve` against it. SI-11 ran it. It fails, and it cannot be
# repaired by editing these two fields:
#
#   ✗ project vendored paths are invalid: 3 declared path(s) do not point at
#     the project's own skill-manager home
#     expected:  ../.skill-manager/skills/tla-spec-dev/skills/test-graph/...
#     candidate: <home>/skills/tla-spec-dev/skills/test-graph/...   (absent)
#     candidate: ~/.skill-manager/skills/tla-spec-dev/skills/...    (absent)
#
# `from_unit` is resolved at the SKILL rung only — `<home>/skills/<unit>` —
# with no `plugins/<plugin>` rung, so a plugin can never be named there and a
# contained skill has no spelling at all. That is the same missing-rung defect
# as SIS-W2-F-05 in the `skill-script:` installer resolver; it is filed as
# SI-11-DF-01 against skill-manager rather than worked around here.
#
# But the block is not merely mis-spelled, it is obsolete, and that is why
# SI-11 deletes it instead of waiting for the resolver fix. The invariant it
# asserted — "these paths are links INTO A HOME, so check which home" — stopped
# being true when the bundle absorbed test-graph. These three paths are now
# materialized by test-graph's own managed provider bindings
# (test_graph/provider-bindings.json) from the IN-REPO provider at
# `skills/test-graph/project_sdk_sources`, as in-tree relative links that never
# enter a home at all. There is no foreign home left for the check to catch:
# the provider is a tracked directory in this very working tree, and if it is
# wrong, `prepare-bindings.py` refuses on the spot with a better message than
# `project resolve` could produce.
#
# What replaces it: `tests/test_plugin_layout_resolution.py`, which asserts the
# manifest names an in-bundle provider, plus prepare-bindings.py's own refusal.
# Both run in this repository's ordinary suites; neither needs a home.
#
# 2026-11-04 — SUPERSEDED: the graphs no longer bind to the in-repo provider.
# `test_graph/provider-bindings.json` now declares only the `skill-root`
# candidate, and `test_graph/run-graphs.py` invokes the test-graph scripts from
# THIS checkout's home (`.skill-manager/plugins/tla-spec-dev/skills/test-graph`),
# so `build-logic`, `sdk` and `standard-nodes` link into the installed plugin,
# not into `skills/test-graph`. An edit to the in-repo SDK reaches the graphs
# after it merges and `skt sync tla-spec-dev` pulls it into the home.
# `tests/test_plugin_layout_resolution.py` now asserts that shape.
