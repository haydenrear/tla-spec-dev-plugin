# FI-02. EVERY INSTRUMENT THIS REPOSITORY SHIPS, AND WHETHER IT CAN BE SHOWN
# TO FAIL.
#
#     python3 examples/validation/instruments/demonstrate.py
#
# `references/architecture_advice.md` S2: "Every criterion must have a
# demonstrated failing input and a demonstrated passing input." Written for a
# scanner that has since been deleted, never once turned on the instruments
# this repository kept. FI-01 turned it on ONE of them and the result justified
# the epic: against the parent probe exactly as it shipped, three of four
# deliberately broken controls reported HOLDS.
#
# WHAT COUNTS AS AN INSTRUMENT HERE. Something this repository ships that
# WATCHES a subject and produces a VERDICT about it -- an exit code, a printed
# refusal, or a pytest assertion about the repository rather than about a unit.
# Generators, scaffolders and libraries are enumerated only when they refuse
# something; where they do not, they are listed with `family =
# "not-an-instrument"` so the omission is recorded rather than silent, because
# a quietly dropped row is exactly the failure mode this ticket has.
#
# WHAT IS DELIBERATELY OUT. Frozen measurement scripts under
# `specs/results/**/measure/` and `examples/validation/runs/**/artifacts/` other
# than the two the ticket names: they are kept byte-identical to the run that
# produced them and re-running them is not a property of the toolchain. Pure
# argparse usage errors ("you typed the command wrong") are not verdicts about
# a subject and are not counted as failing inputs anywhere below.
#
# HOW TO READ A ROW.
#   classification  demonstrated-can-fail   | demonstrated-cannot-fail
#                   no-demonstration-constructible | no-instrument-exists
#                   not-an-instrument
#   [instrument.failing]     the subject is GENUINELY BROKEN and it must report
#   [instrument.passing]     the subject is sound and it must stay green
#   [instrument.blind_spot]  the subject is GENUINELY BROKEN and it must NOT
#                            report -- a demonstrated inability, per R2
#
# `tier = "slow"` marks a demonstration the fast pass skips: one that shells out
# to pytest, or needs `uv`, or needs a corpus that has to be generated first.

[registry]
id = "FI-02-instrument-enumeration"
ticket = "FI-02"
epic = "falsifiable-instruments"
rule = "references/architecture_advice.md S2; epic R1 and R2"
note = """
THE COUNT OF INSTRUMENTS THAT CANNOT BE SHOWN TO FAIL IS THIS FILE'S PRODUCT.
There is no target on the ratio. A high count is the honest outcome and the
epic prefers it to a flattering one; what is targeted is only that nothing is
silently omitted.
"""

# SM-03. WHERE THE OBLIGATION TO REGISTER APPLIES.
#
# Until this ticket, "nothing is silently omitted" was checked by
# `required <= enumerated` over a literal of thirteen paths -- a RENAME guard
# that could not catch an instrument NEVER ADDED, conceded in its own docstring
# and confirmed four times as `FI-04-DF-04`. Lengthening that literal was
# rejected at `EVAL-RERUN-DF-01` and again at `ARM_MODULE_PREFIXES`, and it
# would be worse here: the literal has to be edited by the same person who
# forgot to register the instrument.
#
# This block declares a SCOPE instead. Its members are DISCOVERED by walking
# the tree for executables -- a `__main__` guard plus a nonzero exit path,
# which is the definition the preamble above already uses -- and every one of
# them must appear in some row's `paths`. Adding a file cannot satisfy it; only
# adding a row can.
#
# WHAT IT STILL CANNOT SEE. A repo tripwire that is a pytest FILE has no
# `__main__` and no exit call, so `tests/test_code_complexity.py` and its four
# siblings are invisible to the scan and are registered by hand. That is a real
# remaining hole and it is written here rather than left for the next sweep.
[registry.enumeration]
roots = ["skills/spec-double-2/scripts", "examples/validation"]

  [[registry.enumeration.exclude]]
  path = "examples/validation/runs"
  reason = """
SEALED MEASUREMENT ARCHIVES. `runs/ex4-run1/artifacts/kill_matrix.py` and its
two siblings are kept byte-identical to the run that produced them; they are
records of a measurement, not instruments of the toolchain, and re-running one
is not a property of anything this repository ships. Already declared out by
the preamble's "WHAT IS DELIBERATELY OUT"; declared out here too so the scan
agrees with the prose instead of contradicting it.
"""

  [[registry.enumeration.exclude]]
  path = "examples/validation/ex1_scaffold_only"
  reason = """
A SCAFFOLDED SUBJECT, NOT AN INSTRUMENT. `taskq/taskq.py` is a program the
toolchain GENERATED, checked in as an example of its output. It is the thing
instruments are pointed AT. Registering it would put the subject into the
denominator of a count about the measuring equipment.
"""


# ===========================================================================
# THE FOUR ORACLES
# ===========================================================================

[[instrument]]
id = "corpus-runner"
name = "generated-case corpus runner"
paths = ["skills/spec-double-2/scripts/run_generated_case_adapters.py"]
family = "measurement"
watches = "every generated case's output and projected after-state against the model"
verdict_surface = "exit code 1 with the per-case diff"
classification = "demonstrated-can-fail"
note = """
The one instrument in this set whose failing input was always one line away and
had never been written down. Its catalogue of mutants is `kill_mutants.toml`;
any row of it is a re-runnable perturbation of the SUBJECT, not of the runner.
"""

  [instrument.failing]
  summary = "a checked-out order is persisted with status 'pending' instead of 'accepted' (kill_mutants.toml store-order_store, verbatim)"
  argv = ["{python}", "{repo}/skills/spec-double-2/scripts/run_generated_case_adapters.py",
          "{tree}/dh/specs/generated/spec-unit/ecommerce_internal_cases",
          "--mapping", "{tree}/dh/specs/program_model/case_adapters.toml",
          "--view", "internal", "--batch", "--import-root", "{tree}/dh"]
  cwd = "{tree}/dh"
  expect_exit = 1
  expect_output = ["batched case executions failed", "adapter after-state mismatch"]

    [[instrument.failing.stage]]
    from = "examples/distributed_history"
    to = "dh"

    # BS-08: 76ef2758 deleted and gitignored dh/specs/generated; the corpus
    # these slots read is committed as a test fixture now and staged into place.
    [[instrument.failing.stage]]
    from = "tests/fixtures/distributed_history_generated"
    to = "dh/specs/generated"

    [[instrument.failing.mutate]]
    file = "dh/ecommerce_backend/domain.py"
    find = '                (order_id, account_id, json.dumps(items, sort_keys=True), "accepted"),'
    replace = '                (order_id, account_id, json.dumps(items, sort_keys=True), "pending"),'

  [instrument.passing]
  summary = "the same corpus against the same tree, unmutated"
  argv = ["{python}", "{repo}/skills/spec-double-2/scripts/run_generated_case_adapters.py",
          "{tree}/dh/specs/generated/spec-unit/ecommerce_internal_cases",
          "--mapping", "{tree}/dh/specs/program_model/case_adapters.toml",
          "--view", "internal", "--batch", "--import-root", "{tree}/dh"]
  cwd = "{tree}/dh"
  expect_exit = 0
  expect_output = ["executed 4 cases in batch"]

    [[instrument.passing.stage]]
    from = "examples/distributed_history"
    to = "dh"

    # BS-08: 76ef2758 deleted and gitignored dh/specs/generated; the corpus
    # these slots read is committed as a test fixture now and staged into place.
    [[instrument.passing.stage]]
    from = "tests/fixtures/distributed_history_generated"
    to = "dh/specs/generated"

[[instrument]]
id = "effect-oracle"
name = "MF-013 effect conformance oracle"
paths = ["skills/spec-double-2/scripts/effect_conformance.py", "skills/spec-double-2/scripts/effect_conformance_report.py"]
family = "measurement"
watches = "observed filesystem/network/process effects against the ports the model declares"
verdict_surface = "exit 1 (gap, dead surface, unobservable), exit 2 (malformed declarations)"
classification = "demonstrated-can-fail"
note = """
Its failing input is driven through the SHIPPED runner path
(`execute_cases_in_batch`), not through the diff in isolation, because the
enforcing copy and the reporting copy are two call sites and only one of them
decides a run.
"""

  [instrument.failing]
  kind = "pytest"
  tier = "slow"
  summary = "an adapter that writes into a directory no port covers, and one that declares a port no case exercises"
  nodes = [
    "tests/test_effect_conformance_runner.py::TestRunnerEnforcesEffectConformance::test_undeclared_effect_fails_the_run",
    "tests/test_effect_conformance_runner.py::TestRunnerEnforcesEffectConformance::test_dead_declared_port_fails_the_run",
  ]
  expect_exit = 0
  expect_passed = 2  # SM-03: exit 0 is also what a fully-skipped run returns

  [instrument.passing]
  kind = "pytest"
  tier = "slow"
  summary = "an adapter that writes only where its port says it writes"
  nodes = ["tests/test_effect_conformance_runner.py::TestRunnerEnforcesEffectConformance::test_declared_only_adapter_passes"]
  expect_exit = 0
  expect_passed = 1  # SM-03: exit 0 is also what a fully-skipped run returns

  [instrument.blind_spot]
  kind = "declared"
  summary = "a process.spawn is UNOBSERVABLE whatever a port declares, so any effect a child process performs is outside this oracle by construction -- the kill test must run outside the sandbox for exactly this reason, and says so on every run"
  reason = "MF-027. Not a defect and not repairable here; recorded so the oracle's reach is not read as total."

