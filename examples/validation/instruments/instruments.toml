  [instrument.passing]
  summary = "the same corpus under the caps it was generated against"
  argv = ["{python}", "{repo}/skills/spec-double-2/scripts/corpus_diagnostics.py",
          "{tree}/dh/specs/generated/spec-unit/ecommerce_internal_cases",
          "--manifest", "{tree}/dh/specs/program_model/spec_manifest.yaml",
