# THE PIN. What an eval run's toolchain IS, written down, in the repository.
#
# Why this file exists
# --------------------
# Before it, every eval this loop ran resolved its toolchain from the
# OPERATOR'S LIVE HOME, at whatever `main` happened to point to that day. The
# project home's install record for `skt` read `gitRef main`, `gitHash
# 286a3694`, installed 2026-09-14. Nothing pinned it, nothing asked for it, and
# nothing wrote it next to a score -- so no two runs a week apart were known to
# be comparable, and a score that moved could not be attributed to the change
# that was supposed to move it.
#
# THAT `main` HAS ALREADY MOVED. Measured 2026-09-19:
#   git ls-remote https://github.com/haydenrear/skt main
#     -> 0f3807811e1dd8aca4ef34f502669849cb367fdd
# against the 286a3694 the home installed five days earlier. The moving target
# is not a worry about the future; it is a fact about the past week.
#
# Why the pin is MATERIALISED and not DECLARED
# --------------------------------------------
# `claude plugin eval` has no version pinning for plugin dependencies. A case's
# `plugins:` field takes relative filesystem PATHS only -- no git ref, no
# marketplace constraint, no lockfile, no manifest-level "this plugin depends on
# that one". There is no field for the pin to live in, so the pin lives HERE and
# `evals/lib/toolchain.py` MATERIALISES it: it fetches each commit below into a
# cache, verifies the checked-out HEAD IS that commit, and `run.sh` stages the
# result where a case's `plugins:` entry can reach it.
#
# PIN A COMMIT, NEVER A BRANCH. A branch is the thing this file exists to stop
# depending on. `toolchain.py` refuses anything that is not 40 hex characters.
schema_version = 1

# [units.skt] WAS HERE, pinned at haydenrear/skt 286a3694, staged into the view
# at toolchain/skt. It is retired, and it was already INERT before it was
# retired.
#
# SI-16 nested skt into this plugin. run.sh stages the pinned unit's skills into
# the view but refuses to put one OVER a skill the plugin owns — "a nested skill
# of this plugin is the thing under review; a pinned copy silently replacing it
# would grade the pin instead of the branch". The pinned skt ships exactly
# skill-manager, skt and unit-authoring, and this plugin now owns ALL THREE. So
# every candidate collided, `staged_units` stayed empty, and the success line
# never printed either: a silent no-op that looked like provisioning.
#
# By that same rule the right answer is not to repoint the pin at
# tla-spec-dev-plugin — that would pin this repository against itself and grade
# the pin instead of the branch. The view IS the plugin, its skills/ is what
# loads, and the w-skt and w-sm cases therefore exercise the branch under test.
# That is what SI-16 bought, and it is strictly better than what the pin did.
#
# What still needs pinning is the thing this repository does NOT contain: the
# skill-manager CLI, below.

[units.skill-manager]
origin = "git@github.com:haydenrear/skill-manager.git"
commit = "7941f4e1dd9eb72debea3b82ec2230d21971cf68"
ref_when_pinned = "epic/self-improvement-substrate"
role = """
The CLI itself. Evals must run against the skill-manager from the branch under
review, NOT the operator's brew install at
/opt/homebrew/Cellar/skill-manager/0.28.1. The mechanism is small and it is not
a rebuild and not an install: the repo root carries `./skill-manager`, a 346-byte
bash wrapper that exports SKILL_MANAGER_INSTALL_DIR and execs
`jbang SkillManager.java`. `evals/bin/skill-manager` is a shim pointing at that
wrapper in the materialised checkout, and `run.sh` already puts `evals/bin`
first on PATH. Nothing is installed over the operator's copy.
"""
# NOT staged into the view. It is 11,481 entries, and the view has a hard
# 20,000-entry ceiling that this repository already spends 6,264 of. It lives in
# the cache and is reached by PATH through the shim, never by `plugins:`.
stage_into_view = ""
# The wrapper self-reports the commit -- `./skill-manager --version` prints
# `0.28.1+g<short sha>` and `build: <short sha> (detached)` -- so the run record
# captures the CLI's OWN account of which code ran, not just ours. The example
# used to spell a literal commit and went stale twice; the SHAPE is the point.
self_report_command = "--version"
