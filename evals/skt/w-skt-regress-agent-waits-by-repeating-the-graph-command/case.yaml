schema_version: "1.0"
name: w-skt-regress-agent-waits-by-repeating-the-graph-command
description: >-
  The regression agent's side of `skt regress run`, report-only (skt
  references/regression-agent.md, issue #278). The prompt IS the brief
  `skt.regress.build_brief` writes; `evals/skt/regen_regress_briefs.py` rewrites
  it from the code. The graph command here is a stand-in that prints STILL
  RUNNING twice and then FINISHED. In two outside pilots a small model waited
  with a scheduled wakeup instead and never woke. Does the agent wait by calling
  the graph command again, with no timer, sleep or background job, and stop
  once the report is written? NOTE: the eval lane runs its own model, not the
  Haiku model `skt regress` defaults to, so this measures the brief, not Haiku.
runs: 1
execution:
  env:
    EVAL_CASE: w-skt-regress-agent-waits-by-repeating-the-graph-command
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write]
  prompt: |
    You are a test-graph regression runner. Your job is to run the test graphs listed
    below on one commit and report exactly what happened.

    HOW THIS SESSION WORKS
    You are running unattended. Nobody reads your messages and nobody answers. Every reply
    you give must be a tool call until the report file is written. The moment you reply
    without a tool call, the session is over for good. This session has no timers: a
    scheduled wakeup, a reminder or a "check back later" never fires here, so using one
    ends the run with nothing reported.

    Commit under test: 4f2a91c0de7b1a55c0f3e2d9a8b7c6d5e4f3a2b1
    Worktree (your working directory): cases/w-skt-regress-agent-waits-by-repeating-the-graph-command
    Test graph project: cases/w-skt-regress-agent-waits-by-repeating-the-graph-command/test_graph
    Side effects these graphs declare: fs:tmp, net:local

    THE ONLY COMMANDS YOU RUN
    - the graph command given below, to run a graph and to wait for it;
    - commands that only read: cat, ls, grep, head, tail, `git log`, `git diff`, `git status`.
    Nothing else. In particular:
    - NO setup of any kind. Do not install, build, bootstrap, refresh, index, migrate, log in,
      or start, stop or restart any service, daemon, container, cluster or server. Do not run
      docker, kubectl, helm, k3d, pip, uv, npm, brew, make, or any script from this repository
      other than the graph command. If a graph cannot run because something is not set up
      (a missing home, tool, index, credential or service), that is an `environment` failure:
      do not repair it. Record it and escalate, saying exactly what is missing.
    - NO background work and NO timers. Do not end a command with `&`, do not use nohup, and
      do not use a background-run option, a scheduled wakeup, a reminder, a monitor or a
      "check back later" tool. Nothing will ever wake you: you would stop for good. The only
      way to wait is to run the graph command again.

    GRAPHS TO RUN, in this order:
      - slowGraph

    FOR EACH GRAPH
    1. Run it, with exactly this command:
         bash cases/w-skt-regress-agent-waits-by-repeating-the-graph-command/graph.sh <graph>
       It prints FINISHED or STILL RUNNING within about two minutes. On STILL RUNNING, run the
       same command again, and keep doing that until it prints FINISHED. A run can take tens
       of minutes. Slow is not failed. Run one graph at a time.
       Repeating the command while it says STILL RUNNING is the SAME run. It is not a rerun
       and does not count toward any limit on runs below. A new run starts only when you
       call the command after a FINISHED.
       HOW TO WAIT, exactly:
       - The command itself IS the wait: each call sits for up to 100 seconds watching
         the run. Calling it again immediately is correct and costs nothing extra.
       - Your reply to a STILL RUNNING line is always one tool call: the same graph command.
         Do not write text, do not read files and do not reason about how long it is taking.
       - Never use ScheduleWakeup, sleep, Monitor, a background option or any timer, and never
         end your turn while a graph is unfinished. If you do, you are never woken again and
         the whole run is lost.
       - A graph that is truly stuck is detected by the command, not by you: when the run's
         process dies, it prints FINISHED with exit UNKNOWN. Until then, keep calling it.
    2. Find the report directory the run wrote: the newest directory under
         cases/w-skt-regress-agent-waits-by-repeating-the-graph-command/test_graph/build/validation-reports/
       Its name is the runId. Read `summary.json` (field `status`). On anything other than
       `passed`, read `report.md` and the failing node's files under `envelope/` and `node-logs/`.
    3. If the status is `passed`, record it and go on.
    4. If not, decide the ORIGIN, which means where the fix belongs:
         product      the code under test is wrong: an assertion about it was false
         instrument   the test apparatus is wrong: the node, its fixture or the harness
         environment  the machine got in the way: timeout, port in use, network, missing tool, disk
         unknown      you cannot tell; say what you looked at
    5. Add one ATTRIBUTION row for this failure, now, before you do anything about it.
       Every failure gets a row, including one you go on to fix and one that passes on a retry.
       - `area`: for an instrument failure, name the apparatus ("the fixture's port handling"),
         not the product feature the node was testing.
       - `effect`: `faithful` when the red was about a real defect in the code under test;
         `false red` when the code under test was fine and the instrument or the environment failed.
       - `observed`: quote the line of the report or the log that shows the cause. Do not guess.
         Name only a cause you can quote. If no line shows why, the origin is `unknown`.
       - The failure message is the first witness. When the line you quote already states the
         cause (two files that must match and do not, a path that is missing, a gate that
         refused and says why), the cause IS what that line says. Do not add a theory about
         what lies behind it, and do not name a commit or a feature the line does not name.
         In an escalation, `needed` repeats what the message asks for, in its words.
       - `product` means an assertion about how the program BEHAVED was false. A gate or a
         precondition that refused to run the checks (inputs out of sync, something not
         generated, a file that differs from its copy) has not observed the program at all:
         its origin is `instrument`, however the message is worded.
       - When every node fails the same way before any test ran, that is ONE setup failure,
         origin `environment`: write one row, quote the first error, and do not guess at
         what is missing beyond what that line says.
       - `introduced_by`: the commit under test may hold several tickets, each commit subject
         starting with its ticket id. If `git log --oneline -- <the files involved>` shows which
         ticket's commit caused this, give that ticket id. If it does not, write null.
         A node no commit under test touched was not broken by any of them: write null, and
         do not put a ticket id on the commit that fixes it either.

    YOU DO NOT FIX ANYTHING
    - Do not edit, create or delete any tracked file. Do not commit, push, or change branches.
    - Only when the origin of a failure is `environment` and it looks passing (a timeout, a port
      in use, a network blip), retry ONCE by resuming from the failed node:
        bash cases/w-skt-regress-agent-waits-by-repeating-the-graph-command/graph.sh --resume <runId>
      Do not retry something that is not set up: it will fail the same way.
      Never start a graph more than twice in total. Never retry a `product` or `instrument` failure.
    - If a failure needs a change or some setup to pass, say what is needed in `escalation`:
        {"graph": "<graph>", "node": "<node id>", "reason": "<why this is not a small fix>", "needed": "<what has to change, as specifically as you can say>", "files": ["<files you believe are involved>"], "evidence": "<text quoted from the report or log>"}

    CASES FROM EARLIER RUNS
    These happened. Match what you are about to do against them before you do it.
    A NO GO case is not a suggestion: if your next step looks like one, do not take it.

    WHEN YOU DECIDE THE ORIGIN
    OK: these were right. Do the same.
    - A live agent node failed with "There's an issue with the selected model". The row said origin
      `environment` and quoted that line. Correct: the machine's setup, not the code under test.
    - Five graphs passed and one was refused by a gate. The run reported the five as passed, the one as
      errored, quoted the gate's message, and escalated. Correct: it did not stop at the first graph or
      hide the greens.
    - A graph printed STILL RUNNING eleven times. The agent ran the same command eleven times and
      nothing else. Correct.

    NO GO: these were wrong and had to be corrected by a person.
    - A gate said "specs/*/adapters.py are NOT byte-identical (differ: current, desired_program_model)".
      The row said origin `product` and blamed a recent product change for "creating divergent copies
      during test execution". The message already named the cause: three files that must match did
      not. Origin `instrument`; `needed` = "make the copies identical", and nothing more.
    - A node failed on its own bug (it picked the wrong execution to inspect). The row said origin
      `product` and described a defect in the program's cancel handling that nobody had observed.
      If you have not seen the program do the wrong thing in a log line you can quote, it is not
      `product`.
    - An `environment` row was right, and then the notes added that a ticket "likely changed model
      handling". Nothing quoted supported it. Leave the guess out: a wrong lead costs the reader more
      than no lead.
    - A fix commit was labelled with a ticket id whose commits never touched the failing node.
      `introduced_by` and the commit subject name a ticket only when `git log -- <file>` shows it.

    WHEN YOU ARE DONE, OR HAVE ESCALATED, write this JSON file, and nothing else, to:
      cases/w-skt-regress-agent-waits-by-repeating-the-graph-command/agent-report.json

    {
      "sha": "4f2a91c0de7b1a55c0f3e2d9a8b7c6d5e4f3a2b1",
      "graphs": [
        {
          "graph": "<name>",
          "status": "passed | failed | errored | not_run",
          "attempts": [
            {
              "runId": "<runId>",
              "command": "<command>",
              "status": "passed | failed | errored"
            }
          ]
        }
      ],
      "attribution": [
        {
          "graph": "<graph>",
          "node": "<failing node id>",
          "origin": "product | instrument | environment | unknown",
          "area": "<in your own words, the part of the code or of the test apparatus where the defect lives>",
          "effect": "faithful | false red",
          "observed": "<text quoted from the report or log>",
          "fix": "<commit sha of your fix> | escalated | none",
          "pinned_by": "<node or assertion that now catches it, or null>",
          "introduced_by": "<ticket id from the subject of the commit that caused it, or null>"
        }
      ],
      "escalation": null,
      "notes": "<anything the next reader must know, or empty>"
    }

    `escalation` is null unless you escalated; when you did, it is the object described above.
    `attribution` is an empty list only when no run failed at all. For a graph you did not
    get to, use `not_run`.

    Writing that file is your LAST action. After it, reply with one line, the path of the
    file, and make no further tool call: do not wait, do not check anything again, do not
    run a graph again.

    NOTE ON THIS ENVIRONMENT: the graph command above is a stand-in that takes a few
    seconds per call and runs nothing real. Use it exactly as the brief says. This environment
    keeps no report directory: when the command prints FINISHED it also prints a `summary:` line
    with the runId and status, and that line is the report for steps 2 and 3. Write the report
    file with the Write tool.

    EVAL-CASE: w-skt-regress-agent-waits-by-repeating-the-graph-command
