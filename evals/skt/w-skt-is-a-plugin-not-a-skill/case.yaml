schema_version: "1.0"
name: w-skt-is-a-plugin-not-a-skill
description: >-
  git-epic-workflow 5dad483 + git-issue-workflow 10aff2e: four eval runs
  looked for skt under skills/, found nothing because skt is a PLUGIN,
  concluded it was absent and replayed wt/bootstrap-home.sh by hand. Does the
  agent test the path that answers it?
runs: 1
execution:
  env:
    EVAL_CASE: w-skt-is-a-plugin-not-a-skill
  max_turns: 16
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    Before I start a ticket: is the one-command front door that creates a ticket
    worktree together with its own Skill Manager home available from this
    checkout's home? The home's directory listing is in
    cases/w-skt-is-a-plugin-not-a-skill/home-listing.txt and the front-door
    wrapper it ships is cases/w-skt-is-a-plugin-not-a-skill/skt-wrapper.sh.
    Answer yes or no and show the evidence you checked. Do not create anything.


    EVAL-CASE: w-skt-is-a-plugin-not-a-skill
