- id: SA-REVIEW-01
  kind: CATCH
  severity: major
  channel: independent-review
  origin: product
  area: "SA-02 / SA-04, configured transport and review permissions"
  observed: "At 437c68a a private ACP target labeled HTTP could skip review tool restrictions. A remote endpoint could also be assigned capabilities by its caller."
  effect: "A review could run with excessive tools, or a regress request could reach a target unable to run a graph."
  fix: "0743ebc checks the routed private provider and read-only policy. 7504b08 documents that a caller-managed endpoint does not advertise its transport."
  disposition: "Private routing repaired. Remote ACP regress capability remains an operator assertion. Remote HTTP review with unverifiable routing is refused."
  pinned_by: "skills/skt/tests/test_agent_config.py::test_mislabeled_model_cannot_turn_off_review_tools"
  skill_change: "applied(7504b08)"

- id: SA-REVIEW-02
  kind: CATCH
  severity: major
  channel: independent-review
  origin: product
  area: "SA-01, cancellation in the episode launcher"
  observed: "Direct termination of the launcher could strand the child or bypass upstream cancellation on a caller-owned server. The first fix still missed SIGTERM sent directly to skt."
  effect: "Work and provider cost could continue after the caller stopped the command."
  fix: "0743ebc and 7bededc unwind the active episode and give the upstream client time to cancel."
  disposition: fixed
  pinned_by: "skills/skt/tests/test_agent_review.py::test_termination_cancels_caller_owned_episode"
