  - id: SI-29-DF-01
    status: resolved
    severity: medium
    title: >-
      `applied(x)` has no constrained slot, and testing x for resolvability
      instead of shape gives a FALSE PASS on a live ledger row
    what: >-
      The `skill_change` grammar fixes arity but says nothing about what goes in
      a slot. Measured over the 10 `applied(...)` rows of
      specs/results/deferred_findings_final.yaml: only 3 begin with a commit sha
      (4caab479, d09d8326, f212cbe3); the other seven name "this PR", a file
      list or a branch, none of which a reader can resolve a month later. The
      trap is the eleventh observation: 4 of 10 resolve under `git cat-file -t`,
      because `applied(test-graph, match a node stem ...)` has a first token that
      resolves to refs/remotes/test-graph/main — this repository has a git REMOTE
      named test-graph. So the obvious check (does git resolve it?) scores that
      row a pass and points a reader at an unrelated commit.
    surface:
      production:
        - skills/spec-double-2/references/agent_roles.md
        - skills/spec-double-2/scripts/improvement_ledger.py
    anchor: UNMODELED/record-keeping
    evidence: >-
      specs/results/epic-self-improvement-substrate/tickets/SI-29/transcripts/step-04-return-leg.txt
      §4c, with the negative control (a bogus sha does not resolve).
    disposition: consumed
    goal: GOAL-findings-become-changes
    skill_change: applied(11000fa6)
    note: >-
      Consumed as DOCUMENTATION, deliberately not as a check: GOAL-no-new-gates is
      live and the owner's constraint is references only. The documented form is
      about the SHAPE of the slot for exactly the reason above. Whether the next
      writers follow it is unmeasured.

  - id: SI-29-DF-02
    status: resolved
    severity: low
    title: >-
      The `skill_change` grammar has no delimiter rule, so a value can carry two
      verbs and a writer can believe they said two things
    what: >-
      SI-19-DF-01 reads `skill_change: "none applied; proposed(test-graph,
      SI-19-DF-01: the next-steps block names smoke's precondition)"`. That is
      two verbs in one value. `parse_skill_change` correctly calls it malformed
      and `improvement_ledger.py` reports it — so nothing is silently
      mis-counted — but the author plainly intended both clauses to be read, and
      the grammar as documented gave them no way to say "none applied yet, and
      here is what I propose". 1 of 151 rows today; it becomes more likely once
      four roles write the field instead of one.
    surface:
      production:
        - skills/spec-double-2/references/agent_roles.md
    anchor: UNMODELED/record-keeping
    evidence: >-
      Measured directly over the 151 rows; the strict parse names exactly this
      one id. Reproduced against `improvement_ledger.py`'s own `_CALL` regex.
    disposition: consumed
    goal: GOAL-findings-become-changes
    skill_change: applied(11000fa6)
    note: >-
      Consumed as documentation only — `agent_roles.md` names this row as the
      worked example of why the slots need a form. The grammar itself is NOT
      widened: adding a two-verb spelling would make every historical row
      ambiguous, which is the MF-020 error (an instrument changed after seeing
      its own data).

  - id: SI-29-DF-03
    status: open
    severity: low
    title: >-
      CORRECTED. `check_cases_parse.py` was NOT inert in the lane; my original
      claim was an artefact of my own shell. What survives is a portability hole
      and a misleading word, and the epic agent has fixed both.
    what: >-
      ORIGINALLY FILED AS HIGH, and the claim was WRONG. I reported that
      `evals/run.sh:269` invokes the checker with a `python3` that has no PyYAML,
      so the #389 fix printed `SKIPPED` and checked nothing. `run.sh` is a BASH
      script, and in non-interactive bash `python3` resolves to
      /usr/bin/python3 (3.9.6), which HAS PyYAML 6.0. Run as the lane runs it the
      original checker prints `cases: 75 case file(s) parse.` The `SKIPPED` I saw
      came from my own interactive ZSH, which carries `alias python3=python` and
      sends it to Homebrew 3.14, which lacks PyYAML. An alias does not exist
      inside a script.
      WHAT IS ACTUALLY TRUE, and it is much smaller: the checker depended on the
      host's system interpreter happening to carry PyYAML, so a host whose
      /usr/bin/python3 lacks it would have gone quiet; and `SKIPPED` reads as a
      benign non-failure rather than as "the corpus was not verified".
    surface:
      production:
        - evals/lib/check_cases_parse.py
    anchor: UNMODELED/record-keeping
    evidence: >-
      `bash -c 'type python3'` -> /usr/bin/python3, 3.9.6, `import yaml` -> 6.0.
      `zsh -ic 'type python3'` -> "python3 is an alias for python", 3.14.6, no
      yaml. The original file under bash: `cases: 75 case file(s) parse.` The same
      file under my zsh: `cases: SKIPPED`. Both captured after the correction.
    disposition: consumed
    goal: GOAL-evals-one-command
    skill_change: applied(57f05cf4)
    note: >-
      THE ERROR IS THE FINDING WORTH KEEPING, and it is not a new class: it is
      SI-21-DF-01 exactly, reached from the other side. SI-21 §0 recorded that
      `python3` is a zsh alias and that six of its measurements silently ran under
      an interpreter it did not intend. I READ THAT FINDING WHILE WORKING THIS
      TICKET and then made the same mistake in the opposite direction --
      measuring in zsh and attributing the result to a bash script. SI-21's
      remedy ("anything that measures by shelling out to python3 should print
      sys.executable and sys.version") would have caught it, and so would running
      the command in the shell that actually runs it. The epic agent fixed the
      real hole at 57f05cf4 (the checker re-execs through uv and says UNVERIFIED
      rather than SKIPPED), which is merged into this branch and verified here in
      both shells.
