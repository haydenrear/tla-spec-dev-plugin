  - id: SI-19-DF-04
    severity: major
    found_by: SI-19
    found_at_commit: "f4b42169"
    schedule_revision: 9
    target: tla-spec-dev
    attribution: "UNMODELED/agent-harness"
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow:
        - "tests/test_eval_toolchain_pin.py:180 (.toolchain is not gitignored)"
        - ".gitignore:45 (.toolchain/)"
    summary: >-
      AN ELEVENTH REPOSITORY-SUITE FAILURE ON A CLEAN TREE, AND IT IS A
      STATEMENT ABOUT THE MACHINE RATHER THAN THE REPOSITORY.
      `tests/test_eval_toolchain_pin.py::test_the_view_excludes_the_materialised_toolchain`
      is red in a fresh worktree at `f4b42169`, alongside the epic's ten known
      failures. It asserts `git check-ignore -q .toolchain` returns 0. The
      ignore rule IS present, at `.gitignore:45`, but it is spelled
      `.toolchain/` with a trailing slash, so it matches directories only, and
      `git check-ignore` cannot match a path that is not on disk. `.toolchain/`
      is created by `evals/lib/toolchain.py` on the first eval run, so the test
      is GREEN on any machine that has run one and RED in every fresh checkout.
      The property the test is defending -- that the view is built from a commit
      and cannot swallow the toolchain cache -- is true and is asserted two
      lines earlier. Only the third assertion is environment-dependent.
    reproduction: >-
      In a fresh worktree: `git check-ignore -v .toolchain` -> rc 1;
      `mkdir -p .toolchain` -> `git check-ignore -v .toolchain` prints
      `.gitignore:45:.toolchain/` and returns rc 0; the whole file then passes
      (`10 passed in 7.56s`); `rmdir .toolchain` restores the red. Measured
      2026-09-23 before SI-19 changed any file.
    why_out_of_scope: >-
      `tests/**` is outside `conflict_keys.production` (`evals/**`). The change
      is one line and tempting, and taking it would widen this ticket's diff
      into the file another ticket's instrument reads.
    suggested_fix: >-
      Assert the rule rather than the resolution: `git check-ignore --no-index
      .toolchain/somefile` answers the same question without requiring the
      directory to exist, or read `.gitignore` for the `.toolchain/` line
      directly. Either keeps the property and drops the dependence on whether
      an eval has ever been run on this machine.
    blast_radius: >-
      Every fresh checkout, every ticket agent's baseline, and every by-name
      comparison against the epic's list of ten -- which is the instrument this
      epic uses to tell a ticket's regressions from the background. An eleventh
      name that is not on the list costs each agent the time to establish that
      it is not theirs, and invites the cheaper conclusion that the list is just
      approximate.
    evidence:
      - "specs/results/epic-self-improvement-substrate/tickets/SI-19/baseline-repository-suite.txt"
      - "specs/results/epic-self-improvement-substrate/tickets/SI-19/baseline-failure-names.txt"
      - "specs/results/epic-self-improvement-substrate/tickets/SI-19/manual-verification.md (section 6)"
    skill_change: "none"
    disposition: still-true
    disposition_ticket: "SI-19"
    disposition_note: >-
      Observed 2026-09-23 on the untouched worktree, and falsified both ways
      before being written down. Not repaired: out of conflict keys.

  - id: SI-19-DF-05
    severity: minor
    found_by: SI-19
    found_at_commit: "f4b42169"
    schedule_revision: 9
    target: tla-spec-dev
    attribution: "UNMODELED/test-graph-runtime"
    surface:
      production: []
      tla: []
      adapters: []
      test_graph:
        - "the node runtime's OTLP exporter (every graph run)"
      workflow: []
    summary: >-
      EVERY GREEN GRAPH RUN PRINTS FOURTEEN OR MORE JAVA STACK TRACES. All three
      graphs run here passed, and each interleaved repeated
      `java.net.ConnectException` / `java.io.EOFException` traces from the
      OpenTelemetry OTLP exporter trying `http://localhost:4318/` with no
      collector listening. `cliWorkflow`'s 271-line transcript contains 14
      occurrences of `4318`; the two-graph sweep's transcript is 1056 lines.
      The traces are indistinguishable at a glance from a failing run, and the
      real verdict is 250 lines further down in a `summary.json` nobody is
      forced to open. An agent asked "did the graph pass" and reading the
      terminal will answer no.
    reproduction: >-
      `python3 skills/test-graph/scripts/run.py cliWorkflow` with no OTLP
      collector on 4318. `grep -c 4318` over the captured output returns 14;
      `summary.json` says `"status":"passed"`.
    why_out_of_scope: >-
      The exporter configuration is the node runtime's, under
      `skills/test-graph/project_sdk_sources/`, outside `evals/**`.
    suggested_fix: >-
      Make the exporter silent-by-default when no endpoint is reachable, or log
      one line rather than a stack per export. If neither is wanted, have the
      runner print the graph's verdict LAST and unmistakably -- it already knows
      it, and a final `cliWorkflow: PASSED (2/2 nodes)` line would cost nothing
      and would beat the noise.
    blast_radius: >-
      Reading, not correctness. It is the direction that matters: the noise
      makes a green run look red, so the failure mode is a correct run reported
      as broken -- and it is precisely the shape this epic keeps finding, where
      the output of "it worked" and "it did not" are not distinguishable.
    evidence:
      - "specs/results/epic-self-improvement-substrate/tickets/SI-19/transcripts/step-E-run-cliworkflow.txt"
      - "specs/results/epic-self-improvement-substrate/tickets/SI-19/transcripts/step-I-run-sweep.txt"
    skill_change: "none"
    disposition: still-true
    disposition_ticket: "SI-19"
    disposition_note: "Observed 2026-09-23 on three passing graph runs."
