  - id: SI-19-DF-01
    severity: major
    found_by: SI-19
    found_at_commit: "f4b42169"
    schedule_revision: 9
    target: tla-spec-dev
    attribution: "UNMODELED/test-graph-scaffold"
    surface:
      production: []
      tla: []
      adapters: []
      test_graph:
        - "skills/test-graph/scripts/scaffold.py:154 (next steps)"
        - "skills/test-graph/project_sdk_sources/sources/AppRunning.java:46 (http://localhost:8080)"
      workflow: []
    summary: >-
      A FRESH SCAFFOLD'S OWN PRINTED NEXT STEP PRODUCES A RED, AND NOTHING SAYS
      WHY. `scaffold.py <dir>` succeeds and prints a five-line "next steps"
      block ending in `run.py smoke` and `run.py --all`. Following it verbatim,
      `run.py smoke` returns exit 1 with `BUILD FAILED` and a `summary.json`
      whose status is `errored`: the first node `app.running` errors with
      `java.net.ConnectException` and the remaining FIVE nodes are skipped.
      The cause is a precondition, not a wiring fault -- `AppRunning.java:46`
      defaults `baseUrl` to `http://localhost:8080` and HEADs it, and nothing is
      listening in a fresh scaffold. The scaffolded `README.md` never mentions
      it (grepped for `app.running`, `8080`, `start the app`, `prereq`: no
      match), and neither does the next-steps block that recommended the
      command.
      This is the epic's own recurring defect one layer out. An environment that
      could not run the task and a tool that could not do the task produce the
      SAME output, and the output is charged to the tool.
    reproduction: >-
      In a clean directory outside the repository:
      `python3 skills/test-graph/scripts/scaffold.py <dir>` (exit 0), then
      `python3 skills/test-graph/scripts/run.py smoke --test-graph-root <dir>/test_graph`.
      Read the verdict from `<dir>/test_graph/build/validation-reports/<runId>/summary.json`,
      not from the exit code: `"status": "errored"`, `app.running -> errored`,
      five nodes `skipped`. The error stack names `AppRunning.head(AppRunning.java:70)`
      under `java.net.ConnectException`.
    why_out_of_scope: >-
      `skills/test-graph/**` is not in SI-19's `conflict_keys.production`, which
      is `evals/**` alone. The fix is a wording or a precondition check in
      another unit's scaffold surface, and SI-19's slice is the eval ladder's
      first rung.
    suggested_fix: >-
      Cheapest correct change: have the next-steps block say what `smoke`
      needs, e.g. print `run.py smoke  # needs an app answering at
      http://localhost:8080; override with -PbaseUrl=` beside it. Stronger, and
      the shape this epic keeps asking for: give `app.running` a precondition
      that reports UNDECIDED-no-app rather than ERRORED when nothing is
      listening, so a first run distinguishes "not measured" from "failed".
      Weakest and wrong: making `smoke` not include `app.running`, which would
      remove the demonstration rather than the ambiguity.
    blast_radius: >-
      Every first-time user of `test-graph`, and every agent told to "scaffold
      validation and run it" -- which is exactly what the existing eval case
      `evals/test-graph/compose-a-behavioural-graph` asks an agent to do. That
      case grades the SCAFFOLD structurally and deliberately does not run the
      graph, so it cannot see this; an agent that goes one step further than the
      case asks gets a red it did not cause.
    evidence:
      - "specs/results/epic-self-improvement-substrate/tickets/SI-19/transcripts/step-F-scaffold.txt"
      - "specs/results/epic-self-improvement-substrate/tickets/SI-19/transcripts/step-H-scaffold-run-smoke.txt"
      - "specs/results/epic-self-improvement-substrate/tickets/SI-19/transcripts/step-H2-smoke-verdict.txt"
    skill_change: "none applied; proposed(test-graph, SI-19-DF-01: the next-steps block names smoke's precondition)"
    disposition: still-true
    disposition_ticket: "SI-19"
    disposition_note: >-
      Observed by hand on 2026-09-23 while producing SI-19's manual-verification
      record. Not repaired: out of conflict keys.

  - id: SI-19-DF-02
    severity: minor
    found_by: SI-19
    found_at_commit: "f4b42169"
    schedule_revision: 9
    target: tla-spec-dev
    attribution: "UNMODELED/test-graph-scaffold"
    surface:
      production: []
      tla: []
      adapters: []
      test_graph:
        - "skills/test-graph/scripts/scaffold.py"
        - "skills/test-graph/scripts/_common.py:594 (prepare_provider_bindings_or_warn)"
      workflow: []
    summary: >-
      SCAFFOLDING INTO A TARGET OUTSIDE THE SKILL'S TREE WRITES ABSOLUTE
      SYMLINKS. In-repository, `prepare-bindings.py` resolved the provider as
      `kind: workspace-relative` and wrote
      `test_graph/sdk -> ../skills/test-graph/project_sdk_sources/sdk`. Scaffolding
      into a directory outside the repository wrote
      `sdk -> /Users/hayde/IdeaProjects/wt-368-eval-ladder-graph-scaffold/skills/test-graph/project_sdk_sources/sdk`
      -- one developer's absolute home path, which is the exact shape commit
      `175f5c7c` removed from tracked content.
      IT IS NOT THE SAME DEFECT AND THE DIFFERENCE MATTERS: the links are inside
      the `TEST-GRAPH-MANAGED-BINDINGS` ignore block the scaffold writes, so
      nothing absolute is ever committed and `git status` stays clean. What is
      left is a directory that breaks if it is copied, moved or shared, with
      three dangling links and no note saying to re-run `prepare-bindings.py`.
    reproduction: >-
      `python3 skills/test-graph/scripts/scaffold.py /tmp/<fresh>` then
      `ls -l /tmp/<fresh>/test_graph` -- the three managed links are absolute.
      Compare `python3 skills/test-graph/scripts/prepare-bindings.py` run at the
      repository root, whose printed manifest says `"kind": "workspace-relative"`
      and whose links are `../skills/...`.
    why_out_of_scope: >-
      `skills/test-graph/**` is outside `conflict_keys.production` (`evals/**`).
    suggested_fix: >-
      Either say it -- one line in the scaffold's output that the managed links
      are machine-local and `prepare-bindings.py` re-materialises them after a
      move -- or make the absolute case self-healing, since
      `prepare_provider_bindings_or_warn` already runs before every Gradle
      invocation and could re-point a link whose target does not resolve.
    blast_radius: >-
      Any scaffolded project that is relocated or copied between machines.
      Nothing committed, nothing in CI.
    evidence:
      - "specs/results/epic-self-improvement-substrate/tickets/SI-19/transcripts/step-F-scaffold.txt"
      - "specs/results/epic-self-improvement-substrate/tickets/SI-19/transcripts/step-B-prepare-bindings.txt"
    skill_change: "none"
    disposition: still-true
    disposition_ticket: "SI-19"
    disposition_note: "Observed 2026-09-23. Not repaired: out of conflict keys."

