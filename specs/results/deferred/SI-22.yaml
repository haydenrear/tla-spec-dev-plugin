findings:
  - id: SI-22-DF-01
    status: open
    severity: high
    title: >-
      A SUCCESSFUL install of the tla-spec-dev plugin exits 11, because the
      installer validates deliberately-broken eval fixtures as if they were
      shippable skills
    what: >-
      `skill-manager install git+…/tla-spec-dev-plugin.git --ref main -y` into a
      fresh home installs everything correctly — 3 units resolved, 17 CLIs,
      units.lock.toml written, agents linked, the front door working — and then
      exits 11 on two "markdown skill-import violations". Both offending files
      are eval FIXTURES that are broken ON PURPOSE: the case owning the second
      one describes itself as being about "one unit's SKILL.md frontmatter is
      invalid YAML, so no sync can ever project it". The invalid frontmatter IS
      the fixture. The installer walks evals/**/fixture/**/SKILL.md and grades
      them as units. Reproduced on two independent installs (initial, and again
      after a remove-then-install cycle), AND on `skill-manager sync
      tla-spec-dev --git-latest`, which reports "synced 1 unit(s), 1 merged"
      and also exits 11 (step-23). So it is not an install-path quirk: EVERY
      route that refreshes the substrate exits non-zero.
      A fresh-machine bootstrap is a script,
      and a script reads $?; any `set -e` bootstrap, CI step, or agent checking
      the exit code of the one command GOAL-one-plugin is about will conclude
      the substrate failed to install when it installed correctly. It also sits
      against GOAL-no-new-gates: this blocks by exit code while printing a
      check-mark on every line that matters.
    where: >-
      Producer side (the fixtures, in this repository, my conflict key):
      evals/skt/w-skt-migration-no-import-edits/fixture/my-skill/SKILL.md and
      evals/git-issue-workflow/w-giw-exit6-is-unreadable-frontmatter/fixture/demo-skill/SKILL.md.
      Consumer side (the honest fix, NOT in this repository): the skill-manager
      installer's markdown skill-import validation, which should not walk
      fixture trees, or should not make a violation in one non-zero.
    evidence:
      - tickets/SI-22/transcripts/step-04-fresh-machine-walk.txt   # INSTALL rc=11
      - tickets/SI-22/transcripts/step-11-install-refusal-asymmetry.txt  # REINSTALL rc=11
      - tickets/SI-22/transcripts/step-12-install-exit-11-fixtures.txt   # both cases' own descriptions
    attribution: UNMODELED/install-pipeline
    disposition: >-
      NOT FIXED. Deliberately. Renaming or repairing the two fixtures would fix
      the exit code by breaking the two eval cases that exist precisely to have
      a broken fixture — trading a real finding for a green number. The fix
      belongs on the installer side, in the skill-manager repository, which is a
      separate checkout and a separate PR per the work order. Escalated to the
      epic agent in the PR body rather than actioned.

  - id: SI-22-DF-02
    status: open
    severity: high
    title: >-
      The plugin repository is PRIVATE, so the fresh-machine chain that
      GOAL-one-plugin names cannot be completed by a machine that has nothing
    what: >-
      GOAL-one-plugin's harness is "a fresh home: brew install the CLI, install
      the plugin, then run the front door". With a genuinely fresh HOME the
      install fails at the clone, rc=9. Reproduced by hand: `git clone` under a
      fresh HOME gives "fatal: could not read Username for 'https://github.com'"
      (rc=128) while the identical command under the operator's HOME gives rc=0,
      and `gh repo view haydenrear/tla-spec-dev-plugin --json isPrivate` returns
      true. The chain therefore completes only for a machine that already holds
      a GitHub credential for this account. A second, more transferable half:
      credential.helper=osxkeychain comes from the SYSTEM gitconfig (Xcode) and
      so IS found under a fresh HOME, but the login keychain it reads is at
      $HOME/Library/Keychains and so is NOT — the same HOME-vs-keychain
      constraint evals/README.md already documents for the Docker sandbox,
      reached here by a completely different route (a private git clone).
      Nothing in the install path says so. The minimum seed turned out to be one
      symlink, the same one setup-eval-home.sh makes.
    where: >-
      Not a code defect. The gap is between GOAL-one-plugin's target sentence
      and what a fresh machine can do. Surfaces at the resolve step of
      `skill-manager install` for any private coordinate.
    evidence:
      - tickets/SI-22/transcripts/step-04-fresh-machine-walk.txt
      - tickets/SI-22/transcripts/step-05-credential-provenance.txt
    attribution: UNMODELED/bootstrap-preconditions
    disposition: >-
      Reported, not routed around. SI-23 decides GOAL-one-plugin next wave and
      should read this as a qualifier on the goal statement, not as a failure of
      the substrate: every hop that could be demonstrated was demonstrated. The
      substantive question for the owner is whether "one installed plugin
      provides the substrate" is meant to hold for a machine outside this
      account, and if so whether the repo should be public or the goal reworded.

  - id: SI-22-DF-03
    status: open
    severity: medium
    title: >-
      `skill-manager install` truncates its own resolve diagnostic at ~200
      characters, discarding the actual git error
    what: >-
      The install failure printed
      "git clone https://… refused: Cloning into '/private/…/cache/sta…" —
      ending mid-path with an ellipsis. The retained text is the part git always
      prints; the discarded part is the reason. Diagnosing rc=9 required
      reproducing the clone by hand under the same HOME to see "could not read
      Username". This is the same shape as the SI-21 note on
      setup-eval-home.sh's smoke filter: a refusal whose cause is in the bytes
      the tool chose not to show. An agent reading only the CLI output cannot
      distinguish "network down" from "repo private" from "bad ref".
    where: >-
      skill-manager's BuildResolveGraphFromSource failure message. Not in this
      repository.
    evidence:
      - tickets/SI-22/transcripts/step-04-fresh-machine-walk.txt
    attribution: UNMODELED/install-pipeline
    disposition: >-
      Filed only. Out of my conflict keys and in a separate repository.

  - id: SI-22-DF-04
    status: open
    severity: low
    title: >-
      `skill-manager install --dry-run` prints "no changes will be made" and
      then writes policy.toml into the home
    what: >-
      Running `install <coord> --dry-run` against a home that was one empty
      directory left exactly one file behind: policy.toml. The banner reads
      "DRY RUN — no changes will be made". The file is harmless and probably
      wanted (a home needs a policy), but the sentence is false as written, and
      "dry run" is the affordance an agent reaches for precisely when it does
      not yet trust the command with a real home.
    where: skill-manager `install --dry-run`; home initialisation side effect.
    evidence:
      - tickets/SI-22/transcripts/step-03-fresh-home-dry-run.txt
    attribution: UNMODELED/install-pipeline
    disposition: Filed only. Separate repository.

  - id: SI-22-DF-05
    status: open
    severity: low
    title: >-
      The already-installed refusal fires AFTER the resolve, so a re-install
      attempt has already cloned every repository before being told no
    what: >-
      The dry-run effect list orders them explicitly — [1] resolve graph from
      source, [3] reject if top-level resolved unit already installed. Observed
      live: an install over an installed plugin printed three "cloning …" lines
      and "resolve: 3 unit(s)" before halting with "unit 'tla-spec-dev' is
      already installed — remove it first" (rc=4). The installed-set check needs
      no network and could run first. On a slow link this is a full multi-repo
      fetch spent to learn the command was never going to proceed. Sharpens
      SI-12-DF-06, which records the refusal but not its cost or its ordering.
    where: skill-manager install effect ordering ([1] before [3]).
    evidence:
      - tickets/SI-22/transcripts/step-11-install-refusal-asymmetry.txt
      - tickets/SI-22/transcripts/step-03-fresh-home-dry-run.txt   # the effect list
    attribution: UNMODELED/install-pipeline
    disposition: Filed only. Separate repository.

  - id: SI-22-DF-06
    status: open
    severity: low
    title: >-
      `skill-manager remove <plugin>` leaves the plugin's CLI shims in
      bin/cli/, so the front door outlives the unit that provides it
    what: >-
      After `skill-manager remove tla-spec-dev` succeeded and `list` showed the
      plugin gone, bin/cli/skt was still present and still executable — i.e.
      still on PATH for anything sourcing that home's bin. The refusal it gives
      is GOOD, and that is why this is low rather than medium: it exits 127,
      names the exact file it looked for
      (plugins/tla-spec-dev/skills/skt/src/skt/cli.py), states that the wrapper
      is not a link into a home that does, and offers two remedies; `skt ticket
      new` through it creates nothing (path-tested: 0 directories). It is the
      `w-skt-which-copy-of-skt-ran` situation with the answer already printed.
      Recorded because a dangling front door is still a surface an agent meets,
      and because `remove`'s own help says it is "lower-level than uninstall"
      without saying that CLI shims are among what it leaves.
    where: skill-manager `remove` cleanup scope vs `uninstall`.
    evidence:
      - tickets/SI-22/transcripts/step-11-install-refusal-asymmetry.txt
    attribution: UNMODELED/install-pipeline
    disposition: >-
      Filed only. Arguably working as designed — `uninstall` is documented as
      the full cleanup — in which case the actionable half is the help text.

  - id: SI-22-DF-07
    status: open
    severity: medium
    title: >-
      A new eval case must be registered in TWO files, and omitting the second
      produces a plausible 0.00 rather than an error
    what: >-
      `evals/lib/place.sh` and `evals/lib/verify.sh` each carry an explicit
      `case "$case_name"` arm per case. place.sh copies the fixture; verify.sh
      calls `verify_from_expect`, which is what writes the `.eval/require-*`,
      `.eval/forbid-*` and `.eval/within-budget` markers the `file_exists`
      graders read. Registering in place.sh ONLY — which is what a reader of
      evals/README.md would do, since the README documents fixture placement
      and never mentions verify.sh — yields a run where the agent works, the
      fixture is present, every grader reports "<marker> missing (expected
      present)", and the case scores 0.00. Measured on all three of SI-22's new
      cases in one shakedown run: 0.00, 0.00, 0.00, $0.74 total. Adding the
      verify.sh arms was the whole fix. This is exactly the STATE.md class "an
      instrument that failed quietly and produced a plausible number rather
      than an error", and it is the same shape as the defect that motivated
      check_graders.py: nothing between writing a case and billing it says the
      case cannot be scored.
    where: >-
      evals/lib/place.sh and evals/lib/verify.sh (the paired case arms);
      evals/README.md, which documents neither the pairing nor verify.sh's role.
    evidence:
      - tickets/SI-22/transcripts/step-19-runs1-unregistered.txt  # 3 cases, all 0.00, all markers missing
      - tickets/SI-22/transcripts/step-21-runs1-registered.txt    # same 3 cases after the verify.sh arms
    attribution: UNMODELED/eval-harness
    disposition: >-
      Worked around for my own cases by adding the arms. NOT fixed generally: a
      real fix is either one registration point instead of two, or a check that
      refuses/warns when a case has an expect.json and no verify.sh arm. Both
      are changes to the shared harness beyond this ticket's slice. The cheap
      half — a paragraph in evals/README.md — I did not write either, because
      the README is a shared surface mid-ladder and SI-23 reads it next.

  - id: SI-22-DF-08
    status: open
    severity: medium
    title: >-
      A case shipped by SI-21 has been unloadable on the epic tip since
      eeb352f9: one paragraph lost its indent and broke the YAML
    what: >-
      Every run on this tip prints "1 case file(s) failed to load" and names
      evals/spec-double-2/w-sdc-spec-unit-ticket-runs-only-the-first-target with
      "YAML Parse error: Multiline implicit key". Cause: line 22 of its
      case.yaml, a paragraph beginning "HOW THIS CASE IS SCORED", sits at column
      0 instead of the two-space indent of the `description: >-` block it
      belongs to, so YAML reads it as a new top-level key spanning nine lines.
      Introduced by eeb352f9 ("SI-21: evidence, local signal, and the inert
      expect.json removed"), confirmed by `git log` on the path — it is not
      mine. The case therefore has NEVER RUN since that commit. It is one of
      SI-21's three deliverables and one of the ladder's own cases, and the
      corpus silently lost it: a case that fails to load is not a red row, it
      is an absent row, and the run's summary table does not list it at all.
    where: >-
      evals/spec-double-2/w-sdc-spec-unit-ticket-runs-only-the-first-target/case.yaml:22
    evidence:
      - tickets/SI-22/transcripts/step-19-runs1-unregistered.txt  # the loader's message
      - tickets/SI-22/transcripts/step-20-preexisting-broken-case.txt  # git log attribution
    attribution: UNMODELED/eval-harness
    disposition: >-
      FIXED HERE — two spaces added, restoring the author's evident intent with
      no semantic change. evals/** is this ticket's production conflict key and
      a case that cannot load is not measuring anything. The residual finding is
      the DETECTION, not the typo: "failed to load" is printed once, mid-run,
      above the summary table, and the corpus count silently drops by one. A
      case that cannot be loaded should be as loud as a case that scores 0.
