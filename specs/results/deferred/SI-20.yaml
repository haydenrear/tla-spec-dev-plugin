record: specs/results/epic-self-improvement-substrate/tickets/SI-20/manual-verification.md
findings:

  - id: SI-20-DF-01
    status: fixed_here
    title: >-
      skt.ticket-roundtrip created a real linked worktree in the operator's
      checkout directory while declaring side_effects fs:tmp
    what: >-
      The node built its fixture repo under ctx.report_dir, which is inside this
      repository, which carries integration.toml at its root. A ticket worktree
      goes beside the OUTERMOST enclosing integration repo, so every run created
      /Users/hayde/IdeaProjects/subject-repo-TG-1 — beside twenty-three live
      ticket worktrees — and removed it again only because `close` resolves by
      search. A run interrupted between `new` and `close` leaves it standing.
      This is also the whole of the epic agent's EA-DF-02: the four "wrong
      location" reds were the node asserting a path that can never be right
      there, not a defect in `skt ticket new`.
    evidence:
      - transcripts/step-05-ea-df-02-two-arms.txt   # one fixture, one variable
      - transcripts/step-10-falsification-arm.txt   # the repair, falsified
    attribution: UNMODELED/test-fixture
    disposition: >-
      FIXED in this PR. The fixture root moved to tempfile.mkdtemp(); both
      placement classifications are now driven; and the containment is asserted
      WHILE the worktree stands, not after close has tidied it away. Proven to
      fail on reintroduction: 13 red, including the two new stray assertions.

  - id: SI-20-DF-02
    status: open
    title: >-
      `skt ticket new` can no longer reach _giw_remedy, so the four-way refusal
      discrimination merged as #25 is dead code on that route
    what: >-
      ticket.py:66 (_giw_remedy) is called from ticket.py:122 (_import_wrapper)
      only when `import skt.wt` FAILS. SI-17 moved wt into skt, so that import
      now always succeeds; the only other caller is epic_new, the --path route.
      Driven by hand, three fixtures that differ in whether git-issue-workflow is
      installed / declared / neither produce a BYTE-IDENTICAL message ("no Skill
      Manager home could be created for this worktree"). With the home step
      skipped they all SUCCEED, in homes carrying no git-issue-workflow at all,
      because `wt` resolves the lifecycle from the plugin it ships in rather than
      from $SKILL_MANAGER_HOME. The failure mode those remedies described was
      DELETED by one-plugin containment; the code that describes it was not.
    evidence:
      - transcripts/step-03-refusals-byhand.txt
      - transcripts/step-04-refusals-skip-home.txt
    attribution: UNMODELED/cli-refusal-path
    disposition: >-
      NOT fixed — skills/skt/src/skt/ticket.py is outside this ticket's
      conflict keys (production: evals/**). The graph no longer asserts the
      unreachable phrases; it asserts the property #25 was defending instead
      (the remedy it prints must exist and be executable), and the reason is a
      comment in the node with this id on it. The decision for the epic agent is
      whether _giw_remedy is deleted, or reached again from the wt route.

  - id: SI-20-DF-03
    status: open
    title: >-
      the "no home at all" refusal fixture never reached the home check — a bare
      mkdtemp is not a git repository
    what: >-
      The case ran skt in tempfile.mkdtemp(), so skt refused one step earlier
      with "not inside a git repository" and the case's name has been wrong since
      it was written. Point the same env at a real git repo and it SUCCEEDS,
      exit 0, worktree created. A fixture whose name and subject disagree is an
      assertion nobody can audit.
    evidence:
      - transcripts/step-04-refusals-skip-home.txt   # arms 1 and 2, same env
    attribution: UNMODELED/test-fixture
    disposition: >-
      FIXED in the node as far as naming goes: the case is now called "not a git
      repository at all" and asserts what it actually exercises. The refusal it
      was MEANT to test — a checkout with no home anywhere above it — is not
      reachable through this node without a home fixture, and is left undone.

  - id: SI-20-DF-04
    status: open
    severity: data-loss-adjacent
    title: >-
      `skt ticket sweep` in a repository with more than one epic resolves no
      epic, skips containment, and plans to remove every worktree
    what: >-
      sweep.py:419 returns an epic only when EXACTLY ONE epic/* ref exists. This
      repository has fourteen, so `skt ticket sweep` prints "epic none
      discoverable", never checks containment, and marks all 23 worktrees
      "would remove" — including wt-epic-self-improvement-substrate, the epic's
      own worktree, and every in-flight ticket worktree of this wave. Each row
      also says "clean — no blocker". The default answer in a multi-epic
      repository is *remove everything*, not *refuse until you name an epic*.
      The armed run re-runs the home close-out gate per worktree, which is the
      only thing between that plan and 23 deletions.
    evidence:
      - transcripts/step-02-verb-gamut.txt   # `skt ticket sweep`, dry run
    attribution: UNMODELED/worktree-sweep
    disposition: >-
      Deferred: skills/skt/src/skt/sweep.py is outside this ticket's conflict
      keys. The eval evals/skt/w-skt-sweep-requires-epic already grades the
      AGENT for naming the epic; nothing grades the TOOL for what it does when
      the agent does not.

  - id: SI-20-DF-05
    status: open
    title: >-
      `skt status` names a long-closed epic as "available"; its docstring claims
      a derivation it does not share with the sweep
    what: >-
      context.py:192 takes the FIRST epic/* ref and breaks, with no uniqueness
      check, so `skt status` in this checkout reports "epic
      architectural-coherence available" — an epic closed on 2026-08-03 — while
      the active epic is self-improvement-substrate. sweep.discover_epic_slug's
      docstring says "Same derivation as context.gather". It is not: one takes
      the first of fourteen, the other refuses unless there is exactly one. Two
      commands, one checkout, two different answers to "which epic is this".
    evidence:
      - transcripts/step-02-verb-gamut.txt   # `skt status` and `skt ticket sweep`
    attribution: UNMODELED/checkout-context
    disposition: Deferred; same conflict-key reason as SI-20-DF-04.

  - id: SI-20-DF-06
    status: open
    title: >-
      every epic ticket worktree is told its ticket is NOT in the plan, because
      the branch spells the issue slug and the plan spells the spec id
    what: >-
      `skt status` says "spec workflow 'self-improvement-substrate' active; no
      open tickets — this branch's ticket is NOT in the plan". The ticket IS in
      the plan, as SI-20; the branch is feature/369-eval-ladder-skt, and
      context.py:200 compares the two literally. Every ticket worktree in this
      epic gets the same wrong sentence, and it is the one line of `skt status`
      that is about whether the agent is where it should be.
    evidence:
      - transcripts/step-02-verb-gamut.txt
    attribution: UNMODELED/checkout-context
    disposition: >-
      Deferred. Related to the recorded disagreement between what the epic skill
      and the spec compiler call a ticket; the fix is a mapping, not a
      comparison, and it belongs with whoever owns the assignment schema.

  - id: SI-20-DF-07
    status: open
    title: >-
      `skt check` exits 0 with the headline "all current" after not checking one
      of the two surfaces it reports on
    what: >-
      A live run printed "skt check: all current (11 change-managed unit(s),
      tier worktree)" and, on its second line, "artifacts not checked (timeout):
      skill-manager artifacts stale --json did not finish inside 6.0s". Exit 0.
      A caller that reads the exit code or the headline gets "everything is fine"
      from a run that measured one of two surfaces. This is the epic's recurring
      shape: could-not-do-the-task and did-the-task rendering the same.
    evidence:
      - transcripts/step-02-verb-gamut.txt   # skt check, live
    attribution: UNMODELED/notification-check
    disposition: >-
      Deferred. The honest half is already there — it says what it skipped — so
      the fix is small: a distinct exit code, or a headline that names the
      partial measurement.

  - id: SI-20-DF-08
    status: open
    title: >-
      `skill-manager home close-out --json` has no `clean` key in the verdict
      that matters, and emits 3.7 MB
    what: >-
      The real verdict's keys are blockers, exitCode, home, into, safe,
      selfObtainable, units — no `clean`. The ERROR verdict (not-a-home) does
      carry "clean": false. So a consumer keying on `clean` reads None from the
      verdict that decides the close and false from the one that does not. The
      payload is 3,748,517 bytes, 3,774,707 of which is `units`, which makes it
      impractical to log or diff. Read `safe` and `exitCode`.
    evidence:
      - transcripts/step-07-home-close-out.txt
    attribution: UNMODELED/home-close-out
    disposition: >-
      Deferred: skill-manager is a separate unit and the verb is the close-out
      gate the epic agent runs at wave close. Worth knowing before anyone writes
      a filter for it — a blank result read as a failure has already happened
      once in this epic.

unexercised:
  - verb: skt publish <unit>
    reason: writes outside the worktree (parent home, then the unit's git repo); forbidden by this issue. `publish --check` was run and is read-only.
  - verb: skill-manager home sync
    reason: same, and the assignment reserves home reconciliation for the epic agent at wave close.
  - verb: skt ticket sweep --yes
    reason: the dry run says it would remove 23 worktrees including this epic's own.
  - verb: skt build (for real)
    reason: needs `skill-manager home shims`, which writes a home. --dry-run reached the same refusal, so the refusal is the observation.
  - verb: skill-manager home close-out --into <the operator's project home>
    reason: >-
      NOT unexercised in the end. The FIRST attempt was refused by this
      session's sandbox as a shared-resource write, although the verb's own
      --help says "Writes nothing; safe to run repeatedly"; re-attempted at the
      end of the ticket it ran, exit 0, verdict "holds nothing that removing it
      would destroy" (close-out-verdict.txt). Kept in this list because the
      intermittency is the finding: the command the assignment REQUIRES before
      stopping was not reliably reachable from a ticket agent's seat, and an
      agent that took the first refusal at face value would have stopped
      without it.
