findings:
  - id: ESD-04-DF-01
    found_by: "ESD-04"
    found_at_commit: "847aa4a9"
    schedule_revision: 1
    severity: minor
    blocking: false
    channel: operator-doing-the-work
    area: "workflow records: reviewer/verifier model and harness identity is not recorded"
    surface:
      production: ["skills/git-epic-workflow/references/human-review.md", "skills/git-issue-workflow/references/complete.md"]
      tla: []
      adapters: []
      test_graph: []
      workflow: []
    summary: >-
      step-sizing.md §1/§6 make the reviewer and verifier model+version an input and a recalibration
      override, but no existing record carries it: ESD-01 found a named model in one record only
      (meta-harness finalization). All four ESD-04 replays had model `unknown`, so the recalibration
      rule cannot be exercised retrospectively. This is the twin of ESD-01-DF-01 (no start timestamps).
    reproduction: "grep -c 'model: unknown' specs/results/evidence-sized-delivery/ESD-01/inventory.yaml"
    evidence:
      - "specs/results/evidence-sized-delivery/ESD-01/README.md (model/version recorded for almost no finding)"
      - "specs/results/evidence-sized-delivery/ESD-04/local-signal.md (summary table)"
    why_out_of_scope: >-
      The PR-body / review-artifact conventions live in human-review.md, complete.md and epic-ticket.md,
      which are ESD-05's conflict keys.
    suggested_fix: >-
      ESD-05: one line in the PR-body and review-artifact conventions -- "agent model + version, harness
      version" -- next to the start-time convention it may route for ESD-01-DF-01. Prose only.
    skill_change: "tla-spec-dev/git-epic-workflow human-review.md; tla-spec-dev/git-issue-workflow complete.md (prose line)"
    blast_radius: "Capacity calibration across model changes stays unmeasurable."
    disposition: pending
    disposition_ticket: ESD-05

