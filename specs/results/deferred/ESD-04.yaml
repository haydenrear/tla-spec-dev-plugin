  - id: ESD-04-DF-03
    found_by: "ESD-04"
    found_at_commit: "847aa4a9"
    schedule_revision: 1
    severity: minor
    blocking: false
    channel: operator-doing-the-work
    area: "workflow records: batch scope (items per batch) is not recorded"
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: []
    summary: >-
      Capacity is counted in scope items (behavior x boundary, plus interacting pairs), but no audited
      record states how many items a batch held. CDC's #394/#462 retrospective gives per-batch phase
      hours with no item count, which is why replay R3 is UNDECIDED. Without it, per-item review or
      verification cost cannot be measured.
    reproduction: "Read specs/results/evidence-sized-delivery/ESD-04/local-signal.md R3."
    evidence:
      - "specs/results/evidence-sized-delivery/ESD-01/cost.md (C17, C18)"
    why_out_of_scope: "A recording convention for review artifacts; human-review.md belongs to ESD-05."
    suggested_fix: >-
      The review artifact's delivery-velocity section lists the batch's scope items (validation-review.md
      Deeper review already hosts the section; step-sizing.md §6 names the observations). ESD-05 may add
      the line to human-review.md's artifact list.
    skill_change: none
    blast_radius: "GOAL-ESD-CAPACITY calibration."
    disposition: pending
    disposition_ticket: ESD-05
