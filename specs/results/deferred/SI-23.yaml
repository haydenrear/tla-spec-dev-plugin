  - id: SI-23-DF-21
    attribution: UNMODELED/test-graph-scaffold
    status: open
    severity: high
    title: >-
      `specWorkflow` is RED at the epic tip: a review-driven fix made a node
      source non-relocatable, and the epic's own state document reports the
      graph green
    what: >-
      `python3 skills/test-graph/scripts/run.py specWorkflow cliWorkflow
      effectProviderExamples` -> sweep reports specWorkflow FAILED. Read from
      that run's own fresh summary.json (runId 20260926-172628, NOT the runner
      exit code): status "errored", complete false, 69 assertions / 64 passed,
      five failed assertions all in node spec.workflow.failure_cleanup_probe,
      and spec.reference.adapters_resolve skipped as collateral.
      Root cause: the cleanup-failure probe copies test_graph/sources/ into
      build/validation-reports/<runId>/cleanup-failure-probe-test-graph/sources/
      and runs --describe over every source. skt_hook_contract.py:69-70 does
      `sys.path.insert(0, str(SKT_SKILL_ROOT / "src"))` then `from skt.check
      import SCHEMA_VERSION`, where SKT_SKILL_ROOT = REPO_ROOT/"skills"/"skt"
      is derived from __file__ (test_graph/support/skt_fixture.py:29). Relocated,
      REPO_ROOT resolves into the fixture dir, which has no skills/skt, so the
      import raises ModuleNotFoundError: No module named 'skt' (exit 1).
      CONTROLLED TWO-ARM TEST, run in the REAL fixture location so uv script
      requirements resolve identically in both arms:
        ARM 1  tip version                  -> rc=1  ModuleNotFoundError: No module named 'skt'
        ARM 2  parent version (7d696715^)   -> rc=0
      Same path, same interpreter, same everything else. The regression is
      commit 7d696715 "SI-28 review: a cache of the wrong schema is not a
      cache", 2026-09-26, which replaced a literal `"schema": 2` with a read of
      the live SCHEMA_VERSION. The fix is correct in intent and introduced a
      cross-tree import into a file that gets relocated.
      NOTE ON MY OWN FIRST ATTEMPT: I first ran the two arms from a scratchpad
      copy. BOTH arms returned rc=1 with "Failed to resolve script requirement"
      -- a uv resolution failure, never reaching the import. That two-arm test
      was invalid and would have shown "no difference". Re-run in the real
      location it separates cleanly. Verifying the step rather than the outcome,
      caught before it was reported.
      7d696715 is an ancestor of BOTH 8b6d97e8 and the review's own tip
      37ada6f4, so REVIEW-BEFORE-SI-23.md section 1's "specWorkflow 74" cannot
      have been measured after it -- it is a stale report, which is exactly the
      DEF-OUN-023 trap the runner's own docstring warns about.
    surface:
      production:
        - test_graph/sources/skt_hook_contract.py
        - test_graph/support/skt_fixture.py
