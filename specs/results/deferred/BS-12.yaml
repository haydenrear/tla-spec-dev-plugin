# BS-12 (#141, #138 DEF-516 + mutation-close) per-ticket deferment inbox
# (batch policy, budget 5). The epic agent absorbs these rows at wave close.
findings:
  - id: BS-12-DF-01
    found_by: BS-12
    found_at_commit: 0bb9a950
    schedule_revision: 1
    severity: minor
    blocking: none
    surface:
      production:
        - skills/spec-double-2/scripts/tla_spec_dev.py (run spec-unit-tests)
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      #138 DEF-516, second half: `run spec-unit-tests --ticket <id>` runs
      project specs/current first and stops on its failure, so a ticket's own
      targets never run until close. BS-12 fixed the layout half (open seeds
      current/ when the plan runs it) only.
    reproduction: >-
      spec_unit_target_dirs() returns [project_current, ticket_model] for
      --ticket; run_spec_unit_tests returns on the first failing target.
    why_out_of_scope: >-
      The spec-unit run path is not the open/close-ticket path named in BS-12's
      conflict keys.
    suggested_fix: >-
      With --ticket, run every target and report each, or run the ticket model
      alone and say so.
    blast_radius: Ticket agents reading a red spec-unit run that is not theirs.
  - id: BS-12-DF-02
    found_by: BS-12
