        - skills/git-epic-workflow (closure census)
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      #141 "Census after close": once close_tickets.py removes
      desired_program_model/, tools that read ticket_plan.yaml (the epic
      closure census) cannot run; the closed snapshot's plan is not exposed as
      the plan of record.
    why_out_of_scope: >-
      Not one of BS-12's named items (SF-074/075/076, DEF-516,
      mutation-close); it needs a reader-side convention across skills.
    suggested_fix: >-
      Have the census (and validate_epic_plan.py's default path) fall back to
      specs/.history/<workflow>/closed-snapshot/.../ticket_plan.yaml when the
      live plan is absent, printing which it read.
    blast_radius: Post-close epic audits.
