  - id: BS-12-DF-04
    found_by: BS-12
    found_at_commit: 0bb9a950
    schedule_revision: 1
    severity: minor
    blocking: none
    surface:
      production:
        - skills/git-epic-workflow/scripts/validate_epic_plan.py (_validate_goal_alignment)
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      The git-epic-workflow#19 class #141 says SF-076 absorbs ("you cannot
      retire one contributor to a goal that other tickets still serve") is
      still diagnosed: "retirement disposition conflicts with active tickets".
      It is advisory by default (non-Blocking), so it does not stop an epic;
      BS-12 changed only the successor-identity rule.
    why_out_of_scope: >-
      Changing what a partial retirement means for a goal is a plan-semantics
      decision for the epic owner, not a tooling fix.
    suggested_fix: >-
      Owner decision: keep the advisory, or accept a partial retirement when
      the goal still has a live contributor and evaluator.
    blast_radius: Advisory warning noise on partially retired goals.
