- found_by: BS-05
  id: BS-05-DF-02
  unit: skill-manager (CLI)
  blocking: false
  observed: The CLI has no verb that syncs ONE unit to a given revision. `sync --lock` re-syncs bumped
    units to their recorded ref, not the lock's resolved_sha, and `sync --from` needs a hand-made clone.
    So skt restores a pin through `project resolve`, which reconciles the whole project. Whether resolve
    moves an already-installed drifted unit back to its revision was not exercised against the real CLI
    here (fixture CLI only); skt verifies the result and exits 11 if it did not.
  proposed: '`skill-manager sync <unit> --revision <sha>` (or have `sync --lock` honour resolved_sha),
    then point skt''s pin path at it.'
