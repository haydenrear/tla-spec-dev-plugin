  origin: instrument
  area: "the eval harness's per-case dispatch in evals/lib/verify.sh"
  observed: "both new cases scored 0.00 with every verdict file missing, including the forbid and within-budget ones; neither case had a verify arm"
  effect: "false red: two billed runs ($0.39) measured the missing arm, not the agents. Also caught by operator-running-a-shipped-instrument (the eval run itself), read correctly only because ALL verdicts were absent"
  fix: "arms added for both cases"
  pinned_by: null
  pin_note: "nothing checks that a case directory has a verify arm; verify.sh's own comment calls a missing arm 'the silent one'"
  skill_change: "proposed(evals/lib: a pre-flight that names any case with expect.json and no verify arm, beside check_cases_parse.py)"

