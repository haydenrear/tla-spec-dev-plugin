# Attribution for branch feature/skt-regress (`skt regress`, step-sizing §0).
#
# WHERE THESE BELONG. This branch was built without a ticket, so there is no
# per-ticket inbox to file into. Per bug_attribution.md §4 the rows are written
# here, beside the work, and move into the ledger
# (specs/results/deferred_findings_final.yaml) when an epic absorbs the branch.
#
# Every row is a CATCH (§4). `origin` is where the fix went (§4.3):
# product = skt regress and its docs; instrument = the evals and tests that
# measure it. `effect` is in words. Commits are on feature/skt-regress.
# Found on 845659d8/82e1c72d (the first pushed state); all fixed in the commit
# that adds this file unless `fix` says otherwise.

- id: REGRESS-REVIEW-01
  severity: major
  channel: independent-review
  origin: product
  area: "skt regress: tree_changes, the measurement behind the fix budget and close"
  observed: "untracked files were invisible: a report-only run that created a 500-line file ended green with fixes.files [], and `close` then deleted the file"
  effect: "false green on the budget and report-only checks; silent loss of the agent's work on close"
  fix: "untracked files count as changes (the test graph's build/ output excepted); close refuses while they exist"
  pinned_by: "skills/skt/tests/test_regress.py::test_an_untracked_file_is_a_change_and_close_will_not_delete_it"

- id: REGRESS-REVIEW-02
  severity: major
  channel: independent-review
  origin: product
  area: "skt regress run: which commit a rerun's changes are measured against"
  observed: "a report-only rerun under the same id, after a fix attempt, was escalated for 'changed the tree' though it changed nothing"
  effect: "false escalation on the path regression-handoff.md tells the epic agent to take after `incomplete`"
  fix: "the report-only check measures from HEAD at the start of the attempt; the line/file budget stays per branch, and the doc says so"
  pinned_by: "skills/skt/tests/test_regress.py::test_a_rerun_is_not_blamed_for_the_previous_attempts_fix"

- id: REGRESS-REVIEW-03
