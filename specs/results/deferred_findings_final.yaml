      test_graph: []
    summary: >-
      Two parser defects in skill-manager's `.github/scripts/select-graph-set.py`,
      the script that decides which graphs CI runs. (1) `discover_all()` ran its
      regex over the raw build file, so a graph name written inside a COMMENT
      registered a phantom graph; rewriting the header comment in this ticket
      took the registered count from 30 to 31 with no graph added, and a phantom
      name in the matrix produces a CI job for a task Gradle does not have.
      (2) `_graph_nodes()` counted braces over the whole line, so the
      conditionally-registered graph written as `} else testGraph(...) {` closed
      its own block immediately and was recorded with 0 nodes instead of 24 --
      and that node list is what `gateway_graphs()` reads, so the graph was
      reported as booting no gateway when it boots one.
    reproduction: >-
      In skill-manager before the fix: `discover_all()` returns 31 names
      including `...` once the header comment contains a quoted testGraph
      example; `_graph_nodes()["hyper-experiments"]` has length 1 where the
      registration declares 24 nodes.
    evidence:
      - "specs/results/epic-self-improvement-substrate/tickets/SI-13/skill-manager-classification.txt"
    why_out_of_scope: >-
      In scope for this ticket's skill-manager half and fixed there, in the
      skill-manager PR, not in this repository.
    suggested_fix: >-
      Applied: discovery blanks comments before matching, and the brace walk
      counts from the match onwards. Both carry the measurement in a comment.
    blast_radius: >-
      skill-manager CI's graph matrix, and any count of "how many graphs does
      this repository have" taken from that script.
    skill_change: "applied(skill-manager: .github/scripts/select-graph-set.py, branch feature/si13-graph-classification)"
    disposition: fixed
    disposition_ticket: "SI-27 (#382)"
    fixed_by: "skill-manager .github/scripts/select-graph-set.py:200,220-270"
    disposition_note: >-
      FIXED in skill-manager, and the fix is present in that checkout.
      .github/scripts/select-graph-set.py:220-270 now defines
      `_without_comments()` ("Blank out `//` and `/* */` comments, preserving
      offsets and line count") with the 2026-09-19 phantom-graph measurement
      in its docstring, and `discover_all()` at :270 runs the regex over
      `_without_comments(...)`. The brace walk at :200 carries "Count braces
      from the match onwards, not over the whole line." Both defects the row
      names are closed. measured 2026-09-23 on
