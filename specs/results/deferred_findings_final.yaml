      - "examples/validation/runs/ex5-run4/artifacts/reexport_attack/shared.py"
      - "examples/validation/runs/ex5-run4/artifacts/reexport_attack/attack.diff"
      - "examples/validation/runs/ex5-run4/artifacts/BLIND-RUN-A-REPORT.md"
      - "examples/validation/runs/ex5-run4/scoring.md"
    why_out_of_scope: >-
      EV-03's conflict keys are examples/validation/ and NEXT-EPIC.md;
      scripts/architecture_reflexion.py is in neither. And the standing rule
      binds harder here than usual: this finding was produced BY the
      measurement, by a blind agent under test, and fixing it inside the
      measurement would have destroyed the only run that found it.
    suggested_fix: >-
      Resolve first-party-ness against the PROJECT root and the import paths the
      project actually uses, not against a single hardcoded sibling of the code
