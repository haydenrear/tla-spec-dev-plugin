  - id: SI-20-DF-04
    severity: data-loss-adjacent
    title: >-
      `skt ticket sweep` in a repository with more than one epic resolves no
      epic, skips containment, and plans to remove every worktree
    what: >-
      sweep.py:419 returns an epic only when EXACTLY ONE epic/* ref exists. This
      repository has fourteen, so `skt ticket sweep` prints "epic none
      discoverable", never checks containment, and marks all 23 worktrees
      "would remove" — including wt-epic-self-improvement-substrate, the epic's
      own worktree, and every in-flight ticket worktree of this wave. Each row
      also says "clean — no blocker". The default answer in a multi-epic
      repository is *remove everything*, not *refuse until you name an epic*.
      The armed run re-runs the home close-out gate per worktree, which is the
      only thing between that plan and 23 deletions.
    evidence:
      - transcripts/step-02-verb-gamut.txt   # `skt ticket sweep`, dry run
    attribution: SktTicketSweep
    attribution_was: UNMODELED/worktree-sweep
    status: fixed
    fixed_by: "2035c3cb"
    disposition: >-
      FIXED by the epic agent at wave-18 close, in sweep.py's `_local_state`.
      SI-20 filed it deferred because skills/skt/ is outside its conflict keys,
      which was correct; the epic agent owns the call and made it, because a
      data-loss-adjacent default is not a thing to carry into an eval ladder.

      The repair is four lines and it is the module obeying its own rule.
      `blockers` says "an evidence gap is not a clean bill of health ... 'could
      not tell' must never read as 'nothing here'", and `unpushed is None`
      already obeyed it. Containment did not: with `target` None the question
      was never ASKED, so it became neither a blocker nor an `unmeasured` entry.
      Now it appends to `unmeasured`, so the gate refuses instead of guessing.

      MEASURED BOTH WAYS on the real checkout: installed skt 0.8.2 prints
      "would remove" for 23 worktrees; the repaired source prints 0, each
      SKIPPED with "could not determine whether its commits are contained
      anywhere -- refusing to guess". Cost of the refusal is one flag:
      --epic <slug> or --target <ref>.

      One correction to SI-20's row. It says the plan included
      wt-epic-self-improvement-substrate. On re-measurement the epic's own
      worktree shows SKIPPED even UNFIXED -- but only because it happens to
      carry another blocker right now, so its protection was incidental rather
      than designed, which is the same hazard stated more precisely.

