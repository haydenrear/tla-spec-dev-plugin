    severity: major
    surface:
      production: ["skill-manager: SkillScriptBackend.resolveScript", "skt references/dependencies.md"]
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      skill-manager resolves a `skill-script:` CLI installer by the INSTALLED
      UNIT's name and probes exactly two rungs --
      `<home>/skills/<unit>/skill-scripts/` and
      `<home>/plugins/<unit>/skill-scripts/`. There is no
      `plugins/<plugin>/skills/<skill>/skill-scripts/` rung, and the declaring
      skill's name is not carried at all: PluginUnit.unionCli flattens every
      contained skill's cli_dependencies onto the plugin and CliDependency has
      no owner field. So a `skill-script:` dep declared on a CONTAINED SKILL has
      no working spelling. The thrown error is the FIRST rung's miss, so it
      names `<home>/skills/<plugin>/skill-scripts/...` -- a path that was never
      right -- and never mentions the plugin rung it also missed, which is why
      this reads as a migration leftover rather than an unsupported shape.
      skt's references/dependencies.md actively advises the broken shape
      ("declare deps as close as possible to the capability that uses them")
      with no carve-out for skill-script.
    reproduction: >-
      `SKILL_MANAGER_HOME=<scratch> skill-manager install
      github:haydenrear/tla-spec-dev-plugin -y` into a fresh home reports
      `cli: 15 installed, 2 failed` with `skill-script not found:
      <home>/skills/tla-spec-dev/skill-scripts/install-tlc2.sh`. The project
      home hides it because its shims predate the migration.
    evidence:
      - "specs/results/epic-self-improvement-substrate/tickets/SI-11/SIS-W2-F-05-repro-before.txt"
      - "specs/results/epic-self-improvement-substrate/tickets/SI-11/SIS-W2-F-05-repro-after.txt"
    why_out_of_scope: >-
      The resolver is skill-manager's own Java source in a different repository
      (haydenrear/skill-manager), which this ticket's conflict keys do not
      cover. SI-11 removed the SYMPTOM here by relocating ownership of the two
      deps to the plugin manifest, which is the shape skill-manager documents
      and its own skt plugin already ships; the missing rung itself survives.
    suggested_fix: >-
      Add a third rung to SkillScriptBackend.resolveScript, after the SKILL and
      PLUGIN rungs miss: scan `plugins/<unit>/skills/*/skill-scripts/<script>`
      and REFUSE on more than one match rather than taking directory order
      (SkillStore.containedSkillDirs' javadoc already names that ambiguity).
      Everything downstream flows through ResolvedScript, so SKILL_DIR would
      then point at the contained skill and no installer needs editing. Do NOT
      add declaring-skill provenance to CliDependency -- that is a signature
      change across nine types for information one backend consumes. Separately,
      make the error report EVERY probed candidate; this defect would have been
      self-diagnosing.
    blast_radius: >-
      Every plugin that declares a skill-script CLI dep on a contained skill.
      The install does not fail loudly -- it reports `N installed, M failed` and
      exits 0 -- so the plugin appears installed while its CLI is absent from
      PATH.
    disposition: still-true
    disposition_ticket: "SI-27 (#382)"
    disposition_note: >-
      STILL TRUE upstream. The SYMPTOM is gone here (SIS-W2-F-05, fixed by
      moving both deps to the plugin manifest), and skt's own two-rung
      resolvers landed (ticket.py:85-92 and :165-178), but the defect this row
      names is in skill-manager's Java `SkillScriptBackend.resolveScript` and
      is untouched: haydenrear/skill-manager PR #397 is OPEN, not merged, and
      none of its 20 commit headlines names resolveScript, CliDependency or
      unionCli -- they are SI-18 onboarding, graph nodes and CI. Checked
      before calling this row live, as instructed. measured 2026-09-23 on
      feature/382-complete-the-findings at base 2c21e609.

