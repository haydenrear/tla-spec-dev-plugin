  - id: SI-12-DF-06
    found_by: "SI-12"
    found_at_commit: "1baad7f8"
    schedule_revision: 3
    severity: minor
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      Re-installing a plugin over an existing install is a three-step dance with
      one flag trap in it, and the README migration sequence does not mention
      either half. (a) `skill-manager install file://<stage>` REFUSES when the
      unit is already present -- "halted: unit 'tla-spec-dev' is already
      installed ... remove it first" -- so re-installing a bundle after an edit
      is remove-then-install, never install-over. (b) `skill-manager remove`
      does NOT accept `--yes` (only `uninstall` does); passing it makes remove
      print its usage text and change nothing. Combined with a caller that pipes
      the command into `tail`, the shell's `$?` is then tail's status, so the
      whole no-op reports success. That is exactly what happened here and it
      cost a full measure-and-recheck cycle.
    reproduction: >-
      In a home already carrying the plugin: `skill-manager install
      "file://$STAGE" --yes` -> exits having halted. `skill-manager remove
      tla-spec-dev --yes` -> prints usage, removes nothing. `skill-manager
      uninstall tla-spec-dev --yes` -> works (--yes documented as an accepted
      no-op there, "so a caller that passes --yes to both halves of an
      install/uninstall pair does not hit a usage error" -- which is precisely
      the asymmetry `remove` does not honour).
    evidence:
      - "specs/results/epic-self-improvement-substrate/tickets/SI-12/plugin-install.txt"
      - "specs/results/epic-self-improvement-substrate/tickets/SI-12/step-uninstall.txt"
      - "specs/results/epic-self-improvement-substrate/tickets/SI-12/step-install.txt"
    why_out_of_scope: >-
      skill-manager is not this repository; the README sequence that omits the
      re-install case is in scope but the CLI behaviour it documents is not.
    suggested_fix: >-
      Accept `--yes` on `remove` as the same documented no-op `uninstall`
      already accepts -- the asymmetry has no upside and the usage-text failure
      is silent to any caller that does not check the exit code directly. And
      add the re-install case to README.md's migration section: remove (or
      uninstall) before re-installing a bundle you have edited.
    blast_radius: >-
      Anyone re-installing an edited bundle into a home that already has it,
      which is every ticket agent measuring its own change.
    disposition: still-true
    disposition_ticket: "SI-27 (#382)"
    disposition_note: >-
      STILL TRUE in the half that is a CLI defect. `skill-manager remove
      --help` prints `Usage: skill-manager remove [-hv] [--agent-context]
      [--dry-run] [--from=<unlink>...] <name>` -- there is no `--yes`, so
      passing it still makes `remove` print usage and change nothing, while
      `uninstall` accepts it as a documented no-op. The asymmetry is
      unchanged. The README half (document the re-install case) was not
      separately verified; the CLI half decides the row. Target:
      skill-manager. measured 2026-09-23 on feature/382-complete-the-findings
      at base 2c21e609.

