  - id: SI-27-DF-01
    found_by: "epic agent, rebuilding a worktree home; filed by SI-27"
    found_at_commit: "2c21e609"
    schedule_revision: 8
    severity: major
    target: git-issue-workflow
    surface:
      production: ["skills/git-issue-workflow/scripts/bootstrap-home.sh"]
      tla: []
      adapters: []
      test_graph: ["test_graph/sources/"]
      workflow: []
    summary: >-
      `bootstrap-home.sh` PRINTS `verified: N skill(s) servable` OVER A
      DIRECTORY OF DANGLING SYMLINKS. The epic agent nuked and rebuilt a
      worktree's Skill Manager home without clearing the agent projection
      directories beside it. Bootstrap then reported `projected: 10 of 10 into
      each of .claude .codex .gemini` and `verified: 10 skill(s) servable`,
      while those three directories held 24 UNUSABLE entries -- 8 skills x 3
      agent dirs, each a symlink to `<home>/skills/<unit>`, the standalone rung
      the rebuild removed. The 8 were exactly the plugin-contained skills, and
      one of them was `spec-double-compiler`, a name the plugin retired in
      favour of `spec-double-2`. `ls` lists a dangling symlink's name, so the
      directory LOOKED populated; every `open()` failed with ENOENT. The
      counter verifies what it just wrote and never looks at what is already
      there.
      IT IS A REPEAT, WHICH IS WHAT MAKES IT BLIND RATHER THAN CATCH.
      bootstrap-home.sh already carries a comment (around line 1500) recording
      that the same counter lied once before, differently: `verified: 20
      skill(s) servable` on a `wt new` worktree whose `.claude` had no
      `skills/` directory at all -- "Every agent launched in that worktree saw
      zero skills." That fix taught it the EMPTY case. It did not teach it the
      PRESENT-BUT-DANGLING case, so the green still cannot tell three states
      apart: projections present and usable, absent, or present and
      unresolvable.
    reproduction: >-
      Bootstrap a worktree home, then remove `<worktree>/.skill-manager`
      WITHOUT removing `.claude/skills`, `.codex/skills` and `.gemini/skills`,
      then bootstrap again. It prints `verified: N skill(s) servable`. Then, in
      each agent dir, test every entry with `[ -e "$p" ]` rather than `ls` --
      `ls` cannot tell you a symlink resolves. Observed 2026-09-23: 24 dangling
      links, 0 reported. `skt check` said `all current (11 change-managed
      units)` over the same state, so it is not a witness for this property
      either. Downstream effect: `sktHooks` went PASSED -> ERRORED,
      `skt.wrapper-installed` errored with ZERO assertions run, and the two
      nodes below it were skipped.
    evidence: []
    why_out_of_scope: >-
      `skills/git-issue-workflow/scripts/**` is not in SI-27's conflict keys
      (`specs/results/deferred_findings_final.yaml`,
      `specs/results/deferred/**`,
      `skills/spec-double-2/references/bug_attribution.md`), and
      git-issue-workflow is a contained skill with its own upstream repository.
      Filed, not fixed, per the ticket's own rule.
    suggested_fix: >-
      Two independent changes. (1) The counter stats the LINK TARGET, not the
      link: an entry that does not resolve is not servable and must not be
      counted, and the message should name how many entries were unresolvable
      rather than only how many were written. (2) Reconcile prunes dangling
      projection entries, so a home that changes layout does not leave the
      previous layout's links behind. A regression case is cheap: project a
      home, delete `<home>/skills/`, re-bootstrap, assert the verified count is
      not N.
    blast_radius: >-
      Every home whose layout changes -- which this epic made the normal case,
      because moving eight skills into a plugin moves their bytes from
      `<home>/skills/<unit>` to `<home>/plugins/<plugin>/skills/<unit>`. The
      contained skills still reach agents through `.claude/plugins/`, so
      nothing was lost when the 24 were removed; what was lost is the ability
      to believe the line. Two graph nodes errored before any assertion ran.
    skill_change: "proposed(git-issue-workflow, SI-27-DF-01: stat the link target in the servable counter, and prune dangling projection entries on reconcile)"
    disposition: still-true
    disposition_ticket: "SI-27 (#382)"
    disposition_note: >-
      Filed by SI-27 from the epic agent's measurement of 2026-09-23. The 24
