  - id: SI-27-DF-03
    found_by: SI-27
    found_at_commit: "2c21e609"
    schedule_revision: 8
    severity: major
    target: tla-spec-dev
    surface:
      production: []
      tla: []
      adapters: ["tests/test_eval_toolchain_pin.py"]
      test_graph: []
      workflow: ["specs/results/epic-self-improvement-substrate/review/wave-13-15/known-ten-baseline.txt"]
    summary: >-
      THE KNOWN-TEN BASELINE IS STALE AND THERE ARE ELEVEN. Every ticket in
      this epic is told to compare the suite by NAME against
      `specs/results/epic-self-improvement-substrate/review/wave-13-15/known-ten-baseline.txt`,
      which lists ten. On a PRE-EDIT run at the SI-27 base 2c21e609 the suite
      reports `11 failed, 1838 passed, 8 skipped`, and the extra name is
      `tests/test_eval_toolchain_pin.py::test_the_view_excludes_the_materialised_toolchain`.
      It is NOT a regression: the test asserts that `evals/run.sh` contains the
      literal `--exclude='./.toolchain'`, and d4b5e3ca ("evals: the view is a
      commit, and a score is a claim about one") replaced the whole tar-exclude
      mechanism with `git archive "$view_commit" | tar -xf -`. `git archive`
      enumerates TRACKED CONTENT, so the untracked `.toolchain` cache cannot
      enter the view at all -- the property the test guards is now true BY
      CONSTRUCTION and the test is asserting the implementation that used to
      make it true. A guard that outlived its mechanism, going red about a
      property that holds.
    reproduction: >-
      `uv run --with pytest --with pyyaml -m pytest tests -q` at 2c21e609 with
      a clean tree -> `11 failed`. `diff <(sort known-ten-baseline.txt) <(sort
      <the FAILED names>)` -> one extra line. Then
      `uv run --with pytest --with pyyaml -m pytest
      tests/test_eval_toolchain_pin.py::test_the_view_excludes_the_materialised_toolchain -q`
      -> "AssertionError: the staged view does not exclude the toolchain
      cache". Then `grep -n "exclude=" evals/run.sh` -> no matches at all, and
      `git log --oneline -S"--exclude='./.toolchain'" -- evals/run.sh` ->
      d4b5e3ca and 6f7c00da.
    evidence: []
    why_out_of_scope: >-
      Both `tests/**` and the baseline file are outside SI-27's three conflict
      keys. Repairing the test in this ticket would also move the baseline
      every other ticket in the wave compares against, in the same commit that
      claims "no new failures by name" -- which is the move SI-12-DF-03
      declined for the same reason.
    suggested_fix: >-
      Rewrite the assertion against the mechanism that now holds: assert that
      the view is built from `git archive <commit>` and that a `.toolchain`
      directory in the working tree does not appear in the built view --
      which is a property, not a string in a script. Then re-cut the baseline
      file, or state in it which failures are standing and why. Do NOT simply
      delete the test: the property is worth asserting and the current
      spelling is what has stopped asserting it.
    blast_radius: >-
      Every ticket in waves 13 onward. A baseline that is wrong by one name
      trains a reader to skim the comparison, which is the only instrument
      standing between a ticket and a silent regression -- and the eleventh
      name looks exactly like a ticket's own new failure.
    skill_change: "proposed(tla-spec-dev, SI-27-DF-03: assert the view-building property rather than the literal exclude flag, then re-cut known-ten-baseline.txt)"
    disposition: still-true
    disposition_ticket: "SI-27 (#382)"
    disposition_note: >-
      Measured by SI-27 on 2026-09-23 on a PRE-EDIT run of the base, before any
      file in this ticket was touched, so it is not this ticket's. Reported to
      the epic owner as the eleventh standing failure. SI-27's own post-edit
