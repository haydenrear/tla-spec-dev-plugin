      - "tests/test_analyze_architecture.py::TestAModelThatResistsClusteringSaysSo::test_the_repositorys_own_model_flipped_out_of_the_blob_case"
      - "specs/program_model/architecture_components.yaml (AC-03's 2-of-115,975 measurement)"
