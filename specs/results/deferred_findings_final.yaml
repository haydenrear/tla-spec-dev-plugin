  - id: SI-14-DF-01
    found_by: "SI-14"
    found_at_commit: "cc3941d4"
    schedule_revision: 4
    severity: major
    surface:
      production: ["evals/**/case.yaml"]
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      A `claude plugin eval` case that declares `plugins:` SILENTLY LOSES THE
      TARGET PLUGIN'S HOOKS, and scores 1.00 either way. Measured on 2.1.276
      over four runs ($0.26): two cases identical but for that one key, in a
      probe plugin whose SessionStart hook appended a line to a file. The
      `noplug` case fired the hook 2 of 2 runs; the `withplug` case fired it 0
      of 2. Both printed `Plugin under test` lines for the target AND the
      entry, so the target resolves -- its hooks simply do not run. This
      repository's eval suite places EVERY fixture from `evals/lib/place.sh`, a
      SessionStart hook, so a `plugins:` entry added to any case here would
      hand the agent an empty workspace and score it 0, reported as a skill
      failure. It is the reason SI-14 pins, materialises, stages and records
      the skt commit but does NOT load it through `plugins:`.
    reproduction: >-
      Build a plugin with `hooks/hooks.json` registering a SessionStart command
      that appends to a file outside the workspace, and two cases identical
      except that one declares `plugins: ["../../<a unit inside the root>"]`.
      Run `claude plugin eval . --ablation none --runs 2 --trust-plugin`. The
      marker file holds only the no-plugins case's lines.
    evidence:
      - "specs/results/epic-self-improvement-substrate/tickets/SI-14/probe-plugins-disable-hooks.txt"
    why_out_of_scope: >-
      The defect is in `claude plugin eval` itself, which is not a unit this
      epic can change. SI-14's slice is the pin; what it can do here is refuse
      to build on the broken mechanism and say why, which it does in
      evals/README.md, references/plugin_evals.md and a test that fails if a
      committed case ever gains the key.
    suggested_fix: >-
      Upstream: load the target plugin's hooks whether or not a case declares
      `plugins:`. Here: keep `tests/test_eval_toolchain_pin.py`'s sweep, and
      revisit wiring the pinned unit into a case once the CLI is fixed.
    blast_radius: >-
      Any suite that both places fixtures from a hook and wants a case to load
      more than one unit -- which is the shape references/plugin_evals.md §3.5
      recommends for evaluating several skills at once.
    skill_change: "applied(this PR: references/plugin_evals.md gains the corrected row and the measurement; evals/README.md gains 'What is not yet wired')"
    disposition: still-true
    disposition_ticket: "SI-27 (#382)"
    disposition_note: >-
      STILL TRUE upstream; guarded here. The defect is in `claude plugin eval`
      and no version of it is in this repository. What landed is the refusal:
      tests/test_eval_toolchain_pin.py:186-218
      `test_the_suite_does_not_wire_plugins_into_a_hooked_case` sweeps every
      committed case for `^\s*plugins:` and fails on a hit, with the
      measurement in its docstring, and evals/README.md:38-39,145-152 records
      the four-run probe (hook fired 2/2 without `plugins:`, 0/2 with it,
      score 1.00 both ways). Seeded as a BLIND row by SI-27. measured
      2026-09-23 on feature/382-complete-the-findings at base 2c21e609.

  - id: SI-14-DF-02
    target: skill-manager
    found_by: "SI-14"
    found_at_commit: "cc3941d4"
    schedule_revision: 4
    severity: minor
    surface:
      production: ["skill-project.toml"]
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      `skill-project.toml`'s `[plugins.<name>]` block accepts `source` and
      nothing else -- there is no `ref`, `rev` or `commit` key -- so `project
      resolve` always installs whatever the branch tip points at on the day it
      runs. This is the mechanism behind the fact SI-14 was filed for: the
      project home recorded `skt` at `gitRef main, gitHash 286a3694, installed
      2026-09-14`, and by 2026-09-19 `main` was `0f3807811e1d`. The manifest
      cannot express "this commit", so a repository cannot pin the toolchain it
      declares.
    reproduction: >-
      Read `references/projects.md` in the skt plugin: the documented form is
      `source = "github:haydenrear/<repo>"` alone. `git ls-remote
      https://github.com/haydenrear/skt main` on 2026-09-19 returns
      0f3807811e1dd8aca4ef34f502669849cb367fdd against the home's recorded
      286a3694a815c6f6a9e76bffcb03a1fd8100cce3.
    evidence:
      - "specs/results/epic-self-improvement-substrate/tickets/SI-14/toolchain-record.json"
    why_out_of_scope: >-
      The fix is a schema change in skill-manager's project manifest plus
      resolver support, which is that repository's work and not this ticket's
      conflict keys. SI-14 works around it for EVAL USE only, in
      evals/lib/toolchain.lock.toml, deliberately leaving the manifest to
      govern ordinary interactive installs.
    suggested_fix: >-
      Add an optional pinned ref to `[plugins.*]` and `[skills.*]` (`rev =
      "<sha>"`), have `project resolve` honour it, and have `skt status` report
      a home whose installed gitHash differs from the declared rev.
    blast_radius: >-
      Every repository that declares units and expects reproducible resolution;
      every eval or benchmark whose score is quoted across weeks.
    skill_change: "proposed(skill-manager: add `rev` to [plugins.*]/[skills.*] and honour it in project resolve; no diff written, the resolver is Java and outside this worktree)"
    disposition: still-true
    disposition_ticket: "SI-27 (#382)"
    disposition_note: >-
      STILL TRUE. `skill-project.toml`'s `[plugins.*]`/`[skills.*]` blocks
      still accept `source` and nothing else -- `grep -n 'rev'` over this
      repository's manifest and over
      skills/skill-manager/references/projects.md finds no `rev`, `ref` or
      `commit` key documented or used. A repository still cannot pin the
      toolchain it declares, and the eval-side workaround
      (evals/lib/toolchain.lock.toml) remains the only pin. Target:
      skill-manager; PR #397 has no commit touching the project manifest
      schema. measured 2026-09-23 on feature/382-complete-the-findings at base
      2c21e609.

