  - id: SI-02-DF-04
    target: skill-manager
    found_by: "SI-02"
    found_at_commit: "39e19a44"
    schedule_revision: 1
    severity: major
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      `skill-manager install file://<checkout>` stages the ENTIRE directory,
      including the checkout's own gitignored `.skill-manager/` home, and the
      staging directory it creates lives inside that same home. So the copy
      re-enters itself:
      `.skill-manager/cache/stage-N/staged/.skill-manager/cache/stage-N/staged/...`
      repeated until the path is unusable, and the install fails with
      "BuildResolveGraphFromSource: 1 coord(s) failed to resolve". Every
      per-checkout home this project creates (`wt new`, `skt ticket new`) puts a
      `.skill-manager/` inside the working tree, so installing a unit FROM the
      checkout that carries it is the normal case here, not an exotic one.
      Two things make it worse than a clear failure. The rollback reports
      "rolled back 0 effect(s)", which is true of the install and says nothing
      about the surrounding sequence; and the documented migration order is
      install-then-uninstall, so an operator who has already uninstalled -- or
      who retries in the other order -- is left with a home carrying NEITHER the
      plugin nor the standalone units. That state was reached during this ticket
      and had to be repaired by hand.
    reproduction: >-
      In a checkout with its own `.skill-manager/` home, run
      `<home>/bin/cli/skill-manager install "file://$PWD" --yes`. Observed exit
      non-zero with the recursive staged path. The remedy that works, and that
      README now documents, is to stage the tracked tree first:
      `STAGE=$(mktemp -d) && git archive HEAD | tar -x -C "$STAGE"` then
      `install "file://$STAGE"` -- which installed the plugin cleanly and is
      recorded in plugin-install.txt.
    evidence:
      - "specs/results/epic-self-improvement-substrate/tickets/SI-02/local-signal-GOAL-one-unit.txt"
      - "specs/results/epic-self-improvement-substrate/tickets/SI-02/plugin-install.txt"
    why_out_of_scope: >-
      The installer is skill-manager's, inside the skt plugin -- not a member of
      this bundle and not in SI-02's conflict keys.
    suggested_fix: >-
      Exclude the destination home from the staged copy (the stager already
      knows which home it is writing), or stage outside the home entirely.
      Failing that, refuse with a named cause when the source directory
      contains the destination home, instead of producing an unbounded path.
    blast_radius: >-
      Any install from a checkout that carries its own home -- the default shape
      of every ticket worktree in this repository. It does not corrupt the home
      on its own; the damage comes from the uninstall step of a migration
      sequence that assumed the install would succeed.
    disposition: still-true
    disposition_ticket: "SI-27 (#382)"
    disposition_note: >-
      NOT REPRODUCIBLE TODAY, and the row stays open only because the stager
      was never changed. Re-measured with a scratch home and the precondition
      the row requires -- this ticket's worktree carries its own
      `.skill-manager/` -- `SKILL_MANAGER_HOME=<scratch> skill-manager install
      "file:///Users/hayde/IdeaProjects/wt-382-complete-the-findings" --yes`
      produced NO recursive staged path (`find <scratch> -path
      '*cache/stage*staged/.skill-manager*'` returns nothing) and installed
      the plugin cleanly: plugins/tla-spec-dev with all eleven contained
      skills and eight CLI shims. It exited 11, but for EA-DF-01's reason
      (eval-fixture frontmatter), not this one. So the unbounded path is gone;
      whether the stager now excludes the destination home or the failure was
      always environment-dependent is not established here, and the row's ask
      -- refuse with a named cause rather than produce an unbounded path -- is
      unverified. Target: skill-manager. measured 2026-09-23 on
      feature/382-complete-the-findings at base 2c21e609.

