  - id: EA-DF-15
    severity: major
    found_by: epic agent, triaging the thirteen decidable cases below 1.00
    found_at_commit: 3fe0888f
    schedule_revision: 9
    surface:
      production:
      - evals/run.sh
      - every skills/*/scripts/*.py carrying a `# /// script` header
      tla: []
      adapters: []
      test_graph: []
      workflow: []
    summary: 'NO `uv run --script` SKILL SCRIPT CAN START IN A SANDBOXED RUN. Those scripts resolve
      their dependencies at invocation time, uv looks for its cache under the CURRENT home, a
      sandboxed run''s home is empty, and the sandbox has no network -- so uv reaches for pypi.org
      and is denied. The operator''s 21G cache at ~/.cache/uv is never consulted. Every case whose
      subject is one of those scripts therefore grades an agent that could not run the tool the
      case is about, and the run does not fail: a plausible number comes out.'
    reproduction: 'From a run''s own transcript, verbatim: "uv run --script .../validate_epic_plan.py
      --help" then "error: Failed to fetch: https://pypi.org/simple/pyyaml/" and "<sandbox_violations>
      deny network-outbound pypi.org:443 (user denied)". The agent then said so plainly -- "I
      couldn''t validate the plan: the validator never ran, so it printed no findings. What follows
      is my own reading of the plan, not a validator result" -- reasoned its way to a correct
      reading by hand, and scored 0.75.'
    why_out_of_scope: 'Not out of scope; fixed in the same commit. The eval half only: whether
      a skill script should degrade when its interpreter cannot resolve deps is a product question
      and is not touched here.'
    suggested_fix: Done. run.sh exports UV_CACHE_DIR to .toolchain/uv-cache -- beside the pinned
      checkout and the jbang cache, gitignored, 1.8M -- and PRIMES it operator-side before the
      sandbox starts, by running the validator's --help once. Verified to resolve with UV_OFFLINE=1,
      which is what "no network" looks like from inside the sandbox. Warns and carries on if priming
      fails.
    blast_radius: 81 files in skills/ carry a `# /// script` header and 10 cases name a validator
      or a script directly, so this is not one case. It is the THIRD instance of one shape in
      a single session -- skill-manager could not start for want of a JDK (EA-DF-12), the orientation
      hook could not start for want of a python (EA-DF-14), and now every uv script for want of
      a warm cache. In all three the tool was absent, the run scored anyway, and the number looked
      like a statement about the agent.
    evidence:
    - 'transcript: deny network-outbound pypi.org:443, validator never started'
    - 'primed cache resolves offline: UV_OFFLINE=1 uv run --script validate_epic_plan.py --help
      -> rc=0'
    - 1.8M cache vs the operator's 21G ~/.cache/uv, which a sandbox cannot see
    - w-epic-retire-part-of-goal-warns-only scored 0.75 with judge FAIL FAIL FAIL on a case it
      could not perform
    skill_change: applied(run.sh primes and exports an isolated UV_CACHE_DIR)
    attribution: UNMODELED/eval-harness
    disposition: fixed
    fixed_by: uv cache priming, 2026-09-24
    disposition_ticket: EPIC-AGENT
    disposition_note: 'THE PATTERN IS NOW NAMED, because three instances in one day is a class
      and not a coincidence: a sandboxed run inherits an empty HOME, every toolchain that caches
      under HOME is therefore cold, and every one of them fails by reaching for a network that
      is not there. jbang, uv and skt''s python all did it. Anything else that caches under HOME
      will do it too, silently, and the only symptom will be a score. The general remedy is the
      one applied three times here: name the cache explicitly, keep it in .toolchain, prime it
      operator-side.'
