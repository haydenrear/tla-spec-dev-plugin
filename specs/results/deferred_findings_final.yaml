      bootstrapped-home condition and is not reproducible standalone. The
      `constituent repo` in the printed branch key is the lead worth pulling:
      the fixture sits under an integration.toml, so checkout_kind classifies it
      as a constituent and the worktree location is resolved against an ancestor
      rather than the fixture.
    blast_radius: >-
      If `ticket new` can report success while creating nothing, every workflow
      that trusts its exit code is building on a claim rather than a worktree --
      and this epic already has a rule about that shape, because an environment
      that could not do the task and a tool that could not do the task produce
