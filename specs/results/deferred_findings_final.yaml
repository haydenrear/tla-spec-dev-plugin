    summary: >-
      The Test Graph executor's process-ownership contract ("node launcher
      exited with live descendants") and the Kotlin Gradle plugin's default
      `daemon` compile strategy are mutually incompatible for ANY node that
      runs a nested Gradle build which compiles Kotlin. The default forks
      `KotlinCompileDaemon --daemon-autoshutdownIdleSeconds=7200`, a shared
      user-scoped service designed to outlive its build, as a descendant of
      the node launcher; the contract then correctly reports it as leaked and
      reaps it -- reaching a daemon shared with the outer build. RP-07 fixed
      the one node in THIS repository that hits it
