    summary: >-
      EVERY divergence on any project is erasable with NO declaration edit, NO
      map edit, NO blind spot and NO basis limit, by re-exporting the offending
      symbol through a first-party package nested more than one directory below
      the code root's parent. architecture_reflexion.py decides whether an
      unresolved import is third-party or first-party-outside---code by testing
      exactly ONE path -- `sibling = code_root.parent / name` -- so a project
      whose shared or generated package lives at `generated/pkg`, `src/pkg`,
      `gen/pkg` or `vendor/pkg` has that package silently filed under "standard
      library and third-party packages", and every edge routed through it leaves
      the graph with nothing recorded. Two consequences, both measured. (1) The
      verdict turns on DIRECTORY DEPTH ALONE: moving
      examples/validation/ex4_pipeline_coherent/generated/pipeline_contract up
      one level, changing zero bytes of Python, flips the verdict from
      `coherent` to `unmappable` with a first_party_outside_code_root blind
      spot -- so this epic's only positive architecture result (AC-P1's answer
      key) is conditional on how deep the fixture nests its generated package.
      (2) On ex5_pipeline_divergent, a 24-line lazy re-export module dropped
      into generated/pipeline_contract/, three one-line import rewrites and one
      decorative function-local import turn `divergent` (4 divergences, 1
      absence) into `coherent`, 0 divergences, 0 absences, `blind_spots: []`,
      `basis_limits: []`, `clean_result_supportable: true`, exit 0 -- with BOTH
      digests byte-identical to the honest answer key, all 8 behavioural tests
      green, and the runtime coupling fully intact
      (`pipeline.ingest.inbox.format_entry is pipeline.ledger.journal.
      format_entry` -> True). This is a false clean of exactly the DP-1 class
      the epic's scoring rule exists to catch, and the DP-1 rule CANNOT SEE IT
      because no declared artifact moved. It is strictly worse than the
      map-placement gaming the documentation already owns: that requires
      editing a declared artifact a reviewer reads, whereas a re-export shim is
      ordinary Python in a directory labelled "generated, do not hand-edit" and
      reads as an indirection improvement. It also survives RP-01 untouched:
      the partition still decomposes, the pair is still unported,
      divergence_detectable is still true, and the report is telling the truth
      about its basis and a falsehood about the code.
    reproduction: >-
      (1) cp -R examples/validation/ex4_pipeline_coherent /tmp/ex4copy && cd
      /tmp/ex4copy && python3 <repo>/scripts/architecture_reflexion.py
      specs/program_model/Pipeline.tla specs/program_model/Pipeline.cfg
      --components specs/program_model/architecture_components.yaml --code
      pipeline --map specs/program_model/architecture_map.yaml -> coherent,
