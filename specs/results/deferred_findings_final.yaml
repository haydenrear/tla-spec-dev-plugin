  - id: SI-27-DF-04
    found_by: SI-27
    found_at_commit: "2c21e609"
    schedule_revision: 8
    severity: minor
    target: skt
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: []
      workflow: ["skills/skt/src/skt/publish.py"]
    summary: >-
      `skt publish --check` SAYS `edited` FOR A STATE IT HAS NOT ESTABLISHED,
      and the close gate that reads it disagrees with the gate beside it.
      Measured in SI-27's worktree home: `skt publish --check` prints
      `edited: tla-spec-dev (unknown)` and exits 10, while the same home's
      plugin checkout is CLEAN (`git status --porcelain` -> empty) and 0
      commits ahead of `@{upstream}` (127 behind, because that clone has not
      fetched). In the same minute, `close-change.sh --dry-run` ran
      `skill-manager home close-out` over the same home and reported
      `gate: clean -- holds nothing that removing it would destroy`, verdict
      CLEAN.
      THE FAIL-SAFE IS RIGHT AND THE WORD IS WRONG. `edited_units`' own
      docstring states the policy deliberately: "at a gate whose job is to
      refuse while unpublished work exists, an evidence gap must never read as
      'nothing here'", so `unknown` is reported rather than dropped. That is
      the correct default. What it should not do is render the evidence gap
      under the heading `edited:` -- the first word of the line is a claim
      about the unit, the parenthesis is the retraction, and a reader who
      stops at the first word concludes there is unpublished skill work to
      save when there is none.
    reproduction: >-
      In a ticket worktree home whose plugin store is a git checkout that has
      not fetched: `skt publish --check; echo $?` -> `edited: tla-spec-dev
      (unknown)`, 10. Then `git -C <home>/plugins/tla-spec-dev status
      --porcelain` -> empty, and `git -C <home>/plugins/tla-spec-dev rev-list
      --count --left-right '@{upstream}...HEAD'` -> `0  127`. Then
      `bash <giw>/scripts/close-change.sh "$PWD" --dry-run` -> `gate: clean`,
      `CLEAN`.
    evidence:
      - "specs/results/epic-self-improvement-substrate/tickets/SI-27/home-closeout-verdict.txt"
    why_out_of_scope: >-
      `skills/skt/**` is not in SI-27's conflict keys, and skt is a contained
      skill whose source in this worktree is a copy of the plugin's -- an edit
      here would be an edit to a unit with its own upstream.
    suggested_fix: >-
      Print an evidence gap as one: `unresolved: <unit> (could not determine
      whether it carries unpublished work)`, kept in the exit-10 population so
      the fail-safe is unchanged, and say WHY -- no upstream, probe timed out,
      or budget exhausted -- because the three have different remedies. And
      have `skt ticket close` name which of the two gates refused when they
      disagree, since `skill-manager home close-out` called the same home clean.
    blast_radius: >-
      Every ticket worktree in this epic, because every one of them has a
      plugin store checkout that does not fetch. An agent at close-out either
      hunts for a skill edit that does not exist, or -- worse, and this is the
      shape the epic keeps paying for -- learns to read `edited:` as noise and
      stops looking on the run where it is real.
    skill_change: "proposed(skt, SI-27-DF-04: render an undetermined state as `unresolved` with its cause, not as `edited`)"
    disposition: still-true
    disposition_ticket: "SI-27 (#382)"
    disposition_note: >-
      Filed and measured by SI-27 on 2026-09-23 as a blocker met at its own
      close-out. Not fixed: skills/skt/** is outside SI-27's conflict keys.
      Also carried as a row in the PR's `## Skill changes proposed` table.

  - id: SI-27-DF-05
    owner_note: >-
      REPOINTED AND VERIFIED 2026-09-23 by the epic agent, and this is a
      RECURRENCE, not a first sighting. SI-04-DF-04 recorded the same defect
      with `origin` aimed at `wt-351-plugin-plumbing`; SI-27-DF-05 caught it
      aimed at `wt-382-complete-the-findings`. Two tickets, two different
      sibling worktrees, same shape.
      FIX APPLIED: `remote.origin.url` set to git@github.com:haydenrear/tla-spec-dev.git
      and the `pushurl` REMOVED rather than left beside it -- the split is what
      made the failure silent, because push kept working while fetch read a
      local mirror. One value means a future rewrite breaks loudly instead.
      VERIFIED, not assumed: after the change `git fetch origin` reports
      origin/epic/self-improvement-substrate at 1efa0b4b, which equals
      `git ls-remote` against GitHub. The same fetch also advanced THREE other
      epic branches that had been stale in the local mirror, which is the
      clearest evidence of what the rewrite had been costing.
      STILL UNRESOLVED: what writes it. A sweep of the shipped scripts found no
      `remote set-url` or `remote add origin` aimed at the parent -- only test
      fixtures and constituent handling. Until the writer is named this will
      recur, and `epic-ticket.md` §1's
      `git merge-base --is-ancestor <base_sha> origin/epic/<slug>` is the
      command it makes lie.
    found_by: SI-27
    found_at_commit: "08c943c1"
    schedule_revision: 8
    severity: major
    target: tla-spec-dev
    surface:
      production: []
      tla: []
      adapters: []
      test_graph: ["test_graph/sources/skt_ticket_roundtrip.py"]
      workflow: [".git/config (shared by the common dir; not a tracked file)"]
    summary: >-
      THE CLONE'S SHARED `remote.origin.url` WAS REPOINTED AT A TICKET
      WORKTREE WHILE THAT TICKET WAS RUNNING, AND FETCH AND PUSH NOW DISAGREE
      ABOUT WHAT `origin` IS. Measured 2026-09-23: at 11:00 `git config --get
      remote.origin.url` returned `git@github.com:haydenrear/tla-spec-dev.git`;
      `.git/config` was rewritten at 12:01 by something else running in this
      clone; at 12:04 the same repository answered `url =
      /Users/hayde/IdeaProjects/wt-382-complete-the-findings` -- SI-27's own
      worktree -- with `pushurl = git@github.com:haydenrear/tla-spec-dev.git`
      beside it. The file is the COMMON dir's, so it is every worktree's:
      wt-epic-self-improvement-substrate and wt-366-wt-into-skt both report the
      local path.
      THE SPLIT IS THE DANGEROUS PART, because it defeats the check an agent
      would run. `git push` uses `pushurl` and genuinely reaches GitHub, so
      push verification SUCCEEDS -- SI-27's branch is on GitHub and `gh api`
      confirms it. `git fetch` uses `url` and reads the local path, so
      `origin/<anything>` is a mirror of ONE ticket worktree's refs. SI-27
      concluded from `git fetch origin` that the epic branch had been pushed
      and that its own `base_sha` was an ancestor of
      `origin/epic/self-improvement-substrate`, wrote that in a PR body, and
      was reading its own worktree's ref back to itself. Ground truth:
      `git ls-remote https://github.com/haydenrear/tla-spec-dev.git
      refs/heads/epic/self-improvement-substrate` -> `1efa0b4b`, while the local
      epic worktree is at `2d8e8d84`. Five epic commits are unpushed.
      IT ALSO DEFEATS THE PROBE SI-04-DF-04 TAUGHT. That row says to check
      `git config --get remote.origin.url`. That command returns the FIRST
      `url` value and says nothing about `pushurl`, and it is what SI-27 ran at
      11:00. The probes that answer are `git remote get-url origin` and
      `git remote get-url --push origin`, which are two different questions
      with two different answers here.
    reproduction: >-
      `git remote get-url origin` -> a path under /Users/hayde/IdeaProjects/;
      `git remote get-url --push origin` -> the GitHub SSH URL;
      `git config --show-origin --get-all remote.origin.url` names
      `/Users/hayde/IdeaProjects/tla-spec-dev/.git/config`, the COMMON dir's
      file. Then compare `git ls-remote origin <ref>` (local) against
      `git ls-remote https://github.com/haydenrear/tla-spec-dev.git <ref>`
      (GitHub): they disagree. `stat` the config for the rewrite time.
    evidence:
      - "specs/results/epic-self-improvement-substrate/tickets/SI-27/remote-origin-is-local-again.txt"
    why_out_of_scope: >-
      `.git/config` is not a tracked file, so no PR can repair it, and it is
      SHARED by the common dir across the main checkout and every live sibling
      worktree -- repointing it while other ticket agents are running would
      silently change their fetch base and their push target mid-flight. That
      is SI-04-DF-04's own stated reason for not touching it and it still
      holds.
    suggested_fix: >-
      Three separable things. (1) The epic owner repoints `origin` ONCE,
      between waves, with no ticket in flight -- never while agents are live.
      (2) Find what wrote it: a local-path `origin` pointing at a ticket
      worktree is the shape a worktree- or clone-creating script produces, and
      `test_graph/sources/skt_ticket_roundtrip.py` clones and sets remotes in
      this clone (SI-25-DF-06 already has it resolving the wrong rung). Until
      the writer is named this will recur. (3) Teach the check: a tool that
      confirms a push, or resolves an epic base, must read `git remote get-url
      origin` AND `--push`, refuse when they differ, and refuse outright when
      either resolves to a local path -- which is the pairing SI-04-DF-04 asked
      for and SI-27 demonstrated is still missing.
    blast_radius: >-
      Every worktree of this clone, and every epic-mode ancestry check in
      `epic-ticket.md` section 1 -- `git merge-base --is-ancestor <base_sha>
      origin/epic/<slug>` is precisely the command this makes lie. It cannot
      lose a commit, because push still reaches GitHub; what it loses is the
      agent's ability to know what is on the remote, and it loses it in the one
      direction that reads as good news.
    skill_change: "proposed(git-issue-workflow, SI-27-DF-05: epic-ticket.md section 1 pairs `git remote get-url origin` with `--push` before any ancestry check, and refuses when either resolves to a local path)"
    disposition: still-true
    disposition_ticket: "SI-27 (#382)"
    disposition_note: >-
      Filed and measured by SI-27 on 2026-09-23, after it had already published
      the wrong conclusion in a PR body and had to retract it. Not repaired:
      `.git/config` is untracked and shared with live sibling worktrees.
