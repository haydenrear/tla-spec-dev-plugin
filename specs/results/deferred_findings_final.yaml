      - "log 'ticket new contract: {worktree: /Users/hayde/IdeaProjects/subject-repo-TG-1, branch: feature/TG-1 (constituent repo subject-repo), ...}' with 'worktree exists: False'"
      - "by-hand control, standalone repo, TRUE exit code 3 (captured without a pipe): 'no Skill Manager home could be created for this worktree'"
    skill_change: "none"
    disposition: not-a-defect
    disposition_ticket: "SI-20"
    disposition_note: >-
