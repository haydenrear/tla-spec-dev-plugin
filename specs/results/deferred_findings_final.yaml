  - id: SI-11-DF-04
    found_by: "SI-11"
    found_at_commit: "994f650c"
    schedule_revision: 1
    severity: major
    surface:
      production: ["skt: ticket CLI entry point", "git_issue_workflow/wt.py"]
      tla: []
      adapters: []
      test_graph: []
    summary: >-
      The unfixed half of SI-06-DF-02. `skt ticket new` printed
      bootstrap-home.sh's refusal, rolled the worktree back, and the caller saw
      success. new-change.sh is NOT the culprit -- it ends the failure path with
      an explicit `exit 3` -- and wt propagates it (`exit "$RC"`). The remaining
      suspect is the Python surface: wt.py's `main()` ends `proc =
      subprocess.run([...]); return proc.returncode`, so any entry point that
      calls main() without wrapping it in sys.exit() converts every non-zero
      wt exit into 0.
    reproduction: >-
      Observed directly on 2026-09-18: `skt ticket new 351-plugin-plumbing
      --base <sha> --path ../wt-351-plugin-plumbing` printed "error: this home
      holds 15 skill(s) and an agent launched here can reach 12", left no
      worktree, and the invocation was treated as successful. Confirm with
      `skt ticket new <t> ...; echo $?` against a project home with an
      unprojected unit.
    evidence: []
    why_out_of_scope: >-
      The entry point is in the `skt` PLUGIN, a different unit from this
      repository, and is not in SI-11's conflict keys. The epic agent offered
      SI-06-DF-02 and SI-06-DF-03 together and said to take the exclude guard
      if only one; SI-11 took the exclude guard, which destroys evidence rather
      than costing time.
    suggested_fix: >-
      `sys.exit(main())` at the console-script entry, and a test asserting a
      non-zero exit for a bootstrap refusal. A wrapper that rolls back and
      reports success is worse than one that fails loudly.
    blast_radius: >-
      Every agent that provisions a worktree through `skt ticket new` in a home
      whose projection is incomplete -- which this epic made common, since the
      three unprojected units are exactly the ones it moved into the plugin. The
      agent proceeds believing it has a worktree.
    disposition: fixed
    disposition_ticket: "SI-27 (#382)"
    fixed_by: "skt entry point propagates the wrapper's exit (measured 128)"
    disposition_note: >-
      FIXED. Measured directly rather than through a pipe, because `$?` after
      a pipe is the pipe's last command: `skt ticket new
      zzz-nonexistent-ticket --base 000...0` printed `error: fatal: invalid
      reference: ...` and exited 128, and `skt ticket new
      382-complete-the-findings --base 2c21e609 --path ...` created this
      worktree and exited 0. A rollback no longer reports success. Pairs with
      SI-15-DF-04, which is the same defect filed by a second agent. measured
      2026-09-23 on feature/382-complete-the-findings at base 2c21e609.

