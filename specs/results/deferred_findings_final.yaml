  - id: EA-DF-14
    severity: major
    found_by: epic agent, after staging the hook and finding it emitted zero bytes
    found_at_commit: e2a89e81
    schedule_revision: 9
    surface:
      production:
      - hooks/skt-session-start.sh (pick_python, resolve_skt)
      tla: []
      adapters: []
      test_graph: []
      workflow: []
    summary: 'THE ORIENTATION HOOK SILENTLY PRODUCES NOTHING ON A STOCK macOS PATH, AND THIS IS
      A PRODUCT DEFECT, NOT AN EVAL ONE. `pick_python` requires an interpreter of at least 3.11;
      macOS ships 3.9.6 at /usr/bin/python3, which the gate rejects. `resolve_skt` then fails
      at every rung, the hook logs "skt-unresolvable" and exits 0 with no output. The contract
      that produced this is a good one -- "a broken orientation hook must not break the session
      it orients" -- but the failure is invisible in the session itself: a user on a machine whose
      PATH carries only the system python gets no orientation, no `next skt check`, and no indication
      that any was attempted.'
    reproduction: '`env -u SKILL_MANAGER_HOME CLAUDE_PLUGIN_ROOT=<view> PATH=/usr/bin:/bin bash
      hooks/skt-session-start.sh` prints nothing, exit 0. The same command with /opt/homebrew/bin
      prepended prints the full report ending `next skt check` plus two notifications. In the
      eval trace both SessionStart hooks fired: place.sh returned 1098 bytes, skt''s returned
      0.'
    why_out_of_scope: 'The EVAL side is fixed here (run.sh exports SKT_PYTHON, which pick_python
      honours ahead of its PATH scan). The PRODUCT side is not, and is left deliberately: changing
      what the hook does when it cannot resolve an interpreter is a change to shipped behaviour
      and belongs in a ticket.'
    suggested_fix: 'Keep exit 0 -- the contract is right -- but stop being silent. One line to
      stdout naming what was missing ("skt: no python >= 3.11 on PATH; run `skt status` manually
      or set SKT_PYTHON") costs nothing, cannot refuse anything, and turns an invisible no-op
      into a fixable message. Consider also whether the 3.11 floor is real for `status` alone;
      if the floor exists for the ticket verbs rather than the report, orientation could degrade
      to a shorter report instead of none.'
    blast_radius: 'Every session on a machine without a modern python early on PATH -- which is
      the default macOS shell -- silently loses the substrate''s single discoverability mechanism.
      This epic''s whole progressive-disclosure goal runs through that hook. Measured cost in
