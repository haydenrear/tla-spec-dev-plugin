      lists `lastCommand` and `result` as single-writer violations ACROSS THE
      SAME BOUNDARY on the next page -- the two god-variables whose presence was
      the entire reason the model was a blob. And Q = 0.0116 is 26x below the
      Newman threshold of 0.3 that the tool itself prints and deliberately does
      not apply; the `modularity_q` criterion is `Q > 0`, which 0.0116 clears
      exactly as 0.0 did not.

      This is a measurement of the SCANNER, not of the repository. AC-03
      independently measured 2 of 115,975 partitions of this model meeting all
      three criteria at Q = 0.0029, so a verdict a single variable can invert is
      consistent with what AC-03 already recorded -- but AC-03 recorded it as a
      property of the partition search, and this is the shipped default path a
      user gets with no `--components` file at all.
    reproduction: >-
      At d3eb851 (before RC-01):
      `python3 scripts/tla_spec_dev.py --spec-root specs analyze architecture
      specs/current/TlaSpecDevCli.tla specs/current/MC.cfg`
      -> "MEASURED RESULT: does not decompose", one component, Q = 0.
