    manifests carry only `created_at_utc`, which is the close time. PRs are opened after the work. The
    median PR open-to-merge time is 0.02-0.14 h. So implementation active time is unknown everywhere,
    and GOAL-ESD-VELOCITY's "cost component share" cannot be reconstructed retrospectively for implementation.
  reproduction: 'Read any specs/.history/*/*/manifest.json in this repo or in commit-diff-context-parent,
    meta-harness, polymarket, effectful-learning or skill-manager. Each has `created_at_utc` and no opened/dispatched/started
    field. Batched closes make close-to-close spacing meaningless: attribute-the-catch closed 5 tickets
    in 48 s.'
