    workflow:
    - 'specs/.history/*/*/manifest.json (writer: spec-double-2 close path)'
  summary: No record in any of the six audited repositories timestamps the START of ticket work. Close-history
    manifests carry only `created_at_utc`, which is the close time. PRs are opened after the work. The
    median PR open-to-merge time is 0.02-0.14 h. So implementation active time is unknown everywhere,
    and GOAL-ESD-VELOCITY's "cost component share" cannot be reconstructed retrospectively for implementation.
  reproduction: 'Read any specs/.history/*/*/manifest.json in this repo or in commit-diff-context-parent,
    meta-harness, polymarket, effectful-learning or skill-manager. Each has `created_at_utc` and no opened/dispatched/started
    field. Batched closes make close-to-close spacing meaningless: attribute-the-catch closed 5 tickets
    in 48 s.'
  evidence:
  - specs/results/evidence-sized-delivery/ESD-01/cost.md (sections 0 and 4)
  why_out_of_scope: ESD-01 is evidence-only. Its conflict keys cover only its evidence root, and the user
    mandate forbids new machinery.
  suggested_fix: 'For ESD-06 / the owner: record a start time per ticket in prose where the work already
    writes. The assignment''s dispatch comment and the PR body are two such places. Or read agent session
    transcripts for the ESD-06 pilot. Either supplies the missing denominator without a new tool.'
  blast_radius: Measurement only; no behaviour change.
  disposition: pending
  disposition_ticket: null
