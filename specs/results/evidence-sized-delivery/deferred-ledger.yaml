  summary: The node behind ESD-01 rows RP-07-DF-01 and BS-07-DF-05 is an `assertion` that copies a Test
    Graph project and runs a nested Gradle build. It declares only `fs:tmp`, although the registered `process:gradle`
    exists for exactly this. It depends on spec.workflow.close but reads only spec.workflow.repo's sourceRepo.
    It is tagged `finalizer`, so it runs after an upstream failure. Its fixed 180 s timeout bounds a cold
    build-logic compile plus a 20 s drain. In specWorkflow it is listed before spec.reference.adapters_resolve,
    which was skipped behind it in bug-sweep milestone 1.
  reproduction: Read the NodeSpec in test_graph/sources/spec_workflow_failure_cleanup_probe.py and the
    specWorkflow block in test_graph/build.gradle.kts.
  evidence:
  - specs/results/evidence-sized-delivery/ESD-01/inventory.yaml (rows RP-07-DF-01, BS-07-DF-05)
  - skills/test-graph/references/graph-architecture-review.md (rules A1, A3, A4, D2; worked review)
  why_out_of_scope: Node source and graph definition are outside ESD-03's conflict keys; instruction-only
    ticket.
  suggested_fix: Split the project copy into a fixture node. Declare process:gradle. Depend on spec.workflow.repo
    only. Size the timeout from a recorded cold run. Place adapters_resolve so that it does not share
    fate with the probe. Show the probe red on a planted residue before trusting it again.
  skill_change: none
  blast_radius: specWorkflow only; changes node metadata and order, not node ids.
  disposition: pending
  disposition_ticket: null
