  summary: 'skt.wrapper-installed has timeout 900s. Per pinned interpreter, its resolve_interpreter may
    run `uv python find` (120 s), `uv python install` (900 s) and `uv python find` (120 s) again. On a
    cold host, nested work alone can exceed the node budget, so the executor kills the node with cause
    timeout. That is a cold-cache false red of the SM #295 shape (ESD-01 family F6). The graph is opt-in
    (run-graphs.py OPT_IN), which limits exposure.'
  reproduction: Compare SPEC.timeout in skt_wrapper_installed.py with the subprocess timeouts in support/skt_fixture.py
    resolve_interpreter.
  evidence:
  - skills/test-graph/references/graph-architecture-review.md (rules C1, D2)
  why_out_of_scope: Node source outside ESD-03's conflict keys.
  suggested_fix: Provision the interpreter matrix in its own testbed with a budget above its nested bounds,
    or lower the nested bounds below the node budget.
  skill_change: none
  blast_radius: sktSurface, sktHooks (opt-in).
  disposition: pending
  disposition_ticket: null
