- found_by: ESD-03
  id: ESD-03-DF-01
  found_at_commit: 3e57ea9e
  schedule_revision: 1
  severity: major
  blocking: false
  channel: independent-review
  area: 'test_graph node spec.workflow.cleanup: delete path from an absent context value'
  surface:
    production: []
    tla: []
    adapters: []
    test_graph:
    - test_graph/sources/spec_workflow_cleanup.py
    workflow: []
  summary: 'spec.workflow.cleanup deletes `Path(ctx.get("spec.workflow.repo", "repoPath") or "")`. With
    no published repoPath, that path is `Path("")` == `.`. A uv node''s working directory is the test_graph
    project directory (UvExecutor sets `.directory(invocation.projectDir)`), so `shutil.rmtree(".")` deletes
    test_graph/ itself. The node is a finalizer: it runs after an upstream failure once spec.workflow.repo
    has executed, even if that node errored without publishing. Under --continue-after-failure it runs
    unconditionally. This is the shape of the recorded incident "a failing graph node deleted 27 tracked
    files of test_graph/ itself" (specs/results/epic-self-improvement-substrate/review/wave-3/review.md,
    item 3). The fix recorded there changed the install path (tla_spec_dev_cli_install.py comment). The
    delete guard is still absent at 3e57ea9e. Not reproduced here: reproducing it would delete the checkout''s
    test_graph/.'
  reproduction: Read test_graph/sources/spec_workflow_cleanup.py main(); python3 -c 'from pathlib import
    Path; print(Path("") == Path("."))' prints True.
  evidence:
  - test_graph/sources/spec_workflow_cleanup.py
  - skills/test-graph/project_sdk_sources/build-logic/src/main/kotlin/com/hayden/testgraphsdk/exec/PlanExecutor.kt
    (shouldRunAfterFailure)
  - skills/test-graph/references/graph-architecture-review.md (rule E2, worked review)
  why_out_of_scope: test_graph/sources/ is not in ESD-03's conflict keys, and the assignment forbids code
    changes in this instruction-only ticket.
  suggested_fix: Delete only when repoPath is non-empty and resolves under ctx.report_dir. Assert that
    as a named assertion, so a refusal is a red with the path, not silent residue. Keep rerun(False).
  skill_change: none
  blast_radius: 'Destructive: the project''s own validation sources; every graph that composes the cleanup
    node (specWorkflow, the probe''s nested graph).'
  disposition: closed
  disposition_ticket: null
  disposition_note: "carried out of the epic as https://github.com/haydenrear/tla-spec-dev-plugin/issues/261 (epic finalization)"
  filed_as: https://github.com/haydenrear/tla-spec-dev-plugin/issues/261
