# Scope, sampling frame and revisions: README.md beside this file. SAMPLE, not census.
# This is a hand-written evidence document. It is not a schema; nothing reads it mechanically.
#
# Field meanings (prose, not a schema):
#   origin            where the defect actually lived (component), written from the primary record
#   anchor            TLA+ action when the record names one, else UNMODELED/<bin> (bug_attribution.md 7a/7c)
#   channel           what DETECTED it (bug_attribution.md 4.1 tokens, plus `eval`, `ci`,
#                     `manual-final-testing`). A channel of test-graph says nothing about the origin.
#   class             product bug | graph orchestration/node/fixture defect |
#                     package/provider/environment fault | invalid assertion | false green |
#                     false red | unresolved   (the seven classes named by #235)
#   consequence       optional: the signal effect (false red / false green / skipped coverage) when
#                     the class names the origin. local-signal.md explains why both are needed.
#   cause_confidence  confirmed = the record shows root cause + fix/controlled reproduction;
#                     inferred = attribution argued but not demonstrated
#   evidence          paths are relative to the row's repo; line ranges at the revisions in README.md
#   disposition       state at the audited revision (2026-11-10), not at filing time
#
# Rows 1-45 were read from primary records by the ESD-01 author. Rows 46-117 (consumer repos)
# were extracted by two delegated read-only readers and spot-checked (README.md "Method").
