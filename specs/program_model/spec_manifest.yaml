# MF-013: EFFECT DECLARATION SCHEMA.
#
# Components declare typed emissions on named ports; each action names the
# ports it may emit on. `tla-spec-dev run effect-conformance`, and every
# `run spec-unit-tests` batch, executes adapters in a sandbox that records what
# actually crossed a boundary and diffs it against these declarations.
#
# Two findings, both HARD FAILURES:
#   - an observed effect matching no port declared for its action is a GAP;
#   - a declared port no case ever exercises is DEAD MODEL SURFACE.
#
# NOTHING SUPPRESSES A GAP REPORT. There is deliberately no justification,
# waiver, or allow-list key in this schema. Out-of-contract justifications were
# WITHDRAWN on 2026-07-18 (references/architecture_tractability.md, "No
# Degenerate Escapes", rules 3 and 4). Adding such a key here does not work:
# skills/spec-double-2/scripts/effect_conformance.py scans for suppression-shaped keys and reports
# them as IGNORED rather than honoring them, and
# tests/test_effect_conformance.py asserts the verdict is identical with and
# without one. Declare the port, or change the program so it stops emitting the
# effect. There is no third option.
#
# `type` must be one of the sandbox-observable types (filesystem.write,
# filesystem.delete, process.spawn, network.connect, network.http): a port
# whose type cannot be observed can never be checked. `target` is a glob over
# the resolved path or command line. Both are required -- a port that omits
# either is rejected, not defaulted.
effects:
  components:
    # SI-20 added the skt surface to the model, and this is its one OBSERVABLE
    # port. `skt ticket sweep --yes` removes worktree directories; that is a
    # filesystem delete and it is the effect SI-20-DF-04 was about -- a plan to
    # remove 23 of them built without ever measuring containment. SktStatus and
    # SktCheck carry NO port deliberately: they read and print, and a port whose
    # effect does not exist is dead model surface by the rule stated above.
    SktPort:
      ports:
        worktree_removal:
          type: filesystem.delete
          target: "**/wt-*/**"

    TlaSpecDevCliPort:
      ports:
        spec_tree:
          type: filesystem.write
          target: "**/specs/**"
        evidence_report:
          type: filesystem.write
          target: "**/results/**"
        # RC-01 (MF-026 G-9), the verified dead port. This declared
        # `target: "**/.venv/**"` and was the ONLY port on both BuildSkillCli
        # and InstallLocalCli, while `grep -rn '\.venv' skills/spec-double-2/scripts/*.py
        # skills/spec-double-2/skill-scripts/*.sh` returns ZERO hits -- dead model surface by the
        # rule this file states 30 lines above, declared, annotated in the
        # model, AND seeded as kill-test mutant `port-cli_artifact`, so a
        # kill-test slot was spent on a port nothing exercises. An effect
        # oracle that had ever executed would have found it in one run;
        # `case_codegen.generation_status` is still `planned`, which is the
        # single largest coverage limit in this repository.
        #
        # What the install path actually writes:
        # RC-02: every citation below is content-anchored -- the parenthesised
        # token must be ON the cited line, and tests/test_source_citations.py
        # fails if it is not. The wrapper-write citation was already off by one
        # when this comment was written (line 22 assigns WRAPPER; the write is
        # line 23), which is the N-3 class again, in the same block.
        #   install-tla-spec-dev.sh:26 (mkdir -p) -> $SKILL_MANAGER_BIN_DIR, $SKILL_MANAGER_CACHE_DIR
        #   install-tla-spec-dev.sh:29 (cat > "$WRAPPER") -> $SKILL_MANAGER_BIN_DIR/tla-spec-dev
        #   install-tlc2.sh:18 (mkdir -p "$JAR_DIR") -> $SKILL_MANAGER_BIN_DIR/.spec-double-compiler
        #   install-tlc2.sh:37 (curl -fL) -> $SKILL_MANAGER_CACHE_DIR/tla2tools-<version>.jar.tmp
        #   install-tlc2.sh:38 (mv "$JAR_TMP" "$JAR_PATH")
        #   install-tlc2.sh:41 (cat > "$WRAPPER") -> $SKILL_MANAGER_BIN_DIR/tlc2
        #
        # TARGET `*`, deliberately, and this is the one place in this file
        # where that is the honest glob rather than a lazy one. Both
        # directories are REQUIRED ENVIRONMENT INPUTS -- the installers open
        # with `: "${SKILL_MANAGER_BIN_DIR:?}"` and refuse to run without
        # them -- and nothing in either script constrains where they point.
        # Any narrower glob would assert a constraint the code does not
        # enforce, which is exactly the reasoning already recorded for
        # `corpus_process` below, and is what made `**/.venv/**` a lie rather
        # than merely a stale value. The installers are out-of-model FILES
        # (semantic_model_rule (4)); the standing proviso is that this does
        # not make them out-of-model EFFECTS.
        cli_artifact:
          type: filesystem.write
          target: "*"
        # RC-01 (MF-026 G-9 / ESC-6): the jar download. A real network fetch
        # on a MODELED action path with NO network.* port declared anywhere,
        # although the effect sandbox observes network.connect
        # (effect_conformance.py). The owner declined to answer ESC-6 and
        # wrote the standing proviso instead; this is the port that proviso
        # asked for. Target `*` for the same reason as cli_artifact and one
        # more: `TLA2TOOLS_URL` overrides the URL wholesale, so the
        # tlaplus.org release address is one possible value and not a
        # contract.
        cli_download:
          type: network.http
          target: "*"
        # RC-01 (MF-026 G-9): `mv "$JAR_TMP" "$JAR_PATH"` unlinks the
        # downloaded temporary from the cache directory. DECLARED SEPARATELY
        # because this schema distinguishes filesystem.delete precisely so a
        # delete cannot hide under a write -- the same reason
        # spec_tree_delete exists beside spec_tree.
        cli_artifact_delete:
          type: filesystem.delete
          target: "*"
        # RC-01 (MF-026 G-9): install-tla-spec-dev.sh:37 (--help) runs the wrapper it
        # just wrote (`"$WRAPPER" --help`) as its own self-test. A spawn, and
        # the one effect on this path the program DOES constrain: the wrapper
        # name is a literal, so the glob is a real one.
        cli_selftest_process:
          type: process.spawn
          target: "*tla-spec-dev*"
        # CD-09 (coverage-audit run 2, gap G4): tlc_process (process.spawn
        # *java*) REMOVED. It was declared for AnalyzeComplexity, but the
        # analyze path spawns nothing -- the descriptor scan is a static
        # parser (skills/spec-double-2/scripts/analyze_complexity.py contains no subprocess), and
        # no other modeled action spawns java. By this manifest's own rule a
        # declared port no case exercises is DEAD MODEL SURFACE. The
        # repository's real java spawn lives in case generation
        # (generate_cases_from_tlc_dump.py).
        #
        # RC-01 (MF-026 G-7 + G-6): the rest of this comment used to read
        # "which is EXPERIMENTAL surface, deliberately unmodeled post-pivot
        # (G3, resolved by the scope amendment of 22 July 2026)". BOTH HALVES WERE
        # WRONG. There is no such amendment -- see the source_model note
        # above -- and case generation is no longer unmodeled: the owner ruled
        # on 2026-08-01 (MF-026 round-2 ESC-11, plan semantic_model_rule (2))
        # that it IS modeled, and RC-01 lands it as the `GenerateCases` action
        # carrying corpus_process, spec_tree and spec_tree_delete. That java
        # spawn is now declared -- as corpus_process, not as a restored
        # tlc_process, because the port that used to sit here was declared for
        # AnalyzeComplexity, which still spawns nothing. Leaving this comment
        # would have made it affirmatively false the moment GenerateCases
        # landed, which is why classification could not close G-7 and someone
        # had to edit it.
        test_process:
          type: process.spawn
          target: "*pytest*"
        # CD-10 (audit run 3, gap R3-3a): RunSpecUnitTests' shipped dispatch
        # spawns the generated-case runner (`python
        # skills/spec-double-2/scripts/run_generated_case_adapters.py ...`, built at
        # skills/spec-double-2/scripts/tla_spec_dev.py:395 (run_generated_case_adapters.py) and
        # executed at skills/spec-double-2/scripts/tla_spec_dev.py:459 (subprocess.run) whenever a
        # target carries a generated case package.
        # That command line does not match test_process's `*pytest*` -- only
        # the `uv run --with pytest -m pytest` child at
        # skills/spec-double-2/scripts/tla_spec_dev.py:369 (--with) does -- so the
        # runner spawn gets its own port rather than a widened, dishonest
        # test_process target.
        runner_process:
          type: process.spawn
          target: "*run_generated_case_adapters*"
        # CD-10 (audit run 3, gap R3-2): CloseTicket's shipped close path
        # performs destructive deletes, all under the spec tree: rmtree of TLC
        # `states/` dirs (skills/spec-double-2/scripts/spec_evolution.py:237 (shutil.rmtree) via
        # skills/spec-double-2/scripts/spec_evolution.py:1998 (remove_state_directories) at ticket
        # close and skills/spec-double-2/scripts/spec_evolution.py:2155 (remove_state_directories)
        # at workflow close), rmtree of project `current/` before promotion
        # (skills/spec-double-2/scripts/spec_evolution.py:1088 (shutil.rmtree) via
        # skills/spec-double-2/scripts/spec_evolution.py:1283 (replace_tree), the GitHub #22
        # data-loss mechanism), and unlink of seeded paths the ticket dropped
        # (skills/spec-double-2/scripts/spec_evolution.py:1254 (target.unlink)). filesystem.write
        # on spec_tree never covered these -- the schema distinguishes
        # filesystem.delete precisely so a delete cannot hide under a write.
        spec_tree_delete:
          type: filesystem.delete
          target: "**/specs/**"
        # MF-026 (hexagonal-prompting, gap G-1). RunEffectConformance resets a
        # PER-CASE SCRATCH directory -- skills/spec-double-2/scripts/effect_conformance.py:1692 (shutil.rmtree)
        # via skills/spec-double-2/scripts/effect_conformance.py:1816 (reset_case_work_dir)
        # -- and `--work-dir` is `type=Path` with no
        # resolver, so the caller can point it anywhere. HP-04 declared this
        # under spec_tree_delete (`**/specs/**`), which is true of the DEFAULT
        # and false of the FLAG. The owner tried constraining the path to
        # `specs/` with the guard RC-02 built for generation output and
        # REVERTED it: three legitimate callers run the oracle against a temp
        # directory, and a scratch dir is not spec-tree content. The honest fix
        # is to declare what it actually deletes, so the declaration stops being
        # narrower than the behaviour.
        case_work_dir_delete:
          type: filesystem.delete
          target: "**/case-work/*"
        # MF-026 (hexagonal-prompting, gap G-2). PRE-EXISTING AT THE EPIC BASE
        # and surfaced by no previous audit round. RunSpecUnitTests --no-batch
        # spawns `<python> <work_dir>/programs/case_*.py` --
        # skills/spec-double-2/scripts/run_generated_case_adapters.py:2187 (subprocess.run) -- which
        # matches neither test_process (`*pytest*`) nor runner_process
        # (`*run_generated_case_adapters*`), and `work_dir` defaults to
        # tempfile.mkdtemp, outside spec_tree and evidence_report. Declared
        # rather than constrained: the per-case program IS the unit under test
        # on that path, and forcing it into the spec tree would move real
        # execution output into the model's own directory.
        case_program_process:
          type: process.spawn
          target: "*programs/case-*"
        # MF-026 round 2, G-2 write half. With no --work-dir the runner writes
        # into tempfile.mkdtemp -- skills/spec-double-2/scripts/run_generated_case_adapters.py:2356 (mkdtemp)
        # (mkdtemp) -- placing the per-case program at
        # skills/spec-double-2/scripts/run_generated_case_adapters.py:1353 (program_path). No
        # declared write port accepted that path.
        case_program_write:
          type: filesystem.write
          target: "**/programs/case-*"
        # CD-10 (audit run 3, gap R3-3b): CloseTicket spawns `git rev-parse
        # ...` for history-entry provenance
        # (skills/spec-double-2/scripts/spec_evolution.py:216 (subprocess.run), via
        # skills/spec-double-2/scripts/spec_evolution.py:2191 (git_metadata) at ticket close,
        # skills/spec-double-2/scripts/spec_evolution.py:2306 (git_metadata) at workflow close, and
        # skills/spec-double-2/scripts/spec_evolution.py:1930 (git_metadata) on ticket
        # retirement -- THREE call sites, not the two this sentence claimed
        # before #318's review counted them). The
        # fail-open branch on git error is out-of-model; the spawn itself is
        # not, so it is declared.
        git_metadata:
          type: process.spawn
          target: "git rev-parse*"
        # CD-11 declared this for RunKillTest's per-mutant corpus spawn.
        # CA-04 removed that action; the port SURVIVES because GenerateCases
        # carries it for the java/TLC spawn. The `*` target is retained: it
        # was chosen because the spawned command is unconstrained user input,
        # and that is still true of the generation path.
        corpus_process:
          type: process.spawn
          target: "*"
  actions:
    SktTicketSweep: [worktree_removal]
    SktStatus: []
    SktCheck: []
    BuildSkillCli: [cli_artifact]
    # RC-02 (MF-026 round-3 N-1): cli_download, cli_artifact_delete and
    # cli_selftest_process ATTACHED. RC-01 declared all three in the ports
    # block above, wrote correct comments naming the script line each covers,
    # and attached none of them to an action -- so all three were DEAD MODEL
    # SURFACE by the rule this file states above, no @port line mirrored them,
    # and, decisively, effect_conformance.py binds ports to actions strictly
    # through THIS block (load_effect_declarations builds action_ports; a port
    # absent from an action's row is not declared FOR that action). G-9's
    # substance -- the curl download, the mv unlink and the wrapper self-test
    # spawn -- was therefore still undeclared for the action that performs it,
    # which is the half of G-9 that did not close.
    #
    # WHY INSTALLLOCALCLI AND NOT BUILDSKILLCLI, decided from shipped
    # artifacts rather than from the prose:
    #   1. specs/*/production_adapters.py InstallLocalCliAdapter.apply()
    #      literally runs `bash skills/spec-double-2/skill-scripts/install-tla-spec-dev.sh` and then
    #      the installed wrapper. It is the only adapter that executes an
    #      installer at all.
    #   2. specs/*/kill_mutants.toml (removed by CA-04) seeded port-cli_download,
    #      port-cli_artifact_delete and port-cli_selftest_process with
    #      refine_action = "InstallLocalCli" -- including the two that live in
    #      install-tlc2.sh. RC-01's own catalog placed them here.
    #   3. BuildSkillCliAdapter.apply() checks that the entrypoint and the
    #      installer EXIST and writes nothing; its own comment says so.
    # Splitting the two installers across the two actions would have asserted a
    # phase boundary no shipped artifact draws.
    #
    # RECORDED, NOT FIXED: point 3 makes BuildSkillCli's own `cli_artifact` a
    # candidate for the same dead-row treatment RecordBudgets and AnalyzeCorpus
    # carry, since the adapter for it writes nothing. That is a claim about a
    # row RC-02 was not opened to change, and it is filed as RC-02-DF-01 rather
    # than decided here.
    InstallLocalCli: [cli_artifact, cli_download, cli_artifact_delete, cli_selftest_process]
    ScaffoldProject: [spec_tree]
    # CD-10 (DF-2/ESC-4): deliberately an EMPTY row, not an absent one -- an
    # absent row claims "unmapped", an empty row claims "performs no distinct
    # effect", and only the second is true. The CLI records no budgets:
    # budget_prompt only prints negotiation instructions
    # (skills/spec-double-2/scripts/budgets.py:74-94 (def budget_prompt), printed at
    # skills/spec-double-2/scripts/tla_spec_dev.py:92 (budget_prompt) and
    # skills/spec-double-2/scripts/tla_spec_dev.py:121 (budget_prompt)); the budgets block itself is
    # emitted at scaffold time under ScaffoldProject/ScaffoldWorkflow's
    # spec_tree, and recording user-negotiated values is an agent edit, not a
    # program effect.
    RecordBudgets: []
    ScaffoldWorkflow: [spec_tree]
    OpenTicket: [spec_tree]
    UpdateTicketDesired: [spec_tree]
    UpdateTicketCurrent: [spec_tree]
    AnalyzeComplexity: [evidence_report]
    # CD-11 (audit run 4, gap R4-3): evidence_report REMOVED -- a dead
    # declared port, the same class G4 removed for AnalyzeComplexity's
    # tlc_process. corpus_diagnostics.py has no --out flag (add_arguments
    # skills/spec-double-2/scripts/corpus_diagnostics.py:847 (def add_arguments) registers
    # cases_dir/--view/--manifest only) and no file write anywhere; run()
    # (skills/spec-double-2/scripts/corpus_diagnostics.py:915 (def run)) prints the report and
    # returns. Removal
    # matches the shipped print-only behavior. Deliberately an EMPTY row, not
    # an absent one (the RecordBudgets rule above): the command reads and
    # prints, performing no distinct declared effect.
    AnalyzeCorpus: []
    # REMOVED 2026-08-04 (owner direction): the AnalyzeArchitecture row, with
    # the action. RC-01 (MF-026 G-1) had ADDED this row -- the action shipped
    # with none at all, the only non-stutter action without one -- and the row
    # was correct while the command existed. `evidence_report` is not orphaned
    # by the removal: AnalyzeComplexity, RunEffectConformance and RunKillTest
    # still declare it, and skills/spec-double-2/scripts/spec_paths.py resolve_evidence_out still
    # constrains every `--out` that claims it.
    # RC-01 (MF-026 G-6): case-module generation, previously unrepresented in
    # its entirety -- no action, no port, no CLI subcommand -- while being this
    # epic's flagship feature. corpus_process is the java/TLC spawn
    # (generate_cases_from_tlc_dump.py run_tlc_dump); spec_tree covers the
    # generated package, the per-action coverage record (case_modules.py
    # write_coverage_record), the aggregated coverage report and the
    # parameter-recovery audit (infer_action_params, folded in here as the
    # generation-time artifact it is, round-1 G-11); spec_tree_delete is the
    # TLC metadir `rmtree` in run_tlc_dump's finally branch.
    #
    # RECORDED RESIDUAL, not a waiver: `--out` accepts an absolute path, and a
    # corpus deliberately written outside the spec tree lands outside
    # spec_tree's `**/specs/**`. The relative-path default resolves against the
    # spec directory, which is the documented and exercised path, and the
    # owner's ruling names spec_tree. `--coverage-json` is constrained to the
    # generated package root for the same reason G-2 constrained `--out`.
    GenerateCases: [corpus_process, spec_tree, spec_tree_delete]
    # CD-11 (audit run 4, gap R4-2): spec_tree ADDED, matching shipped
    # behavior. `run effect-conformance --cases-dir` creates its work tree
    # under the spec dir
    # (skills/spec-double-2/scripts/effect_conformance.py:1772 (work_root.mkdir), default
    # spec_dir/.effect-conformance-work;
    # skills/spec-double-2/scripts/effect_conformance.py:1693 (case_dir.mkdir) per-case dirs;
    # skills/spec-double-2/scripts/effect_conformance.py:714 (self.root.mkdir) and
    # skills/spec-double-2/scripts/effect_conformance.py:751 (path.mkdir) sandbox roots) -- writes
    # landing under
    # **/specs/**. DECLARED rather than relocated under results/: the same
    # physical sandbox writes on the spec-unit path are already declared as
    # spec_tree on RunSpecUnitTests (manifest row below), the work tree is
    # spec-scoped working state rather than evidence, and relocating would
    # change a shipped default to fit a declaration -- the dishonesty lived
    # in the manifest, so the manifest is what changed. HP-04 moved the loop
    # itself out of effect_conformance_report.py into the oracle's own module,
    # so the four citations above now name one file instead of two; the writes
    # they describe are unchanged.
    #
    # HP-04 (MF026-R4-F-01): spec_tree_delete ADDED. This is a DECLARATION
    # CHANGE FOLLOWING A BEHAVIOR CHANGE, stated rather than slipped in.
    # The oracle's gap count was 20 / 15 / 14 across three runs of an IDENTICAL
    # corpus on an IDENTICAL tree -- a 43% spread on the number every claim
    # rests on -- because the work tree survived between runs and an adapter
    # that materializes its own before-state writes a file on a cold run that
    # it finds already present on a warm one. Each case now starts from an
    # EMPTY directory (skills/spec-double-2/scripts/effect_conformance.py:1692 (shutil.rmtree)),
    # which is a filesystem.delete under **/specs/** and therefore owes a port
    # by this file's own rule -- the same rule that made CloseTicket declare
    # its TLC states/ rmtree rather than leave it undeclared.
    #
    # SURFACE COST, per the plan's surface_cost_rule, stated because that rule
    # asks for it: ZERO. No new port (spec_tree_delete is declared above and
    # already exercised by CloseTicket, CloseTicketWeakened and GenerateCases),
    # no new action, no new variable, and no change to the TLA state space --
    # effects.actions is a declaration table, not state, and TLC enumerates the
    # same states before and after. What it buys is HP-04's own acceptance
    # criterion: two runs over an identical corpus reporting an identical gap
    # count.
    RunEffectConformance: [evidence_report, spec_tree, spec_tree_delete, case_work_dir_delete]
    RunSpecUnitTests: [test_process, runner_process, spec_tree, case_program_process, case_program_write]
    CloseTicket: [spec_tree, spec_tree_delete, git_metadata]
    # RC-01 (owner decision 2026-08-01, MF-026 round-2 reservation): the same
    # shipped close path taken under a guard-weakening flag. Identical port set
    # -- it writes the same history entry, clears the same trees and asks git
    # the same question -- because what differs is the PRECONDITION, not the
    # effect. The distinction is recorded in the history entry itself
    # (spec_evolution.py `guard_weakening`), which is what makes the modeled
    # state externally observable at all.
    CloseTicketWeakened: [spec_tree, spec_tree_delete, git_metadata]

adapters: case_adapters.toml
notes:
  package_from_program_model: tlaspecdevcli_program_cases
  budgets_helper: skills/spec-double-2/scripts/budgets.py

# MF-011: per-variable justification table. Every element of the model earns
# its place by supporting an invariant, carrying an effect, or killing a
# mutant (references/architecture_tractability.md, "Grow The Model By
# Evidence, Not By Transcription"). `tla-spec-dev analyze complexity` reads
# this table and flags any variable with no linkage as dead weight.
justification:
  # SI-20: the skt surface. Every one of the four defects behind these
  # invariants was a CLAIM made over something unmeasured, so one record of
  # what skt has answered carries all four. No effects: SktStatus and SktCheck
  # read and print. SktTicketSweep's delete is declared on SktPort and attached
  # to the action, not to the variable.
  skt_answer:
    invariants: [TypeInvariant, SktNamesNoEpicItCannotResolve, SktClaimsNoMembershipItDidNotJoin, SktVerdictCoversEverySurfaceItNames, SktPlansNoRemovalWithoutContainment]
    effects: []
    kill_tests: []
  setup_phase:
    invariants: [TypeInvariant, CliInstalledRequiresBuilt, WorkflowRequiresProject, BudgetsRequireProject, WorkflowRequiresBudgets, ProjectChoosesKnownSpecRoot]
    effects: []
    kill_tests: []
  spec_root:
    invariants: [ProjectChoosesKnownSpecRoot, TypeInvariant]
    effects: []
    kill_tests: []
  # MF-025: active_tickets, ticket_phase and closed_tickets collapsed into the
  # single ticket_state ordinal. It inherits the union of their invariant
  # linkages -- every named property they justified is still checked.
  ticket_state:
    invariants: [TypeInvariant, NoOpenClosedOverlap, CurrentRequiresDesired, SpecUnitTestsRequireCurrent, SpecUnitTestsRequireMeasuredCorpus, ClosedTicketsPassedSpecUnitTests]
    effects: []
    kill_tests: []
  # CD-09 (G2): complexity_gate is the recorded ADVISORY verdict -- an
  # observable fact AnalyzeComplexity writes into its evidence report, read by
  # no guard. SpecUnitTestsRequireAnalyzedGate and the blocking guard it
  # depended on were removed with the withdrawn gate, and port-tlc_process /
  # inv-SpecUnitTestsRequireAnalyzedGate left the mutant catalog with them.
  complexity_gate:
    invariants: [TypeInvariant]
    effects: []
    kill_tests: []
  corpus_gate:
    invariants: [TypeInvariant, SpecUnitTestsRequireMeasuredCorpus]
    effects: [CliWorkflowResult.analyze_corpus_verdict]
    kill_tests: []
  lastCommand:
    invariants: []
    effects: [CliWorkflowResult.last_command]
    kill_tests: []
  result:
    invariants: []
    effects: [CliWorkflowResult]
    kill_tests: []
  effect_conformance:
    invariants: [TypeInvariant, SpecUnitTestsRequireMeasuredEffects]
    effects: [CliWorkflowResult.effect_conformance_verdict]
    kill_tests: []
  # CA-04 REMOVED kill_test. It was justified by its own invariant and by the
  # mutant that attacked the floor it gated -- the oracle subject to the
  # oracle. Both went with the action (RM-03-DF-05). Every `kill_tests:` list
  # below is now empty for the same reason: the catalogues they named are
  # gone, and a stale mutant id is a justification that cannot be checked.
  # REMOVED 2026-08-04 (owner direction): architecture_scan and
  # architecture_delta, with the command that wrote them. Both were justified
  # ONLY by TypeInvariant plus their own externally-visible verdict -- no
  # invariant related them to anything else, no guard read them, and neither
  # carried a kill test. That is the shape of a variable whose entire reason to
  # exist is that a command prints a number, which is precisely what this table
  # was built to expose. See the tombstone in TlaSpecDevCli.tla and
  # references/architecture_advice.md.
