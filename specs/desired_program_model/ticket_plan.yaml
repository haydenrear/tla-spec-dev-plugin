# Canonical plan for epic/bug-sweep (#199). Issues mirror it; they never replace it.
version: 1
name: bug-sweep
updated: '2026-11-07'
purpose: 'Bug epic #199: restore reliability of close, ledger, test-graph and skt tooling; then evaluate (bugs proven,
  suite, graphs, evals, manual loop).'
planning_rules:
  current_model_rule: Update specs/current after each production slice lands as a whole-program working copy of
    specs/program_model, not a ticket projection.
  unit_validation_rule: Run current-model TLC and adapter/unit tests before adding graph execution.
  graph_rule: Add graph or integration nodes only after current-model validation passes.
  semantic_model_rule: Do not add test graph nodes, pytest jobs, CI workflow steps, integration harnesses, or validation
    scripts as TLA+ program state/actions.
  evidence_rule: Record tests and graph runs as evidence for semantic program actions in manifests or ticket status.
  desired_sync_rule: Update this file and spec_manifest.yaml whenever scope, order, acceptance checks, or status
    changes.
  promotion_rule: When specs/current equals specs/desired_program_model, promote the converged model to specs/program_model.
  model_ownership_rule: The epic agent owns the model. Ticket agents run no `open ticket`, `close ticket`, `close_tickets.py`
    or `--accept-new`. Every ticket here is a tooling fix with a no-op model result; the epic agent opens and closes
    each spec ticket at wave merge.
  validation_acceleration_rule: 'Accelerate. Run only the graphs in your validation.graphs list (graphs for what
    you changed), never the full matrix. Run the targeted repository_unit subset, not the full 30-45 min suite (only
    BS-08 and BS-16 run it). When a graph goes red: fix, then RESUME from the failing node with `python3 skills/test-graph/scripts/run.py
    <graph> --resume-from-build test_graph/build/validation-reports/<runId> --resume-from-node <failing-node>` (or
    `--run-only-node <node>` to recheck one node). Restart from the beginning only when your fix touched a node
    upstream of the failure. At most two fix laps per layer, then record what stayed red and stop.'
status:
  workflow: bug-sweep
  active_ticket: BS-09
  active_ticket_title: Repo test_graph uses the installed test-graph
  desired_module: TlaSpecDevCli
  phase: dispatch-wave-1
