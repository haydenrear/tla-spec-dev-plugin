  - id: SI-29
    title: "Disclosure routes by agent role, and every role's path ends in how it feeds the substrate back"
    github_issue: "https://github.com/haydenrear/tla-spec-dev/issues/391"
    status: planned
    schedule_revision: 10
    depends_on: ["SI-28"]
    blocks: ["SI-23"]
    wave: 22
    promotion_order: 192
    promotion_predecessor: "SI-28"
    role: implementation
    objective: >-
      Four agent roles -- ticket, epic, review, testing -- each read a path
      sized to their job, and each path ENDS in how that role hands what it
      learned back to the epic agent. The plugin works because agents improve it
      and then use it to improve their projects; a reading path that does not
      close that loop is unfinished, not merely incomplete.
    desired_actions: []
    implementation_scope:
      - "REFERENCES ONLY. OWNER CONSTRAINT, VERBATIM: 'There will be nothing but references. The agent must read the plugin, skill, and then based on what it sees and reads it reveals more relevant information to that agent. Do not add any sort of script for this.' No marker file, no environment variable, no role-detection code, no hook change. An agent arrives at its role by READING, not by being told by a mechanism."
      - "THE IDIOM ALREADY EXISTS AND IS DOCUMENTARY: `skill-imports:` entries carrying a `reason` per entry. `discovery` uses it well -- it routes by TASK ('start this ticket', 'landing in an unfamiliar repo'). Nothing routes by ROLE. Extend the existing idiom; do not invent a second one."
      - "DO NOT ADD A TWELFTH UNIT. A new unit adds a description to what loads every session, which is the quantity this ticket must REDUCE. The routing lives in pages the reader reaches, not in a new card."
      - "THE NUMBERS, MEASURED AT 7ba79bee by the epic agent: descriptions total 1005 words against a target of 600; 6 of 11 card bodies exceed 1500 (skt 2242, unit-authoring 1797, git-issue-workflow 1788, git-epic-workflow 1820, skill-manager 1648, spec-double-2 1567). SI-09 cut descriptions to 594 mid-epic and the restructure grew them back by nesting units in, so a second round of word-cutting does not hold. Route, do not trim."
      - "EACH ROLE'S PATH ENDS IN PROPAGATION, and this is the ticket's point rather than its last section. A ticket agent has `## Skill changes proposed` and a per-ticket inbox. AN EPIC AGENT, A REVIEW AGENT AND A TESTING AGENT HAVE NOTHING: they are not named as roles anywhere, ship no agent definition, and open no PR carrying that section. specs/results/deferred/EPIC-AGENT.yaml exists and holds ZERO rows -- the one role that consumes findings has never filed one."
      - "THE GRAMMAR TO REUSE, NOT REPLACE: skill_change `none|proposed(unit,what)|applied(x)|declined(x)`, read advisorily by skills/spec-double-2/scripts/improvement_ledger.py. It is already how a finding becomes a change. Make every role able to write it, and say where each role writes it when that role opens no PR."
      - "SAY WHAT COMES BACK THE OTHER WAY. The loop has two legs and only one is documented. A role that reports friction should be able to learn that the epic agent CHANGED the plugin because of it -- otherwise reporting is a write-only channel and agents stop doing it. Name where a role looks to see its own finding's disposition."
      - "The four roles are the owner's: ticket, epic, review, testing. `TICKET_ROLES = (implementation, evaluation)` in validate_epic_plan.py is a PLAN vocabulary read by the validator, not an agent vocabulary. Do not conflate them, and do not break the plan schema to reuse the word."
      - "EVALS PER ROLE, AND THEY ARE THE PROOF THIS TICKET WORKED. A routing change that nothing exercises is a claim, and this epic has caught several. At least one case per role -- ticket, epic, review, testing -- measuring the thing that actually matters: an agent arriving cold READS ITS WAY to its own role's path, and reaches the propagation destination at the end of it. Not that a file exists; that a reader gets there."
      - "AT LEAST ONE CASE MUST MEASURE THE BACK-CHANNEL ITSELF, not just the reading: a role that hits substrate friction states what it would propagate, in the skill_change grammar, to the destination its own path named. That is the loop under test, and it is the half no existing case covers."
      - "GOAL-evals-earned APPLIES AND IS DECIDED BY A CHECK ON GIT, not by a claim: the manual record of walking each role's path by hand must be committed BEFORE the first case.yaml, and the record commit must contain no case files. Four rungs have passed this -- 8e362bbb->eefe3aa8, 70549f90->7daa8e18, bec1934b->c96de147, 679f76f1->3dc106fb. Walk all four roles by hand first."
      - "THE INSTRUMENT DISCIPLINE THE LANE EARNED, because these cases will be billed: run evals/setup-eval-home.sh --smoke once first; run evals/lib/check_graders.py BEFORE billing anything (graders are a JavaScript regex engine, not Python -- SI-21 billed a 0.00 learning that); register each case in BOTH lib/place.sh and lib/verify.sh's verify_from_expect arm (SI-22-DF-07: two consecutive tickets hit that undocumented step); and state sample count and spread, never a bare mean -- --runs 6 does NOT pin a score, measured 0.89->0.81 and 0.97->0.94 on unchanged cases."
      - "A case whose case.yaml does not parse DROPS OUT OF THE CORPUS SILENTLY and the run still looks clean (#389). Parse every case file you add, with a non-vacuity assert, before reporting any score."
    current_increment:
      model_state: []
      model_actions: []
      adapters: []
      unit_tests: []
      graph_after_unit_pass: []
    conflict_keys:
      production: ["skills/**/SKILL.md", "skills/**/references/**", "README.md", "evals/**"]
      tla: []
      adapters: []
      test_graph: []
      workflow: []
    goals:
      - goal: GOAL-progressive-disclosure
        contribution: direct
        expected_effect: "descriptions fall under 600 words in total and every card body under 1500, by routing rather than trimming, so the next nested unit does not undo it"
        local_signal: "the pinned word-count method re-run before and after, both numbers reported"
      - goal: GOAL-findings-become-changes
        contribution: direct
        expected_effect: "three roles that today have no channel gain one, and the epic agent's own empty inbox gets a documented use"
        local_signal: "each of the four roles' paths ends at a named propagation destination, demonstrated by reading"
      - goal: GOAL-evals-earned
        contribution: direct
        expected_effect: "a fifth stage, manual record first: each role's path walked by hand before any case encodes it"
        local_signal: "the record names all four roles and what walking each one reached"
      - goal: GOAL-evals-one-command
        contribution: direct
        expected_effect: "the four agent roles become a covered surface in the one command, which today has no case at all"
        local_signal: "per-role coverage counted, each case green or explicitly UNDECIDED with a reason"
    acceptance:
      commands: []
      assertions:
        - "Nothing executes to decide disclosure: no marker, no environment variable, no detection code, no hook change."
        - "An agent reaching the plugin cold can arrive at its own role's path by reading alone, and this is DEMONSTRATED by walking it, not asserted."
        - "Descriptions total <= 600 words and every card body <= 1500, measured with SI-09's pinned method, before and after."
        - "No twelfth unit."
        - "Each of the four roles' paths ends in how that role propagates back, with a named destination for roles that open no PR."
        - "The return leg is documented: where a role sees what became of what it reported."
        - "Reuses the skill_change grammar rather than inventing a second one."
        - "At least one eval case PER ROLE, measuring that a cold reader arrives at that role's path and reaches its propagation destination -- not that a file exists."
        - "At least one case measures the BACK-CHANNEL: a role stating what it would propagate, in the skill_change grammar, to the destination its own path named."
        - "The manual record of walking all four roles precedes the first case.yaml in git, and the record commit carries no case files."
        - "Every case file added parses, checked with a non-vacuity assert, because an unloadable case drops out of the corpus silently (#389)."
        - "Scores reported with sample count and spread, never a bare mean."
      evidence: []

