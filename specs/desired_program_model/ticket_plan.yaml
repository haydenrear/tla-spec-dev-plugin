# Canonical plan for epic/evidence-sized-delivery (#234). Issues mirror it; they never replace it.
version: 1
name: evidence-sized-delivery
updated: '2026-11-10'
purpose: 'Epic #234: choose the largest evidence-supported increment agents can review and validate reliably, through instructions,
  attribution, TLA+ architecture and Test Graph design guidance only. No new scripts, controller, runner, framework, CLI,
  schema validator or automatic gate.'
planning_rules:
  current_model_rule: Update specs/current after each production slice lands as a whole-program working copy of specs/program_model,
    not a ticket projection.
  unit_validation_rule: Run current-model TLC and adapter/unit tests before adding graph execution.
  graph_rule: Add graph or integration nodes only after current-model validation passes.
  semantic_model_rule: Do not add test graph nodes, pytest jobs, CI workflow steps, integration harnesses, or validation scripts
    as TLA+ program state/actions.
  evidence_rule: Record tests and graph runs as evidence for semantic program actions in manifests or ticket status.
  desired_sync_rule: Update this file and spec_manifest.yaml whenever scope, order, acceptance checks, or status changes.
  promotion_rule: When specs/current equals specs/desired_program_model, promote the converged model to specs/program_model.
  model_ownership_rule: The epic agent owns the model. Ticket agents run no `open ticket`, `close ticket`, `close_tickets.py`
    or `--accept-new`. Every ticket here is instruction/evidence-only with a no-op model result; the epic agent opens and
    closes each spec ticket at wave merge.
  no_new_machinery_rule: 'User mandate (#234): no new Python or other scripts, controller service, runner, framework, CLI,
    schema validator or automatic gate. Evidence goes to existing result destinations; examples are prose.'
  validation_acceleration_rule: 'Prose tickets run only the doc-contract subset in validation.repository_unit and the spec-unit
    suite (known red: 2 failures on the base, see baseline). No runtime graph is ticket-local proof of prose uptake; ESD-06
    owns the one integrated eval comparison.'
status:
  workflow: evidence-sized-delivery
  active_ticket: ESD-01
  active_ticket_title: Audit cross-repository attribution and the actual cost of validation
  desired_module: TlaSpecDevCli
  phase: dispatch-wave-1
