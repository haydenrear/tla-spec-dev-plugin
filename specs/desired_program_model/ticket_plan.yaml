service_catalog:
  existing_boundaries:
    - "spec-double-compiler skill surface at the repository root"
    - "five workflow skills, each its own repository, installed separately in three home tiers"
    - "tla-spec-dev CLI (scripts/tla_spec_dev.py), modelled by specs/program_model/TlaSpecDevCli.tla"
  desired_boundaries:
    - "one skill-manager plugin `tla-spec-dev` whose skills/ holds spec-double-2 and the five nested workflow skills"
    - "one improvement record: a finding carries an anchor, a skill-change disposition, and the goal it moved"
    - "one writer: the epic agent applies model deltas, anchors, card rows and proposed skill changes at wave close"
  adapter_boundaries:
    - "specs/program_model/production_adapters.py — import roots move when the surface moves"
  known_gaps:
    - "13 skill-feedback findings are `recorded-local` and never left the file"
    - "39 deferred rows carry no skill-change field"
    - "no instrument scores whether the process improved the substrate"

deferment_policy:
  mode: batch
  blocking: escalate
  budget: 5
  # CUMULATIVE ledger carrying every prior epic's findings: 33 rows at kickoff.
  # Append this epic's findings; never truncate, re-template or reorder it —
  # sealed close-history records point into it by ID.
  backlog: "specs/results/deferred_findings_final.yaml"
  # ADOPTED 2026-09-20 AT THE WAVE-8/9 BOUNDARY, on the owner's "accept
  # defaults". SI-07's validator has recommended this since wave 3 and it was
  # deferred five times because every wave since has run a single ticket, so a
  # shared file cost nothing. That stops being true at SI-23, which files
  # against SIX goals into one 79-row ledger -- the exact shape the validator
  # named: "a shared mutable namespace with no per-agent partition, where
  # collision is CERTAIN rather than careless."
  #
  # Adopted at a BOUNDARY, never mid-flight: a live assignment names the
  # cumulative file, so changing the convention under a running agent would
  # invalidate its instructions. Waves 1-8 are merged and wave 9 is not yet
  # dispatched, which is the only safe moment.
  #
  # How it works: each ticket appends ONLY to its own rendered path. The
  # cumulative `backlog` above stays canonical -- readers and sealed `filed_as`
  # references point into it -- and the EPIC AGENT concatenates the wave's
  # per-ticket files onto it at wave close. That is an append nobody contends,
  # not a resolution.
  #
  # Deliberately NOT a union merge driver (references/deferment.md): a union
  # driver silently produces a valid-looking file when it is wrong, which is
  # the same defect class it would be papering over -- a check whose negative
  # result is indistinguishable from not having looked. It would trade four
  # visible reconciles for one invisible corruption.
  per_ticket_backlog: "specs/results/deferred/{ticket}.yaml"

# Owner decision 2026-09-17, after the kickoff review: gate three boundaries
# rather than six -- after the migration (2), after the epic-agent rules land
# (4), and at evaluation (6). Waves 1, 3 and 5 still produce a committed review
# artifact; they just do not stop for an answer. Not a schedule_revision change:
# revision covers IDs, edges, waves, promotion order, conflict ownership and
# validation scope, and a policy change is none of those.
review_policy:
  cadence: milestone
  gate: true
  merges: owner
  milestones: [2, 4, 6]
  artifact_root: "specs/results/epic-self-improvement-substrate/review"
  walkthrough: required

