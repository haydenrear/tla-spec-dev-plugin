    metric: "words of skill description (loaded every session) and words of card body (loaded when the skill is used), per skill and in total"
    harness: "the word-count script recorded in the baseline evidence, re-run over skills/*/SKILL.md; plus the wide lane's budget graders (Bash <= 4) to show the cut did not cost turns"
    baseline:
      value: "descriptions 923 words over the six units that become the plugin; card bodies 15,479 words total, ranging 933 (discovery) to 4,114 (git-epic-workflow)"
      measured_at: "b7a7d203"
      evidence: "specs/results/epic-self-improvement-substrate/baseline/kickoff.md"
    # WAVE-4 GATE, 2026-09-18. The baseline MOVED AGAINST the goal and the
    # target is deliberately unchanged. Card bodies went 15,598 -> 16,840
    # (+1,242) because SI-06 and SI-07 added exactly what their tickets
    # required: git-epic-workflow +521 (the five-block schema and rule 10),
    # git-issue-workflow +325, discovery +163, test-graph +136, git-issue +97.
    # Descriptions held at 923. The increase is rationalised, not excused --
    # every added word is a rule an agent is expected to follow, which is why
    # SI-09's job is to move them behind the reference map rather than delete
    # them. SI-09 now has 1,242 more words to cut than its issue assumed, and
    # SI-12 adds two more cards to the set.
    target: "descriptions <= 600 words in total; every card body <= 1,500 words with the remainder behind the reference map; no wide-lane budget case regresses"
    evaluation_ticket: "SI-23"
    evidence_root: "specs/results/epic-self-improvement-substrate/goals/GOAL-progressive-disclosure"

  - id: GOAL-evals-one-command
    kind: integration
    statement: "Every eval this development loop runs lives in one place -- the plugin's evals/ -- and runs in one command, without a shim plugin, a units-override file, or a second harness in another repository."
    metric: "eval cases runnable in one command from the plugin, and how many of the loop's surfaces have at least one"
    harness: "claude plugin eval <plugin dir> over the plugin's own evals/, each case reported green, red, or UNDECIDED"
    baseline:
      value: "2 cases, reachable only through examples/agent_integration/eval-plugin (a symlink shim built because plugin eval refuses a directory over 20,000 entries and specs/ alone is 20,493); the wide lane needs units-override.txt"
      measured_at: "b7a7d203"
      evidence: "specs/results/epic-self-improvement-substrate/baseline/kickoff.md"
    # OWNER SCOPE WIDENED, 2026-09-18, before wave 5. The goal used to stop at
    # "any skill in the plugin". It now covers the whole loop, because the
    # loop's evals are currently split across two repositories and two
    # harnesses that do not share a runner:
    #
    #   this plugin      7 cases under evals/, run by evals/run.sh, which
    #                    stages a 6,264-entry view because `claude plugin eval`
    #                    refuses a directory over 20,000 entries.
    #   skill-manager    55 cases under specs/evals/harness/evals/, run by
    #                    (CORRECTED AT WAVE 9: this said 63, which counted
    #                    generated copies under build/. SI-15 measured 55
    #                    sources. The error was the epic agent's and it was
    #                    repeated from revision 3 onward.)
    #                    eval_run_case() in a 43,330-byte lib.sh, against a
    #                    branched home built per case.
    #
    # 70 cases, two runners, two environments, one loop. `claude plugin eval`
    # runs on a PLUGIN; skill-manager is not one (it has no .claude-plugin/),
    # and tla-spec-dev is. So the cases move to the plugin rather than the
    # plugin growing a second harness to meet them. SI-15 performs the move.
    #
    # MEASURED WHILE WIDENING, and it is a defect not a detail: skill-manager's
    # specs/evals/README.md documents `./build-env.sh "$SKILL_MANAGER_HOME"`
    # and `./run.sh 'epic-*'` as THE way to run that lane. Neither file exists
    # in specs/evals/harness/. The documented one-command entry is already
    # fiction on that side, which is part of why this goal is worth widening.
    baseline_widened:
      value: "62 cases across two repositories and two runners: 7 in this plugin's evals/ (staged-view runner), 55 in skill-manager's specs/evals/harness/evals/ (branched-home runner). Neither of skill-manager's two documented entry points, build-env.sh and run.sh, exists. CORRECTED AT WAVE 9: this baseline said 70/63, counting generated copies under build/ as sources."
      measured_at: "45a42b54"
      evidence: "specs/results/epic-self-improvement-substrate/goals/GOAL-evals-one-command"
    target: "all of the loop's cases under the plugin's evals/, runnable in one command; at least one case per nested skill; every case green or explicitly UNDECIDED with a reason; no units-override file and no second harness"
    evaluation_ticket: "SI-23"
    evidence_root: "specs/results/epic-self-improvement-substrate/goals/GOAL-evals-one-command"

  - id: GOAL-pinned-eval-toolchain
    kind: integration
    statement: "An eval run declares the toolchain it ran against. The skt version is pinned and recorded per run, and a full-suite run asks which version to use rather than silently taking whatever the operator's home happens to hold."
    metric: "eval runs whose recorded evidence names the exact skt ref they ran against, over eval runs performed"
    harness: "the suite's own run record, plus a read of the case scaffold: the pinned ref must appear in the repository, not only in a run log"
    baseline:
      value: "0 of the loop's runs record a toolchain version. skt resolves from the operator's live home at gitRef 'main' (gitHash 286a3694a815c6f6a9e76bffcb03a1fd8100cce3, installed 2026-09-14), and 'main' is a moving target; nothing in either harness pins it, asks for it, or writes it next to a score."
      measured_at: "45a42b54"
      evidence: "specs/results/epic-self-improvement-substrate/goals/GOAL-pinned-eval-toolchain"
    # THE HARD CONSTRAINT, measured before this goal was written, so that the
    # ticket is not asked to discover it: `claude plugin eval` HAS NO VERSION
    # PINNING FOR PLUGIN DEPENDENCIES. Its `plugins:` field takes relative
    # filesystem paths only -- no git ref, no marketplace constraint, no
    # lockfile, and no manifest-level "this plugin depends on that one".
    #
    # So the pin cannot be DECLARED; it has to be MATERIALISED. The shape that
    # works is: a scaffold step clones skt at a recorded ref into a fixture
    # directory, and the case points `plugins:` at that path. The ref lives in
    # the repository under change control, which is what makes a run
    # reproducible and a score comparable across weeks.
    #
    # The "asks which version" clause is therefore a RUNNER obligation, not a
    # schema one: there is no field for the CLI to prompt about.
    target: "every full-suite run records the skt ref it used; the ref is pinned in the repository rather than resolved from the operator's home; the runner asks which version before a full run and refuses to guess silently"
    evaluation_ticket: "SI-08"
    evidence_root: "specs/results/epic-self-improvement-substrate/goals/GOAL-pinned-eval-toolchain"

  - id: GOAL-one-plugin
    kind: integration
    statement: "The substrate is ONE installed plugin. skt ships inside it, wt ships inside skt, and the only thing installed separately is the skill-manager CLI, which comes from Homebrew."
    metric: "units a fresh machine installs to get the whole substrate, and whether the front door resolves with skt contained"
    harness: "a fresh home: brew install the CLI, install the plugin, then run the front door (`skt ticket new`) and `skill-manager list`"
    baseline:
      value: "2 installed units plus a brew formula: the tla-spec-dev plugin AND the skt plugin, separately versioned and separately synced; wt lives in git-issue-workflow/scripts/wt inside the bundle while the tool that calls it sits outside"
      measured_at: "73867de9"
      evidence: "specs/results/epic-self-improvement-substrate/goals/GOAL-one-plugin"
    # THE BOOTSTRAP CYCLE WAS CHECKED BEFORE THIS GOAL WAS WRITTEN, because
    # "skt installs plugins, so skt cannot live inside a plugin" is the obvious
    # objection and it turns out to be false:
    #   * `brew install haydenrear/skill-manager/skill-manager` is ALREADY the
    #     supported install path; skill-manager 0.28.1 is running from
    #     /opt/homebrew/Cellar. The JVM CLI that installs plugins is not skt.
    #   * `<home>/bin/cli/skt` is a GENERATED WRAPPER, not the tool. It resolves
    #     `plugins/skt/src/skt/cli.py` relative to the home it lives in, with no
    #     absolute path baked in. Contained skt needs ONE more rung there --
    #     the same two-rung change SI-12 made twice.
    # So the chain is: brew -> skill-manager CLI -> installs the plugin ->
    # provides skt, wt and every skill. No cycle.
    target: "one installed plugin provides the substrate; the front door resolves with skt contained; no standalone skt unit in root or project home; the CLI comes from brew"
    evaluation_ticket: "SI-23"
    evidence_root: "specs/results/epic-self-improvement-substrate/goals/GOAL-one-plugin"

  - id: GOAL-evals-earned
    kind: quality
    statement: "No eval is written for behaviour nobody has watched work. Each eval stage runs its test graphs and verifies the workflow scripts BY HAND first, and the eval encodes what was observed."
    metric: "eval stages whose manual-verification record precedes their first eval case, over eval stages shipped"
    harness: "each stage's own evidence directory: the graph run, the by-hand transcript of the scripts, and only then the case"
    baseline:
      value: "0 of the loop's eval stages have a manual-verification record; the 7 cases here and the 55 in skill-manager were written without one being required"
      measured_at: "73867de9"
      evidence: "specs/results/epic-self-improvement-substrate/goals/GOAL-evals-earned"
    # THIS GOAL EXISTS BECAUSE OF THIS EPIC'S OWN RECORD, not as a principle.
    # Four waves running, the recurring defect has been a check whose negative
    # result is indistinguishable from not having looked -- committed by ticket
    # agents AND by the epic agent, twice in one session at the wave-6 gate,
    # including a sweep that carried a non-vacuity assert and still scanned the
    # wrong population. An eval written for behaviour never observed by hand is
    # that defect with a budget attached. Manual first is the cheapest known
    # remedy: you cannot assert what a check should say until you have seen the
    # behaviour say it.
    target: "every eval stage ships a manual-verification record that predates its first case; no stage's cases are written before its graphs run"
    evaluation_ticket: "SI-23"
    evidence_root: "specs/results/epic-self-improvement-substrate/goals/GOAL-evals-earned"

