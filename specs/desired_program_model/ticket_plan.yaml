# This file is part of the desired program model.
# It is the CANONICAL plan for epic/self-improvement-substrate. GitHub issues
# mirror it for handoff; they do not replace it.
version: 1
name: self-improvement-substrate
updated: "2026-09-21"
# REVISION 10 (2026-09-25): TWO TICKETS INSERTED AHEAD OF THE EVALUATION, on the
# owner's instruction, because SI-22 measured two things that make SI-23's
# verdicts unsafe to write as they stand.
#
# SI-22 proved that NOTHING in this substrate branches on agent type: both
# shipped hooks carry zero role conditionals, and `role:` is read by the plan
# validator and never by anything an agent sees. Meanwhile
# GOAL-progressive-disclosure is failing BOTH clauses at the tip -- 1005 words
# of description against a 600 target, 6 of 11 card bodies over 1500 -- and it
# is failing for a structural reason, not a wordiness one: SI-09 cut
# descriptions to 594 mid-epic and the restructure grew them back to 1005 by
# nesting more units in. Cutting words again does not hold, because the next
# nested unit undoes it. Selecting WHAT A ROLE READS is the fix that survives.
#
# THE OWNER'S CONSTRAINT ON HOW: references only. "The agent must read the
# plugin, skill, and then based on what it sees and reads it reveals more
# relevant information to that agent. Do not add any sort of script for this."
# No marker file, no environment variable, no detection code. The routing idiom
# already exists and is documentary -- `skill-imports:` entries carrying a
# `reason` -- and it routes by TASK today. SI-29 makes it route by ROLE too.
#
# AND THE POINT OF THE ROUTING IS EVOLUTION, NOT TIDINESS. The owner's framing,
# which SI-29's acceptance encodes: "The reason the plugin works is because
# agents improve it, and use it to improve their projects." So a role's reading
# path is not finished when it says what the role may do; it is finished when it
# says how that role hands what it learned back to the epic agent, who changes
# the plugin, and then uses the changed plugin on the project. Splitting the map
# from the back-channel would have produced a map that discloses well and
# evolves nothing, so they are ONE ticket.
#
# SI-28 comes first and is small: exit 11 was never an unfixed defect, it was an
# UNRELEASED one, and the substrate could not tell. Released as v0.28.2 on
# 2026-09-25 by the owner's authorisation. What remains is that nothing states
# which CLI version this plugin requires, so a stale CLI can silently define a
# goal measurement -- which is exactly what happened to GOAL-one-plugin.
#
# SI-23 moves from wave 21 to wave 23 and depends on both.
#
# EXPECTED WARNING, NOT AN OVERSIGHT. validate_epic_plan now emits
# "evaluation ticket 'SI-08' must depend on contributor 'SI-29'" for
# GOAL-findings-become-changes, alongside the identical pre-existing warning for
# SI-27. SI-08 FROZE that goal at wave 10 and cannot depend on tickets promoting
# after it; SI-23's charter is to RE-READ the four SI-08 froze and print both
# readings side by side, and that re-read is the mechanism that covers these
# contributors. The warning is the plan telling the truth about a goal whose
# reading is deliberately split across two evaluations. Do not silence it by
# detaching SI-29 from the goal it actually moves.
#
# REVISION 7 (2026-09-21): SI-25 and SI-26 are done, and SI-18's scheduling is
# repaired. Revision 5 gave SI-18 `depends_on` SI-19..SI-22 while placing it at
# wave 16, AHEAD of all four -- the only row in the plan that depended on a
# later wave. The owner re-sequenced: graph surface, then the manual gamut,
# then skill-manager, and the eval ladder LAST, consuming a substrate both
# products already share. The dependency list and the objective now say that.
schedule_revision: 10
purpose: "Make tla-spec-dev one plugin and one loop: the substrate improves because of what agents ran into while using it, and the epic agent is the one writer of the model, the matrix, the scorecard row and the plugin."

planning_rules:
  # ADDED AT REVISION 4, 2026-09-19, AND IT CHANGES THE ENDGAME.
  # The epic branch does NOT merge into tla-spec-dev's default branch. That
  # repository must keep shipping the spec-double-compiler SKILL, because
  # everyone who has it installed syncs from there; landing a PLUGIN layout on
  # its main would break those syncs. The epic's result reaches users through
  # tla-spec-dev-plugin instead, by cutover once the epic closes.
  #
  # This also retires a practice the epic agent started in wave 3 and repeated
  # at every wave close WITHOUT stating what it implied: pushing the epic tip to
  # tla-spec-dev-plugin's main. That made the install source track unmerged
  # mid-epic work -- 354 commits ahead of tla-spec-dev's main at the wave-6
  # gate. It stops here. The plugin repo's main receives the epic's result at
  # cutover, not its work in progress.
  # SUPERSEDED IN PART AT REVISION 5, 2026-09-20, BY OWNER DECISION.
  # The cutover HAPPENED MID-EPIC, at wave 10, with eight tickets still planned:
  # `git push tla-spec-dev-plugin HEAD:refs/heads/main` moved that repo's main
  # 45dae6eb -> 8e9679fb. The rule below forbade exactly that, and it was written
  # to constrain the epic agent after it mirrored the tip through waves 3-6
  # without stating what it implied. So this amendment is recorded rather than
  # written into the sentence: the rule did its job, and the owner overrode it
  # deliberately because the home and project migrations had already begun and
  # rolling them back was worse than cutting over early.
  # The FIRST half of the rule is untouched and still binding: the epic branch
  # never merges to tla-spec-dev's default branch.
  no_default_branch_merge: >-
    The epic branch never merges to tla-spec-dev's default branch; tla-spec-dev
    keeps shipping the spec-double-compiler SKILL so existing installs keep
    syncing. The plugin is delivered through tla-spec-dev-plugin, whose main was
    cut over on 2026-09-20 at wave 10 by owner decision -- earlier than this rule
    originally allowed. From that point tla-spec-dev-plugin's main IS the epic's
    delivery surface and later waves land on it. `finalize` for this epic means
    the cutover and the SI-24 root-home rebuild, not a default-branch merge.
  # ADDED AT REVISION 3, 2026-09-18. SI-13 and SI-15 land work in the
  # skill-manager repository (git@github.com:haydenrear/skill-manager.git),
  # which is a separate checkout and a separate pull request. Every piece of
  # this epic's wave-close machinery -- conflict_keys, the review artifact, the
  # cumulative backlog, the promotion order -- is scoped to THIS repository and
  # does not see that one. The gap was found while drafting those two tickets,
  # not at their wave, which is the only reason it is written here rather than
  # discovered at wave 7.
  cross_repo_rule: >-
    A ticket whose scope reaches skill-manager opens a SECOND pull request in
    that repository and names it in its own PR body: the repo, the branch, the
    PR number, and what changed there. The epic agent records both PRs in the
    wave review artifact and merges them in the promotion order the plan
    declares. conflict_keys govern this repository only; two tickets touching
    the same file in skill-manager is a collision the plan cannot see, so no two
    tickets in the same wave may carry skill-manager scope. SI-13 (wave 7) and
    SI-15 (wave 9) are deliberately in different waves for this reason.
  current_model_rule: Update specs/current after each production slice lands as a whole-program working copy of specs/program_model, not a ticket projection.
  unit_validation_rule: Run current-model TLC and adapter/unit tests before adding graph execution.
  graph_rule: Add graph or integration nodes only after current-model validation passes.
  semantic_model_rule: Do not add test graph nodes, pytest jobs, CI workflow steps, integration harnesses, or validation scripts as TLA+ program state/actions.
  evidence_rule: Record tests and graph runs as evidence for semantic program actions in manifests or ticket status.
  desired_sync_rule: Update this file and spec_manifest.yaml whenever scope, order, acceptance checks, or status changes.
  promotion_rule: When specs/current equals specs/desired_program_model, promote the converged model to specs/program_model.
  # Owner decision at kickoff, 2026-09-17. It overrides git-epic-workflow
  # SKILL.md rule 5 and epic-ticket.md §3 for this epic and every epic after it;
  # SI-07 writes it into the skill.
  model_ownership_rule: >-
    The EPIC AGENT owns the TLA+ work. It scaffolds each ticket's desired and
    current state before dispatch, manages validation, places the attribution
    anchors, and closes and promotes the spec ticket at wave merge. A ticket
    agent moves current toward desired, runs the spec tests, and may make SMALL
    edits to desired; a structural change to desired comes back to the epic
    agent rather than being made in the ticket. Ticket agents never run
    `close ticket`, `close_tickets.py`, or `--accept-new`.

