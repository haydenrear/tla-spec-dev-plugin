\* MF-028 spike: a REDUCED model config (1 ticket, 1 spec root) used only to
\* generate a tractable case corpus for the case-execution measurement.
\*
\* It exists because generating a corpus from MC.cfg exhausts memory parsing a
\* 695MB TLC dot dump (FINDING 6, out of scope for MF-028). The CASE SHAPE is
\* identical to MC.cfg's; only the count differs, so the measurement is unaffected.
\*
\* This is NOT the model contract. MC.cfg remains the authoritative config and is
\* what the validation matrix checks. Delete this if FINDING 6 is fixed.
SPECIFICATION Spec

CONSTANTS
  SpecRoots = {default_specs}
  Tickets = {cli_entrypoint}
  NoRoot = NoRoot
  NoReason = NoReason

INVARIANTS
  TypeInvariant
  CliInstalledRequiresBuilt
  WorkflowRequiresProject
  BudgetsRequireProject
  WorkflowRequiresBudgets
  ProjectChoosesKnownSpecRoot
  NoOpenClosedOverlap
  CurrentRequiresDesired
  SpecUnitTestsRequireCurrent
  SpecUnitTestsRequireMeasuredCorpus
  SpecUnitTestsRequireMeasuredEffects
  ClosedTicketsPassedSpecUnitTests
  WeakenedClosesCertifyNothing
  SktNamesNoEpicItCannotResolve
  SktClaimsNoMembershipItDidNotJoin
  SktVerdictCoversEverySurfaceItNames
  SktPlansNoRemovalWithoutContainment
