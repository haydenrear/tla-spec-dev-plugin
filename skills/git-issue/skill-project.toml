# Skill project manifest for git-issue.
#
# What this declares: the units an agent working IN THIS CHECKOUT needs. Every
# tracked file here — SKILL.md, its frontmatter and description, references/,
# skill-manager.toml — is skill-unit content, so the work done here is unit
# authoring and the declared units are the authorities for that work.
#
# It deliberately does NOT declare `git-issue` itself. A repo is its own source
# of truth; installing it into its own home would give an agent two copies of
# the same skill with no rule about which one it is editing.
#
# How the home is produced — read this before running `project resolve`
# ---------------------------------------------------------------------
# `project resolve` writes into whatever `SKILL_MANAGER_HOME` names. Run it
# before this checkout has its own home and it mutates the operator's global
# ~/.skill-manager. Create the local home first, point `SKILL_MANAGER_HOME` at
# it, and only then resolve:
#
#   mkdir -p .skill-manager/skills
#   SKILL_MANAGER_CLI=<epic skill-manager> \
#     bash <git-integration-repo>/scripts/bootstrap-home.sh --root "$PWD" --force
#   export SKILL_MANAGER_HOME="$PWD/.skill-manager"
#   skill-manager project resolve --project-dir "$PWD" --skip-gateway
#
# `SKILL_MANAGER_HOME` alone does not redirect the agent-home projections;
# export `CLAUDE_CONFIG_DIR`, `CLAUDE_HOME`, `CODEX_HOME` and `GEMINI_HOME` at
# this checkout's own `.claude/`, `.codex/` and `.gemini/` as well. Those are
# the paths `home describe --json`'s `env` block names and the launch shims in
# `.skill-manager/bin/launch/` export for you, which is why launching through a
# shim is the supported way in.
#
# `--allow-same-home` is NOT needed. This project's home IS its own parent home,
# and `project resolve` used to refuse that layout (skill-manager #32). The
# refusal was wrong — it fired on the recipe's normal path — and has been
# replaced by a warning naming the layout. The flag is still accepted and does
# nothing.
#
# Coords are git-only (github:/git+/file:) and they name the REPO, not
# the installed unit — see skill-publisher's references/coords-and-distribution.md.
# The table key is the installed unit name, which is what
# `.skill-manager/skills/<name>` uses.

[project]
name = "git-issue"
version = "0.4.0"
description = "Discovery-first tracker work orders: references sections, goal/evaluation linkage with the instrument that decides it, worktree/branch instructions, optional TLA+ spec close-out, and bounded assignments for one ticket in an epic shared workflow."

# --- authoring: skill-publisher is the authority on SKILL.md frontmatter, the
#     description field, skill-manager.toml, references/ pages, and on the
#     install/bind/sync round trip that ships an edit into a store ---

# --- required BY skill-publisher, not chosen here: its SKILL.md `skill-imports`
#     names `skill-manager` (references/skill-imports.md), and `project resolve`
#     refuses the whole resolve with "references missing unit" until the
#     imported unit is declared. Unit `skill_references` are followed
#     automatically; markdown `skill-imports` are not. It is also the CLI
#     surface used to prove an edit here actually reaches a store ---

# --- REPO-SPECIFIC DECISION: spec-double-compiler, test-graph and deploy-helm
#     are deliberately NOT declared, even though this unit's own SKILL.md
#     `skill-imports` names all three and skill-manager.toml lists them as hard
#     `skill_references`.
#
#     Those three are what an issue AUTHORED BY this skill tells its implementer
#     to run. They are not what an agent EDITING this skill runs: nothing in
#     this repo executes a spec workflow, a test_graph graph, or a Helm deploy —
#     there is no test_graph project and no specs/ tree here at all. The
#     `skill_references` exist so that INSTALLING git-issue elsewhere pulls them
#     in; a project manifest answers the different question of what this
#     checkout needs.
#
#     The cost is not incidental. `test-graph` references `github:haydenrear/deploy-cdc`,
#     so declaring any one of the three transitively installs deploy-helm, whose
#     three skill-script CLI dependencies each build a full ~555 MB venv. Measured
#     across the previously onboarding homes: every home that pulls deploy-helm is
#     ~1.8 GB and every home that does not is under 1 MB. This one is ~700 KB.
#
#     If you do need to read those pages while editing here, add them back —
#     the manifest is the right place for that decision and it is one line each.

# --- no [[vendored]] block: this repo tracks no symlinks and has no test_graph,
#     so no path in the working tree holds content owned by another unit.
#     Verified with `git ls-files -s | grep ^120000` -> 0 entries.

# --- SI-16/SI-17 SWEEP: the entries that used to sit here are GONE, not
#     repointed. Every unit they named -- skt, unit-authoring, skill-manager,
#     spec-double-compiler, test-graph -- is now a CONTAINED SKILL of the
#     tla-spec-dev plugin, and so is this one. They arrive together from one
#     coord. A `source = "github:haydenrear/..."` here would still RESOLVE,
#     and resolving it installs a SECOND, standalone copy of a sibling in
#     this bundle -- the silent-duplicate class in
#     skills/plugin-repository/references/imports.md section 3, and the same
#     duplication SI-02 deleted from the root manifest.
#
#     A checkout of THIS skill is now a checkout of the bundle, so an agent
#     editing it already has every sibling on disk at skills/<unit>/.
#     Nothing needs to be installed to reach them. The rationale each
#     deleted block carried is preserved in git history.
